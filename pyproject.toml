[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "amplai-foundry"
version = "3.0.0.dev3"
description = "AMPLAI V3: governed intent-to-verified-work runtime and evidence-driven meta-harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AMPLAI" }]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "jsonschema>=4.23,<5",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
visual = ["playwright>=1.49,<2", "pillow>=10,<13"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  # CI runs the suite across the runner's cores (`-n auto`); serial it took ~15 min.
  "pytest-xdist>=3.6,<4",
  # 상한을 두는 이유: CI 는 매번 최신을 받고 로컬은 설치된 것을 쓴다. 0.16 이 markdown
  # 코드 블록 포맷을 켜면서 로컬 verifier 는 PASS 인데 CI 만 FAIL 인 상태가 됐다.
  # 그 대상에 DECISIONS.md 같은 역사 기록이 들어 있어 포맷터에 맞춰 다시 쓸 수 없다.
  # 올릴 때는 별도 Work 로 diff 를 보고 올린다.
  "ruff>=0.15.21,<0.16",
  "types-jsonschema>=4.23",
]

[project.scripts]
amplai = "amplai_foundry.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amplai_foundry.runtime.contracts" = ["data/*.json", "data/schemas/*.json"]
"amplai_foundry" = ["packs/**/*.json", "packs/**/*.md"]

[tool.pytest.ini_options]
# 기본 실행은 network·브라우저·컨테이너 없이 돈다. 명령줄의 `-m` 이 이것을 이긴다.
addopts = "-q -m \"not visual and not container\""
testpaths = ["tests"]
markers = [
  "visual: 실제 qualified 브라우저를 띄우는 test. 기본 실행에서 deselect 된다. `visual` extra 와\n   설치된 browser 가 있는 host 에서만 선택한다 (design/14 §4: 미설치는 skipped PASS 가 아니라 not_run)",
  "container: 실제 docker/podman 컨테이너를 띄우는 test. 기본 실행에서 deselect 된다. scripts/sandbox_up.sh 로\n   deployment/local-container.json 이 만들어진 host 에서만 선택한다",
]
# tests/v3 와 tests/e2e 가 `rc06_rig`, `golden033` 을 top-level 로 import 한다. 이것 없이는
# pytest 의 prepend import mode 가 tests/ 를 sys.path 에 넣어 주는 것에 의존한다.
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Vendored helper skill assets keep their upstream formatting so updates stay clean.
extend-exclude = [
    ".agents", ".claude",
    # Work 030 코퍼스: base 는 demo-app 의 고정 commit 그대로이고, 과제의 hidden 시험과
    # 기준 해답은 agent 가 못 보는 판정 재료다. 형식을 이 저장소 규칙에 맞춰 고치지 않는다.
    "specs/030-meta-harness-live/corpus",
    # Work 033 corpus v2: the same kind of grading material (bases, hidden tests, reference
    # solutions); imported Work 030 tasks keep their original bytes (D-098).
    "specs/033-harness-taxonomy/corpus",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# FastAPI 의 `Depends()` 는 인자 기본값에 두는 것이 공식 idiom 이다 (V3 api_v3/server.py).
# ruff 문서가 권하는 대로 immutable call 로 선언해 B008 에서 뺀다.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["amplai_foundry"]
mypy_path = "src"

# `visual` optional extra. 설치하지 않은 환경에서도 strict 검사가 돌아야 한다.
[[tool.mypy.overrides]]
module = ["playwright.*", "PIL.*"]
ignore_missing_imports = true
