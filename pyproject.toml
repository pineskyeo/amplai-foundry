[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "amplai-foundry"
version = "3.0.0.dev3"
description = "AMPLAI V3: governed intent-to-verified-work runtime and evidence-driven meta-harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AMPLAI" }]
dependencies = [
  "pydantic>=2.8,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.12,<1",
  "jsonschema>=4.23,<5",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
visual = ["playwright>=1.49,<2", "pillow>=10,<13"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  # 상한을 두는 이유: CI 는 매번 최신을 받고 로컬은 설치된 것을 쓴다. 0.16 이 markdown
  # 코드 블록 포맷을 켜면서 로컬 verifier 는 PASS 인데 CI 만 FAIL 인 상태가 됐다.
  # 그 대상에 DECISIONS.md 같은 역사 기록이 들어 있어 포맷터에 맞춰 다시 쓸 수 없다.
  # 올릴 때는 별도 Work 로 diff 를 보고 올린다.
  "ruff>=0.15.21,<0.16",
  "types-pyyaml>=6.0.12.20240808",
  "types-jsonschema>=4.23",
]

[project.scripts]
amplai-foundry = "amplai_foundry.cli:app"
amplai = "amplai_foundry.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amplai_foundry.runtime.contracts" = ["data/*.json", "data/schemas/*.json"]
"amplai_foundry" = ["packs/**/*.json", "packs/**/*.md"]

[tool.pytest.ini_options]
# `-m "not slack_e2e"` 가 E2E 를 기본 실행에서 뺀다. `amplai-foundry verify` 는 인자 없이
# `python -m pytest` 를 부르므로 (verification/runner.py:37) 이 한 줄이 verify 를 network
# 없이 유지한다 — verify 에 stage 를 더하지 않는다 (FR-020, SC-014).
# 명령줄의 `-m` 이 이것을 이긴다. `python -m pytest -m slack_e2e` 로 E2E 만 돌린다.
addopts = "-q -m \"not slack_e2e and not visual and not container\""
testpaths = ["tests"]
markers = [
  "slack_e2e: 실제 Slack workspace 를 치는 test. 기본 실행에서 deselect 된다 (contracts H-5.1)",
  "visual: 실제 qualified 브라우저를 띄우는 test. 기본 실행에서 deselect 된다. `visual` extra 와\n   설치된 browser 가 있는 host 에서만 선택한다 (design/14 §4: 미설치는 skipped PASS 가 아니라 not_run)",
  "container: 실제 docker/podman 컨테이너를 띄우는 test. 기본 실행에서 deselect 된다. scripts/sandbox_up.sh 로\n   deployment/local-container.json 이 만들어진 host 에서만 선택한다",
]
# tests/test_slack_projection.py 가 test_governance_events 를 top-level 로 import 한다.
# 이것 없이는 pytest 의 prepend import mode 가 tests/ 를 sys.path 에 넣어 주는 것에 의존하고,
# import mode 를 바꾸면 조용히 깨진다. 의존을 명시로 바꾼다 (index.yaml W2-pytest-import-mode).
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Vendored agent skill assets keep their upstream formatting so updates stay clean.
# tools/amplai-loop-kit 도 같은 이유다 — kit 은 Python 3.6 호환을 유지하려고 % 포맷을
# 쓰고, 이 저장소가 정본이 된 뒤에도 그 형식을 지켜야 배포 대상들과 어긋나지 않는다
# (D-053). kit 을 부르는 이 저장소 코드(scripts/kit_distribute.py)는 lint 대상이다.
extend-exclude = [
    ".agents", ".ai-team", ".claude", ".specify",
    # kit 정본과 그것이 설치한 파일. kit 은 Python 3.6 호환을 유지해야 배포 대상들과
    # 어긋나지 않으므로 % 포맷과 open alias 가 남는다. 여기서 고치면 다음 설치가
    # 되돌리므로 tools/amplai-loop-kit/payload/ 에서만 고친다 (D-051, D-053).
    # kit 이 설치 목록에 script 를 더하면 이 목록에도 같이 더한다. kit 2.4.0 이
    # amplai_hosts.py 를 더했을 때 그러지 않아 block gate 셋이 한 번에 깨졌다 (D-056).
    "tools/amplai-loop-kit",
    "scripts/amplai.py", "scripts/amplai_hook.py", "scripts/amplai_hosts.py",
    "scripts/amplai_runtime.py", "scripts/amplai_supervisor.py",
    "tests/ai",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# cortex main 3a3eb46b 에서 이식한 loop runtime (D-046). 자동 수정 가능한 168건은 이미
# 적용했고, 남은 것들은 upstream 과 diff 를 유지하기 위해 남긴다 — cortex 가 이 파일들을
# 계속 고치므로 재이식 때 충돌을 줄이는 쪽이 이득이다.
#
# 이 예외는 `scripts/` 의 두 파일에만 걸린다. `src/` 와 `tests/` 는 그대로 strict 다.
[tool.ruff.lint.per-file-ignores]
"scripts/loopctl.py" = ["UP031", "SIM115", "B904", "E402", "SIM102"]
"scripts/loopv2.py" = ["UP031", "SIM115", "B904", "E402", "SIM102"]

# FastAPI 의 `Depends()` 는 인자 기본값에 두는 것이 공식 idiom 이다 (V3 api_v3/server.py).
# ruff 문서가 권하는 대로 immutable call 로 선언해 B008 에서 뺀다.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["amplai_foundry"]
mypy_path = "src"

# `visual` optional extra. 설치하지 않은 환경에서도 strict 검사가 돌아야 한다.
[[tool.mypy.overrides]]
module = ["playwright.*", "PIL.*"]
ignore_missing_imports = true
