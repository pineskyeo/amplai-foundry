[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amplai-foundry"
version = "0.2.0"
description = "Deterministic knowledge foundation for the AMPLAI Memory Layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AMPLAI" }]
dependencies = [
  "pydantic>=2.8,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0.12.20240808",
]

[project.scripts]
amplai-foundry = "amplai_foundry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amplai_foundry"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Vendored agent skill assets keep their upstream formatting so updates stay clean.
extend-exclude = [".agents", ".ai-team", ".claude", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["amplai_foundry"]
mypy_path = "src"
