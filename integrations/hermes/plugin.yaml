name: amplai-v3
version: 3.0.0-rc1
description: V3 intake/status/approval adapter for Hermes. Disabled by default; approval is authority-only.
entry_point: amplai_foundry.control_plane.hermes:HermesAdapter
feature_flags:
  enabled: false
tools:
  - name: amplai.intake
    api: POST /api/v3/intents
    idempotency: "hermes:<channel>:<external_message_id>"
    identity: operator-verified binding required (IDENTITY_UNBOUND otherwise)
  - name: amplai.status
    api: GET /api/v3/goals/{goal_id}
    projection: user-facing labels only; no lease/outbox/fence fields
  - name: amplai.approve
    api: POST /api/v3/authority/grants
    note: forwarded unchanged; the bound actor needs grant.issue and an existing Decision
never_exposes:
  - activation
  - shell
  - git
  - file-edit
  - delegation
  - raw MCP
  - canonical knowledge write
