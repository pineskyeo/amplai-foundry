notes:
- Hermes First, Event-driven Steward, No Direct Canonical Write, Deterministic Renderer와
  Evidence-required Candidate는 Source에서 Decision 후보로 제시됐지만 명시적 최종 선택으로 해석하지 않는다.
- source에 제시된 roadmap_update와 ignore는 현재 MemoryObject kind가 아니라 intake/proposal 분류
  후보로만 취급한다.
- Source가 말하는 Question Candidate 또는 Map의 자동 처리는 non-canonical candidate/runtime 처리와
  혼동될 수 있으므로, 본 Proposal은 현 Proposal review 원칙을 우회하는 자동 apply를 제안하지 않는다.
