notes:
- Source의 전체 referenced conversation은 Original Content line 4(Vault file line 32)의
  한 physical line에 저장돼 현재 line_range locator로 세부 claim을 분리할 수 없다. 각 operation reason과
  summary에 해당 section 의미를 제한해 기록한다.
- 현재 curation retrieval은 이미 active knowledge를 cross-kind로 검색한다. 이번 Proposal은 cross-kind
  search 신규 구현이 아니라 semantic recall, candidate-status coverage와 structured ComparisonResult
  경계를 제안한다.
- REFINES를 모든 kind에 UPDATE로 매핑하지 않는다. Decision 변경은 기존 supersedes lifecycle 계약을 따라야
  하며 Principle과 Architecture 의미 변경도 review 대상이다.
- SemanticAnchor 이름, ID, persistence, relation enum, confidence threshold와 pass threshold는
  승인·실험 전까지 provisional이다.
- 외부 embedding service, vector DB, 자동 merge/apply, 기존 Vault 대규모 migration과 Phase 1A
  완료 표시는 포함하지 않는다.
