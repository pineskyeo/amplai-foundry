name: CI

on:
  # PR branches are checked by pull_request; push runs only on main, so a PR commit runs once.
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Parallel across the runner's cores; worksteal keeps a few long e2e tests from idling workers.
      - run: python -m pytest -n auto --dist worksteal
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Work 034 OD-18 (M-16..M-20): the registered checks of the `ci` moment. pytest, ruff and
      # mypy run as the steps above, so they are skipped here (the run record lists them as
      # skipped). A PR is compared with its base branch's checks.lock.json (M-19).
      - name: amplai checks run --when ci
        run: |
          base=()
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            base=(--base-ref FETCH_HEAD)
          fi
          amplai checks run --when ci "${base[@]}" --record-dir "$RUNNER_TEMP/check-runs" \
            --skip check.tool_pytest --skip check.tool_ruff --skip check.tool_ruff_format \
            --skip check.tool_mypy
      # M-20: the run record (which check passed at which version), kept with the workflow run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-runs-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/check-runs/
          if-no-files-found: ignore
