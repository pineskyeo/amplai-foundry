name: CI

on:
  # PR branches are checked by pull_request; push runs only on main, so a PR commit runs once.
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: amplai-foundry schema check
      - run: amplai-foundry lint vault/
      - run: amplai-foundry stats vault/
      - run: python tools/amplai-loop-kit/seal.py --verify
      - run: python tools/amplai-loop-kit/selftest.py
      - run: python scripts/loopctl.py doctor
