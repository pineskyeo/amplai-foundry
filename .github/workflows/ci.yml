name: CI

on:
  # PR branches are checked by pull_request; push runs only on main, so a PR commit runs once.
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Parallel across the runner's cores; worksteal keeps a few long e2e tests from idling workers.
      - run: python -m pytest -n auto --dist worksteal
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
