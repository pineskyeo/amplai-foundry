name: CI

on:
  # PR branches are checked by pull_request; push runs only on main, so a PR commit runs once.
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Parallel across the runner's cores; worksteal keeps a few long e2e tests from idling workers.
      - run: python -m pytest -n auto --dist worksteal
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Work 034 OD-18 (M-16..M-20): the registered checks of the `ci` moment. pytest, ruff and
      # mypy run as the steps above; only they may be skipped (checks.lock.json `ci_external`)
      # and the run ends `pass_with_skips`. The check list is compared with the base: the PR's
      # base branch, or on a push the commit before it (none on a branch's first push, all-zero
      # SHA). The base's own check policy code decides (M-19).
      - name: amplai checks run --when ci
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$GITHUB_BASE_REF:refs/amplai/check-base"
            base=(--base-ref refs/amplai/check-base)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "+$BEFORE:refs/amplai/check-base"
            base=(--base-ref refs/amplai/check-base)
          fi
          amplai checks run --when ci "${base[@]}" --record-dir "$RUNNER_TEMP/check-runs" \
            --skip check.tool_pytest --skip check.tool_ruff --skip check.tool_ruff_format \
            --skip check.tool_mypy
      # M-20: the run record (which check passed at which version), kept with the workflow run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-runs-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/check-runs/
          if-no-files-found: ignore
