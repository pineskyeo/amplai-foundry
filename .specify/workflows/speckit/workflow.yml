schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "1.0.0"
  author: "GitHub"
  description: "Runs specify → plan → tasks → implement with review gates"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The four commands below (specify, plan, tasks, implement) are core
    # spec-kit commands provided by every integration. The list here is an
    # advisory, non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema -- it is NOT a closed set. The workflow runs
    # against any integration the project was initialized with, including
    # ones not listed below, as long as that integration provides the four
    # core commands referenced in ``steps``.
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  # speckit.tasks 는 /taskify 와 중복이라 제거했다 (skill 디렉터리도 삭제).
  # task 분해는 /taskify 가 맡는다 — vertical slice 강제, ID 불변, acceptance 를
  # repo 에 실제 있는 명령으로만 쓴다.
  #
  # 2026-08-03: 여기서 끊겨 있었다. tasks 단계만 gate 로 바꾸고 다음 implement 단계를
  # 안 맞춰서, speckit.implement 가 요구하는 tasks.md 가 영영 안 생겼다
  # (.claude/skills/speckit-implement/SKILL.md:180 -> check-prerequisites.sh
  #  --require-tasks). 그 skill 의 복구 안내는 삭제된 /speckit-tasks 를 가리켜서
  # 빠져나갈 수도 없었다. 아래 3단계로 닫았다.
  - id: tasks
    type: gate
    message: |
      1. /taskify 로 task manifest 를 만든다.

           /taskify <spec.md 또는 plan.md 경로와 범위>

         산출물: <manifest-dir>/index.yaml + <FEATURE>-T001.yaml …
         설계 소스가 specs/ 밖이면 <manifest-dir> 는 .amplai/tasks/<slug>/ 다.

      2. validator 를 돌린다. 통과해야 다음으로 간다.

           python3 .claude/skills/taskify/scripts/validate_task_manifest.py <manifest-dir>

      3. speckit 이 읽을 tasks.md 를 **생성**한다. 손으로 쓰지 않는다.

           python3 .specify/scripts/taskify_to_tasks_md.py <manifest-dir> \
               --out <feature-dir>/tasks.md

         **--out 을 반드시 준다.** manifest 는 .amplai/tasks/ 아래 있고 speckit 은
         feature dir 에서 tasks.md 를 찾는다 — 서로 다른 디렉터리다. 기본값으로
         돌리면 .amplai/tasks/tasks.md 에 써서 speckit 이 못 찾는다.

         생성된 tasks.md 는 순서·파일소유만 담은 목차다. 계약(acceptance,
         invariants, forbidden_paths)은 manifest YAML 에 그대로 있다.
         blocked task 는 실행 단계에서 빠진다.

      셋 다 끝났으면 approve 한다.
    options: [approve, reject]
    on_reject: abort

  # tasks.md 는 생성물이다. implement 는 task 마다 tasks.md 의 `manifest:` 줄이
  # 가리키는 YAML 을 열어 acceptance·invariants·forbidden_paths 를 계약으로 삼는다.
  # 체크리스트만 보고 구현하면 그 계약이 통째로 빠진다.
  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # Constitution 원칙 V — 구현 완료는 gate 통과가 아니다. 서로 다른 관점의 독립
  # reviewer 셋이 blocker 0건을 확인해야 열린다. 절차는 AGENTS.md 의
  # "Spec-Kit Adoption" 절에 있다.
  - id: review-implementation
    type: gate
    message: |
      Run the three-reviewer subagent review before closing this cycle.

        1. contract reviewer      — 계약과 acceptance 충족 여부
        2. failure/recovery reviewer — 실패 경로, timeout, 복구
        3. regression reviewer    — 기존 동작 회귀

      P0 / P1 / Blocking-P2 가 하나라도 있으면 reject 한다.
      Advisory 는 기록하고 판단한다.
      review 를 실행하지 않았다면 approve 하지 않는다.
    options: [approve, reject]
    on_reject: abort
