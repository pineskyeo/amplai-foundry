  "implementation": {
    "guidance": [
      "One bounded full-document reference tokenizer feeds security filtering and dependency capture. Preserve exact line locations and existing inline-code/fence/tree dependency semantics.",
      "Handle whitespace/line endings, nested labels, balanced/escaped destinations, angle paths, titles, multiline definitions and quote-aware multiline HTML attributes. Reject unsupported ambiguous reference forms without identifiers before output; do not patch only the four observed examples.",
      "Keep percent-decoded URI paths exact: encoded literal # and semicolon are filename bytes, not fragments or prose decoration. Separate Markdown/HTML escape normalization from human inline-code :line locators; never silently trim or decode twice.",
      "Cover all consumers/current/history, actual CLI/internal HTML, installed payload, valid same-security controls and dependency-drift invalidation. Preserve external HTML approval boundary.",
      "Keep Python3.6 grammar/stdlib compatibility limits. No new parser dependency, full CommonMark rendering claim, mandatory-rule waiver or automatic source security classification."
    ],
    "invariants": [
      "Existing work/design controller, native Project Store and transaction installer remain authoritative",
      "Preserve unrelated user content, historical provenance and current host trust",
      "No synthetic result is native host, Python3.6 or RHEL7 evidence"
    ],
    "non_goals": [
      "New Platform storage/API/auth/ontology service",
      "Automatic fleet activation or destructive cleanup"
    ]
  },
