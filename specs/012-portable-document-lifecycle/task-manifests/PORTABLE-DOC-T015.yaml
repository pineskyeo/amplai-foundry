  "implementation": {
    "guidance": [
      "Define finite shared single-URL attribute and inert attribute sets; recognize namespace tags/attributes. Unknown non-inert attributes reject, rather than silently skipping future reference forms.",
      "Compound URL lists/srcset, embedded CSS/SVG URL forms/srcdoc/refresh and active embedded-language containers reject UNSUPPORTED_PARSER before output. Do not claim full HTML/CSS/browser parsing or use comma-splitting guesses.",
      "Reject local file schemes including no-authority/localhost/relative variants without resolving or reading real external files. Retain one-time syntax/entity/percent decoding and original URI exactness.",
      "Test lower-security rejection through all seven current/history consumers, actual CLI/build, installed payload, exact target drift and new memory bound. Retain renderer escaping/XSS evidence even when intake rejects unsupported active markup.",
      "Mirror/reseal; fresh guides, full Context and canonical S08/all three R4 reviews remain separate mandatory steps.",
      "Apply the already configured Work-memory exclusion before impact-only reference parsing, not after. Default direct reference discovery, current guide validation and unknown-role files remain strict; retain raw review bytes. Do not add a new exclusion role or grammar bypass.",
      "Back-reference candidate discovery uses bounded lean extraction without retained declaration context; conservatively include inline-code local candidates, including relative extensionless names. Preserve reference offsets, unsupported-HTML rejection and token/work limits. Exact dependency and public source validation retain full context. Do not exclude or alter the retained Vault source to make integration pass.",
      "Candidate-only matching preserves literal names when legacy fnmatch rejects malformed ranges. Unknown authority-bearing origin URIs may be classified as unavailable external candidates without fetching or interpreting their path; file/data/javascript/vbscript remain rejected. Exact dependency and every current/history visibility consumer keep rejecting unknown schemes.",
      "Typed-reference line enumeration must share the lexer's CR/LF/CRLF boundaries. Non-physical Unicode/control separators must not shift code/fence exclusion onto another reference and suppress exact dependency binding or impact discovery."
    ],
    "invariants": [
      "Existing work/design controller, native Project Store and transaction installer remain authoritative",
      "Preserve unrelated user content, historical provenance and current host trust",
      "No synthetic result is native host, Python3.6 or RHEL7 evidence"
    ],
    "non_goals": [
      "New Platform storage/API/auth/ontology service",
      "Automatic fleet activation or destructive cleanup"
    ]
  },
  "acceptance": {
    "behaviors": [
      {
        "id": "PORTABLE-DOC-T015-AC1",
        "given": "Reviewed or historical source with HTML destinations, unsupported compound/embedded forms, or file URIs naming a restricted local file",
        "when": "Current/history consumers, actual inventory/query/index/build or installed tools process the source",
        "then": "Every supported single destination is classified before output and binds exact dependency bytes; unsupported syntax/file schemes reject without identifier disclosure. Safe same-security/inert controls and bounded memory remain"
      },
      {
        "id": "PORTABLE-DOC-T015-AC2",
        "given": "Retained Work reports contain unsafe reference syntax as diagnostic examples",
        "when": "The current repository impact pass discovers current guide back-references",
        "then": "Existing policy-defined Work memory is not parsed as a current guide; its raw bytes remain preserved. Default direct scans and current/unclassified documents still reject unsupported syntax."
      },
      {
        "id": "PORTABLE-DOC-T015-AC3",
        "given": "A retained source contains many inline-code candidates in one paragraph and a relative extensionless dependency",
        "when": "Impact discovers back-reference candidates",
        "then": "Candidate extraction avoids quadratic retained context while preserving relative extensionless matches, literal bracketed names, local references beside opaque origins and code-span offsets. Unknown origin candidates are never fetched or publication-approved. Exact dependency/public validation keep their context, limits and fail-closed behavior; original source bytes and scan roots are unchanged."
      },
      {
        "id": "PORTABLE-DOC-T015-AC4",
        "given": "A document has a non-physical Unicode/control separator before an ordinary local Markdown link",
        "when": "Canonical or installed-payload full/lean extraction, dependency snapshot, freshness and impact process the source",
        "then": "The real link keeps its physical source location and exact target dependency; target drift invalidates freshness. LF, CR and CRLF plus genuine code/fence controls preserve behavior."
      }
    ],
