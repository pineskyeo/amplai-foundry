  "implementation": {
    "guidance": [
      "Keep literal/code URL visibility checks and add all supported typed local reference forms without introducing a competing grammar or changing exact URI decoding.",
      "Reuse bounded local resolution and directory/glob membership; existing optional local targets cannot bypass security through known_absent/ignore hints. Preserve missing-optional/required reference review semantics.",
      "Classify logical aliases and actual in-repository targets together; known higher classifications must not be weakened by a lower alias route. Out-of-repository/unknown targets fail closed.",
      "Require explicit existing metadata-model classifications for real guide source inputs where absent; no default-allow, blanket exception, host-setting write or private source disclosure.",
      "Typed code/tree text does not become a navigable link or a newly selected release document. Existing real Markdown-link bundle membership remains strict.",
      "Deliver the new test_document_typed_visibility.py harness explicitly: source/payload, seven consumers and history, actual CLI/lower-security HTML, metadata/title, directory/glob/alias and same-security controls. Rebuild current guides/release/HTML after full integration.",
      "Real-guide visibility is a local S17 precondition. The original refreshed guide/release/HTML acceptance is retained explicitly in T008 after S18, not waived or certified by this read-only check."
    ],
    "invariants": [
      "Existing work/design controller, native Project Store and transaction installer remain authoritative",
      "Preserve unrelated user content, historical provenance and current host trust",
      "No synthetic result is native host, Python3.6 or RHEL7 evidence"
    ],
    "non_goals": [
      "New Platform storage/API/auth/ontology service",
      "Automatic fleet activation or destructive cleanup"
    ]
  },
  "acceptance": {
    "behaviors": [
      {
        "id": "PORTABLE-DOC-T017-AC1",
        "given": "A reviewed or historical source names a restricted local document using required inline code, tree, directory/glob or an existing optional typed path",
        "when": "Any current/history consumer, installed CLI or lower-security offline view derives identities or content",
        "then": "The reference is rejected before output without its identifier, including policy-hint and alias cases; ordinary same-security targets remain usable."
      },
      {
        "id": "PORTABLE-DOC-T017-AC2",
        "given": "The same visible text mixes exact Markdown URIs with typed code/tree targets",
        "when": "Dependency freshness, selection and view validation run",
        "then": "Both recognized reference families retain exact bounded target identity; legacy literal/code URI checks and real-link bundle strictness remain intact."
      },
      {
        "id": "PORTABLE-DOC-T017-AC3",
        "given": "The existing internal guides retain their authored content and recognize real typed source inputs",
        "when": "The read-only current-guide reference-visibility verifier executes before final release publication",
        "then": "Every present typed target has an explicit classification or blocks; known bare workflow/system notation is not a source target, with explicit/structural/unknown-path guards preserved. No generic allow, source deletion, guide-body evasion or security-label promotion makes it pass."
      }
