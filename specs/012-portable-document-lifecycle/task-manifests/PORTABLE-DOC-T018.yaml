    "guidance": [
      "Use the existing transaction and validated borrowed-file mode rather than package mode for unchanged reinstall/update; preserve the receipt needed for uninstall restoration.",
      "Keep installer-created file mode updates distinct, and retain existing local drift/conflict and force boundaries.",
      "Test borrowed raw payload and marker-composed files with restrictive modes through first install, repeated install, relevant package update, uninstall and non-mutating conflict. Use disposable targets only.",
      "Do not add new installer flags, ownership adoption, Store binding, actual app installation or host trust change."
    ],
