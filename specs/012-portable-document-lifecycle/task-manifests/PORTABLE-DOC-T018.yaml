      "Existing work/design controller, native Project Store and transaction installer remain authoritative",
      "Preserve unrelated user content, historical provenance and current host trust",
      "No synthetic result is native host, Python3.6 or RHEL7 evidence"
    ],
    "non_goals": [
      "New Platform storage/API/auth/ontology service",
      "Automatic fleet activation or destructive cleanup"
    ]
  },
  "acceptance": {
    "behaviors": [
      {
        "id": "PORTABLE-DOC-T018-AC1",
        "given": "An identical pre-existing baseline file has mode0600, including a baseline-plus-extension composed file",
        "when": "The same package is installed twice and then uninstalled in a disposable target",
        "then": "Borrowed status, user mode and original bytes remain preserved; no same-package permission widening or lost restoration mode occurs."
