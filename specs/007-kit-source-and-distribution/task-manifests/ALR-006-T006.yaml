schema_version: "1.0"

id: ALR-006-T006
title: 세 앱에 kit 2.3.0 을 실제로 배포한다
type: operations
status: blocked

goal:
  outcome: >
    amplai-foundry·synapse·cortex 에 kit 2.3.0 이 설치되고 각 저장소의 검증이 통과한다.
    세 앱의 install record 가 2.3.0 이다.
  user_value: >
    세 앱이 같은 Project Store 규약을 공유하는 상태가 된다.

source:
  feature: ALR-006
  files:
    - path: specs/007-kit-source-and-distribution/work-contract.json
      section: AC-010
  requirements:
    - AC-010
    - AC-014
  decisions:
    - D-053
    - D-051

scope:
  include:
    - kit_distribute.py --all 로 세 앱에 2.3.0 설치
    - 설치 후 각 저장소 검증 — amplai-foundry 는 doctor + verifier v2 + pytest, 나머지는 각자 doctor
    - amplai-foundry 의 lint 예외 추가 (D-051 이 정한 per-file-ignores 선례)
    - .ai-team/README.md 에 Scope freeze·Directory ownership 예외 각주 (D-051)
    - test 기준선 이동을 messenger CURRENT_ITEM.md 에 기록 (D-051 AC-010)
  exclude:
    - synapse tools/amplai-loop-kit/ 삭제 (T007 이 PR 내용만 준비한다)
    - supervisor 를 켜는 것 (--run)
    - Store 를 자동 생성하는 것 — 사람이 경로를 정한다
  allowed_paths:
    - pyproject.toml
    - .ai-team/**
    - scripts/amplai*.py
    - tests/ai/**
    - .claude/settings.json
    - .gitignore
    - docs/workstreams/**
    - specs/007-kit-source-and-distribution/**
  forbidden_paths:
    - src/**
    - vault/**

dependencies:
  tasks:
    - ALR-006-T003
    - ALR-006-T005
  external:
    - id: EXT-GIT-PUBLISH
      name: git_publish 승인 — permission check 가 prohibited 를 낸다
    - id: EXT-TARGET-CLEAN
      name: synapse·cortex 저장소의 working tree 가 깨끗해야 한다
    - id: EXT-STORE-PATH
      name: Store 경로(AMPLAI_PROJECT_HOME)를 사람이 정해야 한다

implementation:
  guidance:
    - 전체 dry-run 이 통과한 것을 먼저 확인하고 시작한다
    - synapse 는 2.2.0 → 2.3.0 갱신 경로다. 설치물을 손댔는지 먼저 확인한다
    - 설치 후 test 수를 두 방법으로 세고 둘 다 적는다 (round 21 Stop rule)
    - 각 저장소의 검증은 그 저장소의 도구로 한다. 이쪽 verifier 가 대신하지 않는다
  invariants:
    - src/ 와 vault/ 를 건드리지 않는다
    - 다른 저장소에서 설치 산출물 외의 파일이 바뀌지 않는다
  non_goals:
    - 다른 저장소의 규약이나 문서를 고치는 것

acceptance:
  behaviors:
    - id: AC-01
      given: 세 대상이 설정되고 전체 dry-run 이 통과한 상태
      when: kit_distribute.py --all 을 돌린다
      then: 세 앱의 install record 가 2.3.0 이다
    - id: AC-02
      given: 설치된 amplai-foundry
      when: doctor, verifier --profile v2, pytest 를 돌린다
      then: 전부 통과하고 test 수 증가분이 kit tests/ai 파일의 test 수와 같다
    - id: AC-03
      given: 설치된 synapse 와 cortex
      when: 각 저장소의 doctor 를 돌린다
      then: 각각 통과한다
    - id: AC-04
      given: 설치 후의 amplai-foundry
      when: .ai-team/README.md 를 읽는다
      then: Scope freeze·Directory ownership 예외 각주가 있고 D-051 을 인용하며 본문은 무수정이다
  commands:
    - id: distribute
      kind: integration
      run: .venv/bin/python scripts/kit_distribute.py --all
      required: true
    - id: verify-versions
      kind: integration
      run: .venv/bin/python scripts/kit_distribute.py --verify
      required: true
    - id: doctor
      kind: lint
      run: python3 scripts/loopctl.py doctor
      required: true
    - id: verifier
      kind: test
      run: .venv/bin/python .ai-team/verifiers/run.py --profile v2
      required: true
    - id: pytest
      kind: test
      run: .venv/bin/python -m pytest -q
      required: true
  manual_checks:
    - id: MC-01
      observer: implementation agent
      action: >-
        설치 뒤 synapse 와 cortex 각각에서 그 저장소의 loopctl doctor 를 돌리고, synapse 는
        기존 tests/ai 도 함께 돌린다.
      expected: 두 저장소의 doctor 가 각각 통과하고 synapse 의 기존 test 가 깨지지 않는다.
      reason_not_automated: >-
        두 저장소는 이 저장소의 verifier registry 범위 밖이라 여기서 자동 gate 로 만들 수 없다.
  evidence:
    - type: command_output
      source: distribute
      required: true
    - type: command_output
      source: verify-versions
      required: true
    - type: command_output
      source: pytest
      required: true

risk:
  level: high
  concerns:
    - 다른 저장소를 실제로 바꾼다. git_publish 가 prohibited 이므로 사람 승인이 필요하다
    - synapse 는 갱신 경로라 marker·hook·policy 가 다시 쓰인다
    - test 기준선이 움직여 Package 5 review 에 영향을 준다
  approvals:
    - git_publish
    - architecture_change

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: false
  required_evidence_present: false
  completed_at: null
  evidence_paths: []

handoff:
  expected_changes:
    - 세 저장소의 설치 산출물
    - pyproject.toml, .ai-team/README.md 각주
    - docs/workstreams/messenger-governance-closure-v3/CURRENT_ITEM.md — test 기준선
  notes:
    - status 가 blocked 인 이유는 git_publish 승인이 없기 때문이다. 승인되면 ready 로 올린다
