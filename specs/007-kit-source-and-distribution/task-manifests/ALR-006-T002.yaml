schema_version: "1.0"

id: ALR-006-T002
title: kit 문서에서 특정 앱 전제를 걷어내 공용 패키지로 만든다
type: feature
status: done

goal:
  outcome: >
    kit 문서가 어느 앱도 특별 취급하지 않는다. README 첫 줄, reference 통합 문서(파일명 포함),
    설치 예시가 중립이고, 특정 앱에만 있는 marker 대상 셋이 왜 optional 인지 적혀 있다.
  user_value: >
    cortex 와 amplai-foundry 가 kit 을 읽을 때 "이건 synapse 용" 이라고 느끼지 않는다.
    공용 kit 이 특정 앱의 파일 배치를 전제하지 않는다는 사실이 문서로 확인된다.

source:
  feature: ALR-006
  files:
    - path: specs/007-kit-source-and-distribution/plan.md
      section: "4. 공용화 — 무엇을 고치나"
    - path: specs/007-kit-source-and-distribution/work-contract.json
      section: AC-003
  requirements:
    - AC-003
    - AC-004
  decisions:
    - D-053

scope:
  include:
    - README.md 첫 줄과 설치 예시 경로를 중립화한다
    - reference/SYNAPSE_INTEGRATION.md 를 REFERENCE_INTEGRATION.md 로 바꾸고 본문을 중립화한다
    - examples/PROJECT_STORE_QUICKSTART.md 와 payload INSTALLATION.md 의 예시를 중립화한다
    - reference/TEST_REPORT.md 는 시험 기록이므로 각주로 출처만 남기고 본문을 보존한다
    - marker 대상 셋(handoff 둘, AUTONOMY_POLICY.md)이 optional 인 이유를 문서에 적는다
    - CHECKSUMS.sha256 을 재생성한다
  exclude:
    - payload/tests/ai/*.py 의 fixture 앱 이름 (예시 데이터다. 편향이 아니다)
    - 설치 로직 변경 — manifest.json·install.py·fragments 는 이미 중립이다
    - supervisor 통합, 배포 설정
  allowed_paths:
    - tools/amplai-loop-kit/README.md
    - tools/amplai-loop-kit/reference/**
    - tools/amplai-loop-kit/examples/**
    - tools/amplai-loop-kit/payload/.ai-team/runtime/INSTALLATION.md
    - tools/amplai-loop-kit/manifest.json
    - tools/amplai-loop-kit/CHECKSUMS.sha256
    - specs/007-kit-source-and-distribution/**
  forbidden_paths:
    - tools/amplai-loop-kit/payload/tests/**
    - tools/amplai-loop-kit/install.py
    - src/**
    - vault/**

dependencies:
  tasks:
    - ALR-006-T001
  external: []

implementation:
  guidance:
    - 이관 전 기준값을 먼저 센다 — tests 제외 synapse 언급 20건이 기준이다
    - 파일명을 바꾸면 manifest 의 owned_files 와 CHECKSUMS 가 함께 움직인다. 전수로 대조한다
    - marker 대상 셋은 지우지 않는다. required false 라 없는 앱에서도 설치된다
    - 남긴 언급마다 왜 남겼는지 적는다. 빈 칸보다 거짓 칸이 나쁘다 (round 19 R19-1)
  invariants:
    - 설치 동작이 안 바뀐다. selftest 와 세 앱 dry-run 결과가 이관 직후와 같다
    - 테스트 fixture 를 건드리지 않는다
    - CHECKSUMS 가 실제 파일과 일치한다
  non_goals:
    - kit 의 기능을 바꾸는 것
    - 특정 앱에만 있는 marker 대상을 manifest 에서 제거하는 것

acceptance:
  behaviors:
    - id: AC-01
      given: 이관 직후의 synapse 언급 건수 (tests 제외 20건)
      when: 공용화 후 같은 기준으로 재계수한다
      then: 남은 건수가 줄었고, 남은 것마다 왜 남았는지 문서에 적혀 있다
    - id: AC-02
      given: reference/SYNAPSE_INTEGRATION.md
      when: 파일 목록을 확인한다
      then: 그 이름의 파일이 없고 중립 이름의 파일이 있으며 manifest·CHECKSUMS 가 함께 갱신됐다
    - id: AC-03
      given: 특정 앱에만 있는 marker 대상 셋
      when: 문서에서 그 셋을 찾는다
      then: 왜 optional 인지, 없는 앱에서 어떻게 되는지 적혀 있다
    - id: AC-04
      given: 공용화된 kit
      when: selftest 와 세 앱 dry-run 을 돌린다
      then: selftest ok true, 세 앱 모두 ok true 이고 action 수가 이관 직후와 같다
  commands:
    - id: selftest
      kind: test
      run: python3 tools/amplai-loop-kit/selftest.py
      required: true
    - id: dryrun-self
      kind: integration
      run: python3 tools/amplai-loop-kit/install.py --target . --app-id amplai-foundry --project-id ai-platform --dry-run
      required: true
    - id: doctor
      kind: lint
      run: python3 scripts/loopctl.py doctor
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: selftest
      required: true
    - type: command_output
      source: dryrun-self
      required: true

risk:
  level: low
  concerns:
    - 파일명 변경이 manifest·CHECKSUMS·문서 상호참조 셋을 동시에 건드린다. 하나만 고치면 selftest 가 깨진다
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-28"
  evidence_paths:
    - tools/amplai-loop-kit/README.md
    - tools/amplai-loop-kit/reference/REFERENCE_INTEGRATION.md

handoff:
  expected_changes:
    - tools/amplai-loop-kit/README.md
    - tools/amplai-loop-kit/reference/REFERENCE_INTEGRATION.md (이름 변경)
    - tools/amplai-loop-kit/manifest.json, CHECKSUMS.sha256
  notes: []
