  "acceptance": {
    "behaviors": [
      {
        "id": "T-001",
        "given": "Actor A and Object B in different projects",
        "when": "GET/POST with B ID under A token",
        "then": "scoped NOT_FOUND or SCOPE_DENIED; no content/event leakage [Cross-project object denial]"
      },
      {
        "id": "T-002",
        "given": "worker token with caller actor.kind=human/admin",
        "when": "submit approval-related command",
        "then": "server ActorContext prevails; no grant issued [Actor JSON forgery]"
      },
      {
        "id": "T-003",
        "given": "same actor scope key and payload already committed",
        "when": "repeat command after lost ACK",
        "then": "original response returned; no second work/effect [Idempotent exact repeat]"
      },
      {
        "id": "T-004",
        "given": "same scoped key with different payload",
        "when": "repeat altered command",
        "then": "IDEMPOTENCY_CONFLICT; original state unchanged [Idempotency payload conflict]"
      },
      {
        "id": "T-005",
        "given": "listener has configured authentication",
        "when": "request worker/effect/status endpoints without token",
        "then": "401; no anonymous status/data leakage [Missing authentication]"
      },
      {
        "id": "T-006",
        "given": "intent names known app alias and registry evidence",
        "when": "resolve target_hints empty",
        "then": "verified target binding produced; no TARGET_APP_REQUIRED based solely on hint absence [Resolve without target hint]"
      },
      {
        "id": "T-007",
        "given": "two authorized apps share an alias",
        "when": "resolve intent",
        "then": "hold + one consolidated question; no write dispatch [Ambiguous target hold]"
      },
      {
        "id": "T-008",
        "given": "build commands and invariants are in canonical repo facts",
        "when": "resolve rough request",
        "then": "read sources, do not ask already-answerable technical questions [Existing fact avoids question]"
      },
      {
        "id": "T-009",
        "given": "objective says make better, no measurable/human rubric bindings",
        "when": "freeze contract",
        "then": "ACCEPTANCE_UNBOUND or critic blocking findings [Unverifiable goal rejected]"
      },
      {
        "id": "T-010",
        "given": "mode design and requested source implementation effect",
        "when": "admission/dispatch",
        "then": "DESIGN_SCOPE_VIOLATION; only design artifact writes allowed [Design stays design]"
      },
      {
        "id": "T-011",
        "given": "planner infers scope from non-authoritative text",
        "when": "create contract",
        "then": "origin=inferred with evidence/unknown status; no invented authorization [Assumption disclosed]"
      },
      {
        "id": "T-012",
        "given": "same blocking ambiguity remains after configured rounds",
        "when": "planner/critic repeat",
        "then": "HOLD with unresolved issue, no indefinite negotiation [Critic budget bounded]"
      },
      {
        "id": "T-013",
        "given": "two acceptance rows share same ID",
        "when": "semantic validation",
        "then": "reject duplicate criterion IDs [Criteria ID collision]"
      },
      {
        "id": "T-014",
        "given": "grant bound to contract v1; v2 changes target",
        "when": "activate v2 then request effect using v1 grant",
        "then": "GRANT_STALE; reauthorization required [Contract revision invalidates grant]"
      },
      {
        "id": "T-087",
        "given": "meta proposer submits its own promotion as authorized human",
        "when": "promote",
        "then": "authority rejects forged role [Self-approval denied]"
      },
      {
        "id": "T-088",
        "given": "canary produces unknown effect/security incident",
        "when": "next scheduler tick",
        "then": "abort new admission, cancel/reconcile active runs, baseline fallback [Canary kill switch]"
      },
      {
        "id": "T-089",
        "given": "two promotions reference same previous active release",
        "when": "promote concurrently",
        "then": "one wins, other conflict; no mixed pointer state [Active release CAS]"
      },
      {
        "id": "T-090",
        "given": "previous release backup contains old grant state",
        "when": "rollback code/data",
        "then": "latest revocations retained; no resurrected access [Rollback keeps revocations]"
      },
      {
        "id": "T-091",
        "given": "new release promoted while old Run active",
        "when": "read run context/continue",
        "then": "old Run uses old composition or explicit checkpoint; no file overwrite mutation [In-flight composition pinned]"
      }
    ],
