        "then": "HOLD; no unapproved cloud transmission [Cloud fallback prohibited]"
      },
      {
        "id": "T-076",
        "given": "worker prompt/tool asks for production token",
        "when": "secret access",
        "then": "broker handle only or deny; no raw long-lived secret in context/log [Credential isolation]"
      },
      {
        "id": "T-077",
        "given": "parent limited scope; child asks wider root",
        "when": "delegate",
        "then": "subset intersection; deny escalation [Native subagent escape]"
      },
      {
        "id": "T-078",
        "given": "AuthorityService unreachable before write",
        "when": "admission/effect",
        "then": "HOLD; cached grant not treated perpetual [Missing authority]"
      },
      {
        "id": "T-099",
        "given": "lease/run/outbox committed, dispatch not yet sent",
        "when": "restart",
        "then": "same dispatch correlation; no duplicate active lease [Claim commit crash]"
      },
      {
        "id": "T-100",
        "given": "worker process started but ACK lost",
        "when": "resend dispatch",
        "then": "worker journal/probe yields existing handle, no duplicate spawn [Spawn ACK lost]"
      },
      {
        "id": "T-101",
        "given": "consumer committed inbox but ACK lost",
        "when": "redelivery",
        "then": "inbox dedupe; no second state transition [Outbox delivery duplicate]"
      },
      {
        "id": "T-102",
        "given": "parent exited but child process/tool persists",
        "when": "cancel goal",
        "then": "pending status until child/effect reconciled, not falsely cancelled [Cancel child orphan]"
      },
      {
        "id": "T-103",
        "given": "crash between state update and event insertion within transaction",
        "when": "recover",
        "then": "both commit or neither; no state without event [State/event atomicity]"
      },
      {
        "id": "T-104",
        "given": "live DB configured on unsupported shared mount",
        "when": "startup",
        "then": "reject unsupported topology; no misleading HA mode [SQLite network path]"
      },
      {
        "id": "T-105",
        "given": "backup restored before latest external receipts",
        "when": "resume writes",
        "then": "new epoch, authoritative sync and effect reconciliation before admission [Restore unknown effects]"
      },
      {
        "id": "T-106",
        "given": "blob upload cannot finish",
        "when": "commit/recovery",
        "then": "no registry success pointing to missing data; bounded cleanup [Disk full during artifact]"
      },
      {
        "id": "T-107",
        "given": "isolated test app, qualified baseline driver, frozen authority/policy",
        "when": "rough intent to contract/graph/run/evidence/global verify",
        "then": "every required boundary passes with current refs; no fabricated runtime pass [Full V3 representative end-to-end]"
      },
      {
        "id": "T-108",
        "given": "direct/discovery/deliberative/bounded profiles",
        "when": "reach a mandatory boundary under fast/tiny flag",
        "then": "same invariant enforcement; only legitimate N/A rule accepted [Gate applicability cannot bypass]"
      },
      {
        "id": "T-109",
        "given": "eligible experiment and controlled nonproduction canary",
        "when": "exercise pass/fail/inconclusive/promote/rollback branches",
        "then": "frozen report evidence, independent grants, no self-promote, old in-flight work pinned [Complete meta rejection and rollback path]"
      },
      {
        "id": "T-110",
        "given": "existing Foundry decision+apply path with new runtime proposal",
        "when": "try publish with/without valid ApplyGrant",
        "then": "valid exact grant follows old guard semantics; missing/stale denied [Canonical preserve and governed apply]"
      },
      {
        "id": "T-111",
        "given": "signed pack set with optional markers and app overrides",
        "when": "install/upgrade/remove including tampered dependency",
        "then": "valid pinned install receipt; tamper/ownership conflict rejects; app stays independent [Signed pack compatibility and uninstall]"
      },
      {
        "id": "T-112",
        "given": "missing signing identity or budget/authority config",
