schema_version: "1.0"

id: MGC-012-T005
title: Crash recovery, hold on undecidable reconcile and failure matrix
type: feature
status: ready

goal:
  outcome: >-
    send 성공 후 mark 전 종료가 중복 Card 없이 수렴하고, 판정 불가와 terminal 실패는
    DLQ + operator hold 로 떨어져 그 destination 의 이후 event 를 멈춘다.
  user_value: >-
    실패가 조용히 사라지지 않는다. 회복 불가 상태는 사람에게 보이고, 일시 오류는 사람을
    부르지 않는다.

source:
  feature: MGC-012
  files:
    - path: specs/001-mgc-012-slack-reference-adapter/spec.md
      section: SC-004, SC-005
    - path: specs/001-mgc-012-slack-reference-adapter/plan.md
      section: P-001, P-002
    - path: specs/001-mgc-012-slack-reference-adapter/contracts/slack-transport.md
      # C-2.2 는 2026-08-07 round 2 에서 추가했다. AC-02·AC-08·AC-09·AC-10 의 근거가
      # 거기 표에 있는데 C-3 만 가리키고 있었다.
      section: C-2.2, C-3
  requirements:
    - FR-006
    - FR-007
    - FR-010
    - FR-011
  decisions:
    - D-016
    - D-018
    - D-019
    - D-020
    # AC-02·AC-07 정정과 AC-09 추가의 근거다. 정정 자체를 decision 으로 남긴다.
    - D-023
    - D-025

scope:
  include:
    - send 성공 후 mark 없이 중단하고 재개하는 시나리오
    # 2026-08-07 정정. 원문은 "사람이 Card 를 지운 뒤 reconcile 이 hold 를 만드는
    # 시나리오" 였고 그것은 D-023 이전 판이다. 갈래가 셋이다 — 아래 AC-02, AC-08 참조.
    - 사람이 Card 를 지운 뒤 조회 범위를 다 못 봐 hold 가 되는 시나리오
    - 사람이 Card 를 지웠지만 history 가 소진돼 재전송하는 시나리오
    - lease 만료 replay 이면서 attempts 가 상한인 경우에만 재전송 대신 hold 로 떨어지는 경계
    - retryable 실패가 retry_wait 로 가는 것
    - terminal 실패가 재시도 없이 DLQ + hold 로 가는 것
    - hold 가 걸린 destination 의 다음 event 가 claim 되지 않는 것
    # 2026-08-07 round 2 정정. 원문은 "activation state 를 바꾸지 않음을 확인" 이었는데
    # 그 state 를 담는 table 이 없어 AC-07 은 proxy 로 좁혔다. scope 만 원문으로 남으면
    # 같은 파일 안에서 서로를 부정한다.
    - Slack adapter 가 다른 Provider 의 outbox destination row 와 event 를 바꾸지 않음을
      확인 (activation state 자체는 Package 4)
  exclude:
    - 순서와 supersession (T004 소유)
    - 실제 Slack workspace E2E (Package 4)
  allowed_paths:
    - tests/test_slack_projection.py
    - src/amplai_foundry/governance/slack_projection.py
  forbidden_paths:
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/projections.py
    - src/amplai_foundry/governance/slack.py
    - pyproject.toml

dependencies:
  tasks:
    - MGC-012-T003
  external: []

implementation:
  guidance:
    - terminal 을 즉시 DLQ 로 보내는 경로는 OutboxReconcileError 뿐이다
      (events.py:2856-2863). 일반 예외는 attempts 를 소진해야 DLQ 에 간다.
    - hold 가 이후 event 를 멈추는 근거는 claim_next 의 d.operator_hold = 0 이다
      (events.py:2634).
    # 2026-08-07 정정. 원문은 "지워진 Card 는 재전송하지 않고 hold 로 둔다 (plan.md
    # P-001)" 였다. 인용한 plan.md P-001 은 이미 "좁혀짐 (D-023)" banner 를 달고 있는데
    # guidance 가 banner 이전 문장만 옮겨 놨다. 그대로 두면 다음 구현자가 이것을 근거로
    # 소진 갈래를 되돌리고, 그러면 모든 destination 의 첫 Card 가 영구 hold 가 된다.
    - 지워진 Card 의 처리는 조회 범위로 갈린다 (plan.md P-001 의 D-023 banner,
      contracts C-2.2 표). next_cursor 가 남은 채 상한에 걸리면 hold, history 가
      소진됐으면 없는 것이 확정이라 재전송이다. 단 lease 만료 replay 이면서
      (last_error_code == 'OUTBOX_LEASE_EXPIRED') attempts 가 상한인 경우에만 deliver_next
      가 send 앞에서 가로채 OUTBOX_POST_SEND_RECONCILE_REQUIRED 로 보낸다. 두 조건의
      AND 다 (events.py:2844-2847) — attempts 단독이 아니다.
  invariants:
    - 판정 불가는 hold 다. 추측해서 재전송하지 않는다.
    - 같은 event 를 두 번 전달하지 않는다.
    - Telegram 또는 다른 Provider 의 activation state 를 바꾸지 않는다.
  non_goals:
    - Retry-After 를 backoff 에 반영
    - hold 를 자동으로 푸는 기능

acceptance:
  behaviors:
    - id: AC-01
      given: transport 가 post_message 를 성공했으나 mark_delivered 전에 중단된 상태
      when: 같은 event 로 deliver_next 를 다시 부르면
      then: reconcile 이 marker 를 찾아 delivered 로 확정하고 Slack message 는 하나뿐이다
    # 2026-08-07 정정. 이 항목의 원문은 지워진 Card 를 무조건 hold 로 적었고 그것은
    # D-023 이전 판이다. D-023 항목 3 이 "history 소진" 을 미전송의 증거로 인정하면서
    # 갈래가 둘로 갈렸다 (contracts C-2.2 표 3·4행, spec SC-005). 원문대로 두면 approved
    # spec 과 충돌해 loop stop_condition `acceptance_conflicts_with_approved_spec` 이다.
    # 아래 AC-02 와 AC-08 이 좁혀진 계약을 양쪽으로 덮는다.
    - id: AC-02
      given: AC-01 상태에서 history 의 그 message 를 지웠고 그 뒤로 다른 message 가 쌓여
        next_cursor 가 남은 채 page 상한에 걸리는 상태
      when: deliver_next 를 다시 부르면
      then: dead_letter 와 outbox_destination scope 의 operator hold 가 생기고 재전송하지
        않는다. error_code 는 상한 도달을 다른 hold 원인과 구분한다 (D-023 항목 4)
    - id: AC-03
      given: hold 가 걸린 destination 에 다음 pending event 가 있는 상태
      when: claim_next 를 부르면
      then: 그 event 를 claim 하지 않는다
    - id: AC-04
      given: transport 가 ratelimited 를 반환하는 상태
      when: deliver_next 를 부르면
      then: event 가 retry_wait 로 가고 attempts 가 오른다
    - id: AC-05
      given: transport 가 channel_not_found 를 반환하는 상태
      when: deliver_next 를 부르면
      then: attempts 소진을 기다리지 않고 dead_letter 와 hold 가 생긴다
    - id: AC-06
      given: transport 가 HTTP 5xx 로 실패하는 상태
      when: deliver_next 를 부르면
      then: event 가 retry_wait 로 간다
    - id: AC-07
      given: Slack projection 경로를 성공과 hold 양쪽으로 끝까지 돌린 뒤
      when: 다른 Provider 의 outbox destination row 와 그 event state 를 읽으면
      then: 변경되지 않았고 그 destination 은 자기 event 를 계속 claim 할 수 있다
      note: >-
        2026-08-07 정정. 원문은 "activation state" 였으나 이 repo 에 provider activation 을
        담는 table 이 없다 (governance_* table 목록). Package 3 범위에서 실재하고 관측
        가능한 것은 provider 별 destination row 와 event 다. activation rollout 자체는
        CURRENT_ITEM 의 Out Of Scope 이고 Package 4 다.
    # AC-02 정정과 함께 들어온 반대쪽 갈래다. 이것이 없으면 D-023 항목 3 이 test 로 덮이지
    # 않고, 그 갈래가 깨지면 모든 destination 의 첫 Card 가 영구 hold 가 된다.
    # AC-08·AC-09 의 경계는 `deliver_next` 의 guard 다 (events.py:2844-2847). 그 guard 는
    # **두 조건의 AND** 다 — `last_error_code == 'OUTBOX_LEASE_EXPIRED'` 이고
    # `attempts >= max_attempts`. contracts C-2 의 "증가하지 않는 재claim 은 lease 만료
    # replay 하나뿐" 과 D-023 마지막 문단이 같은 말을 한다.
    #
    # 2026-08-07 round 2 정정. round 1 은 이 경계를 `attempts` 단독으로 썼다. 그러면 거짓이다 —
    # attempts 가 상한에 닿아도 lease 만료 replay 가 아니면 guard 가 안 걸리고 재전송한다.
    # probe 로 반증했다 (max_attempts=2, send 성공 후 OUTBOX_DELIVERY_FAILED 로 실패 기록,
    # Card 삭제 → attempts 2 = max 2 인데 재전송).
    - id: AC-08
      given: AC-01 상태에서 history 의 그 message 를 지웠고 채널이 작아 history 를 끝까지
        훑을 수 있으며 guard 의 두 조건이 함께 성립하지는 않는 상태
      when: deliver_next 를 다시 부르면
      then: 없는 것이 확정이므로 재전송하고 Card 는 여전히 한 장이다 (SC-005)
    - id: AC-09
      given: AC-08 과 같은데 lease 만료로 재claim 됐고
        (last_error_code == 'OUTBOX_LEASE_EXPIRED') attempts 가 max_attempts 에 닿은 상태
      when: deliver_next 를 다시 부르면
      then: send 를 부르지 않고 OUTBOX_POST_SEND_RECONCILE_REQUIRED 로 dead_letter 와
        해당 destination scope 의 operator hold 를 만든다 (events.py:2844-2854)
    - id: AC-10
      given: AC-08 과 같은데 attempts 는 max_attempts 에 닿았지만 마지막 실패가 lease
        만료가 아닌 상태
      when: deliver_next 를 다시 부르면
      then: guard 가 걸리지 않아 재전송한다. 경계는 attempts 단독이 아니다
  commands:
    - id: unit
      kind: test
      run: python -m pytest tests/test_slack_projection.py
      required: true
    - id: regression
      kind: test
      run: python -m pytest
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
    # 2026-08-07 정정. `amplai-foundry lint` 는 VAULT 인자가 없어 실행 자체가 안 된다
    # (Missing argument 'VAULT'). 선언된 command 와 실제로 돌린 command 가 달랐다.
    - id: knowledge_lint
      kind: lint
      run: amplai-foundry lint vault
      required: true
    - id: verify
      kind: integration
      run: amplai-foundry verify
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: unit
      required: true
    - type: command_output
      source: regression
      required: true
    - type: command_output
      source: verify
      required: true

risk:
  level: high
  concerns:
    - 중복 Card 는 사람이 보는 결과라 되돌리기 어렵다.
    - hold 조건이 너무 넓으면 정상 운영이 자주 멈춘다.
  approvals:
    - wave 4 종료 시 3 lens review 전원

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  # AC-01~10 열 다 통과했다. AC-02·AC-07 은 재작성한 판이고 AC-08·AC-09·AC-10 은 신설이다.
  # 그 정정은 D-025 로 사용자 승인을 받았다 (2026-08-07).
  all_acceptance_passed: true
  required_evidence_present: true
  # gate 는 아직이다. wave 4 의 3 lens review 가 끝나고 P0·P1·Blocking-P2 가 0건일 때만
  # 채운다. status 도 그때 done 으로 바꾼다.
  completed_at: null
  evidence_paths:
    - tests/test_slack_projection.py

handoff:
  expected_changes:
    - tests/test_slack_projection.py 확장
    # 이 manifest 자신도 바뀌었다. 안 적으면 다음 사람이 acceptance 를 approved 원본으로
    # 읽는다 (2026-08-07 round 2 contract lens A-6).
    - 이 manifest 의 acceptance 재작성 (AC-02·AC-07) 과 신설 (AC-08·AC-09·AC-10),
      scope.include·implementation.guidance 재작성. 근거는 D-025 다
    - quickstart.md 의 실행 불가 command 와 고정 숫자 정정
  notes:
    - T004 와 같은 test file 을 쓴다. 병렬 실행하지 않는다.
    - 이 task 가 Package 3 의 마지막이다. 통과 후 gate 기록과 Package 4 taskify 로 간다.
    - acceptance 자기 수정은 D-025 로 사용자 승인을 받았다 (2026-08-07, 선택지 셋 중
      첫째). review 는 근거이지 승인 주체가 아니다 (D-004).
