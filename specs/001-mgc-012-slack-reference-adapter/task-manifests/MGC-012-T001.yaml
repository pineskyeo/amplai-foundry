schema_version: "1.0"

id: MGC-012-T001
title: Slack transport Protocol and error classification
type: feature
status: ready

goal:
  outcome: >-
    주입 가능한 SlackTransport Protocol 과 Slack 실패를 retryable/terminal 로 나누는
    분류기가 존재하고, 분류 결과가 dispatcher 가 이해하는 예외 종류로 대응된다.
  user_value: >-
    이후 send/reconcile task 가 network 없이 계약만으로 구현·검증된다. 분류가 틀리면
    회복 가능한 오류에 operator 를 부르거나 영구 실패를 max_attempts 만큼 반복한다.

source:
  feature: MGC-012
  files:
    - path: specs/001-mgc-012-slack-reference-adapter/contracts/slack-transport.md
      section: C-1, C-3
    - path: specs/001-mgc-012-slack-reference-adapter/research.md
      section: R-006
    - path: specs/001-mgc-012-slack-reference-adapter/plan.md
      section: P-002
  requirements:
    - FR-002
    - FR-010
    - FR-012
  decisions:
    - D-016
    - D-018
    - D-019

scope:
  include:
    - SlackTransport Protocol 정의 — post_message 와 read_history
    - SlackSendResult, SlackHistoryMessage, SlackHistoryPage 구조 정의
    - Slack error code 분류기 — retryable allowlist, 나머지 terminal
    - transport 층 실패(연결 실패, timeout, HTTP 5xx)를 retryable 로 다루는 경계
    - marker 의 event_type 고정 문자열 값 확정
    - test 용 fake transport
  exclude:
    - 실제 HTTP 구현
    - SlackProjectionDestination 자체
    - Retry-After 를 backoff 에 주입하는 것
  allowed_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - tests/test_slack_projection.py
  forbidden_paths:
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/projections.py
    - src/amplai_foundry/governance/slack.py
    - pyproject.toml

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - contracts/slack-transport.md C-1 의 signature 를 그대로 쓴다.
    - retryable allowlist 는 research.md R-006 표다.
    - terminal 신호는 OutboxReconcileError 다. deliver_next 에서 unreconcilable=True 가
      붙는 경로가 그것뿐이다 (events.py:2856-2863).
  invariants:
    - dependency 는 pydantic, pyyaml, typer 셋을 유지한다.
    - 분류기는 allowlist 방식이다. 모르는 code 는 terminal 로 떨어진다.
    - event_type 문자열은 한 번 정하면 바꾸지 않는다. 바꾸면 이전 marker 를 못 읽는다.
  non_goals:
    - 실제 Slack API 호출
    - rate limit 대응 로직

acceptance:
  behaviors:
    - id: AC-01
      given: Slack 이 ratelimited error code 를 반환한 상황
      when: 분류기에 그 실패를 넣으면
      then: retryable 로 분류한다
    - id: AC-02
      given: Slack 이 channel_not_found error code 를 반환한 상황
      when: 분류기에 그 실패를 넣으면
      then: terminal 로 분류하고 OutboxReconcileError 로 대응시킨다
    - id: AC-03
      given: research.md R-006 allowlist 에 없는 임의의 Slack error code
      when: 분류기에 그 실패를 넣으면
      then: terminal 로 분류한다
    - id: AC-04
      given: Slack error code 없이 연결이 끊기거나 HTTP 5xx 가 온 상황
      when: 분류기에 그 실패를 넣으면
      then: retryable 로 분류한다
    - id: AC-05
      given: slack_projection 모듈
      when: import 를 정적으로 훑으면
      then: stdlib 과 pydantic 밖의 module 을 import 하지 않는다
  commands:
    - id: unit
      kind: test
      run: python -m pytest tests/test_slack_projection.py
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: unit
      required: true
    - type: command_output
      source: typecheck
      required: true

risk:
  level: low
  concerns:
    - error code 목록의 완전성을 확인하지 못했다 (research.md R-006 미확인). allowlist
      방식이 그 불완전성을 안전한 쪽으로 흡수한다.
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: false
  required_evidence_present: false
  completed_at: null
  evidence_paths: []

handoff:
  expected_changes:
    - src/amplai_foundry/governance/slack_projection.py 신규
    - tests/test_slack_projection.py 신규
  notes:
    - wave 1 종료 후 contract, failure/recovery, regression 3 lens review 를 돌린다.
