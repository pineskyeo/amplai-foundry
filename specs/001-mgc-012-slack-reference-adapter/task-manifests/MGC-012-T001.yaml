schema_version: "1.0"

id: MGC-012-T001
title: Slack transport Protocol and error classification
type: feature
status: done

goal:
  outcome: >-
    주입 가능한 SlackTransport Protocol 과 Slack 실패를 retryable/terminal 로 나누는
    분류기가 존재하고, 분류 결과가 dispatcher 가 이해하는 예외 종류로 대응된다.
  user_value: >-
    이후 send/reconcile task 가 network 없이 계약만으로 구현·검증된다. 분류가 틀리면
    회복 가능한 오류에 operator 를 부르거나 영구 실패를 max_attempts 만큼 반복한다.

source:
  feature: MGC-012
  files:
    - path: specs/001-mgc-012-slack-reference-adapter/contracts/slack-transport.md
      section: C-1, C-3
    - path: specs/001-mgc-012-slack-reference-adapter/research.md
      section: R-006
    - path: specs/001-mgc-012-slack-reference-adapter/plan.md
      section: P-002
    - path: specs/001-mgc-012-slack-reference-adapter/data-model.md
      section: SlackFailureClass
  requirements:
    - FR-002
    - FR-010
    - FR-012
  decisions:
    - D-016
    - D-018
    - D-019
    - D-020

scope:
  include:
    - SlackTransport Protocol 정의 — post_message 와 read_history
    - SlackSendResult, SlackHistoryMessage, SlackHistoryPage 구조 정의
    - Slack error code 분류기 — retryable allowlist, 나머지 terminal
    - Slack error code 가 없는 실패를 status 무관하게 retryable 로 다루는 경계
    - error code 정규화와, 저장될 접미사에만 적용하는 형식 강제
    - 기본 retry schedule 을 사실로 고정하는 test. 하한 상수는 두지 않는다
    - marker 의 event_type 고정 문자열 값 확정
    - test 용 fake transport
  exclude:
    - 실제 HTTP 구현
    - SlackProjectionDestination 자체
    - Retry-After 를 backoff 에 주입하는 것
  allowed_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - tests/test_slack_projection.py
  forbidden_paths:
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/projections.py
    - src/amplai_foundry/governance/slack.py
    - pyproject.toml

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - contracts/slack-transport.md C-1 의 signature 를 그대로 쓴다.
    - retryable allowlist 는 research.md R-006 표다.
    - terminal 신호는 OutboxReconcileError 다. deliver_next 에서 unreconcilable=True 가
      붙는 경로가 그것뿐이다 (events.py:2856-2863).
  invariants:
    - dependency 는 pydantic, pyyaml, typer 셋을 유지한다.
    - 분류기는 allowlist 방식이다. 모르는 Slack code 는 terminal 로 떨어진다.
    - Slack code 가 없는 실패는 status 로 가르지 않고 전부 retryable 이다.
    - event_type 문자열은 한 번 정하면 바꾸지 않는다. 바꾸면 이전 marker 를 못 읽는다.
    - terminal code 문자열은 Slack 원인을 담는다. dispatcher 가 예외 객체를 버린다.
  non_goals:
    - 실제 Slack API 호출
    - rate limit 대응 로직

acceptance:
  behaviors:
    - id: AC-01
      given: Slack 이 ratelimited error code 를 반환한 상황
      when: 분류기에 그 실패를 넣으면
      then: retryable 로 분류한다
    - id: AC-02
      given: Slack 이 channel_not_found error code 를 반환한 상황
      when: 분류기에 그 실패를 넣으면
      then: terminal 로 분류하고 OutboxReconcileError 로 대응시킨다
    - id: AC-03
      given: research.md R-006 allowlist 에 없는 임의의 Slack error code. 식별자 형식을
        벗어난 값도 포함한다
      when: 분류기에 그 실패를 넣으면
      then: 형식과 무관하게 terminal 로 분류한다. 형식 때문에 값을 버리지 않는다
    - id: AC-04
      given: Slack error code 없이 실패한 상황 — 연결 끊김, timeout, 임의의 HTTP status
      when: 분류기에 그 실패를 넣으면
      then: status code 와 무관하게 retryable 로 분류한다
    - id: AC-05
      given: slack_projection 모듈
      when: import 를 정적으로 훑으면
      then: stdlib, amplai_foundry, pydantic 밖의 module 을 import 하지 않는다.
        repo 전체 dependency 셋 유지는 별개이며 invariants 가 담당한다
    - id: AC-06
      given: Slack error code 가 빈 문자열이거나 대소문자·공백이 섞였거나 str 이 아닌 상황
      when: 분류기에 그 실패를 넣으면
      then: 정규화 후 판정한다. 빈 값과 str 아닌 값은 code 없음으로 보고 retryable 이다.
        원본은 진단용으로 남는다
    - id: AC-07
      given: 임의의 Slack error code
      when: 저장될 접미사를 만들면
      then: 허용 밖 문자를 치환하고 64자로 자른다. 값을 버리지 않으며 code 가 없으면
        unknown 이다
    - id: AC-08
      given: HTTP 429 와 allowlist 밖 Slack error code 가 함께 온 실패
      when: 분류기에 그 실패를 넣으면
      then: 규칙 순서에 따라 retryable 로 분류한다
    - id: AC-09
      given: OutboxConfig 기본값
      when: 재시도 backoff schedule 을 읽으면
      then: 대기가 [5, 10, 20, 40] 이고 합이 75 임을 test 가 고정한다. Slack 이
        Retry-After 상한을 문서화하지 않아 충분한지는 판정하지 않는다
  commands:
    - id: unit
      kind: test
      run: python -m pytest tests/test_slack_projection.py
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: format
      kind: lint
      run: python -m ruff format --check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
    - id: typecheck_tests
      kind: typecheck
      run: python -m mypy tests/test_slack_projection.py
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: unit
      required: true
    - type: command_output
      source: lint
      required: true
    - type: command_output
      source: format
      required: true
    - type: command_output
      source: typecheck
      required: true
    - type: command_output
      source: typecheck_tests
      required: true

risk:
  level: low
  concerns:
    - error code 목록의 완전성을 확인하지 못했다 (research.md R-006 미확인). allowlist
      방식이 그 불완전성을 안전한 쪽으로 흡수한다.
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-05"
  evidence_paths:
    - docs/workstreams/messenger-governance-closure-v3/CHECKPOINTS/MGC-012-package-3-wave-1-review-2026-08-05.md

handoff:
  expected_changes:
    - src/amplai_foundry/governance/slack_projection.py 신규
    - tests/test_slack_projection.py 신규
  notes:
    - wave 1 종료 후 contract, failure/recovery, regression 3 lens review 를 돌린다.
