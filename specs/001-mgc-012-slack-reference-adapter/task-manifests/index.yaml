    - id: R-008
      reason: >-
        이미 전달된 Card 를 chat.update 로 갱신하는 기능은 A11 에 근거가 없다.
    # 아래는 wave 2·3 review 가 넘긴 것이다. CHECKPOINTS 에만 있어 owner 가 없었다
    # (/speckit-analyze C3, 2026-08-05).
    - id: W2-outbox-config-wiring
      owner: Package 4
      reason: >-
        SlackProjectionDestination 이 max_attempts 를 int 로 받아 dispatcher config 와
        어긋날 수 있다. 과소 설정이면 남은 attempt 를 버리고 되돌릴 수 없는 hold 를
        만든다. T003 이 read 실패에도 그 규칙을 적용해 표면이 넓어졌다. 생성자가
        OutboxConfig 를 받게 하면 닫힌다. D-021·D-024 가 대가로 수용했다.
    - id: W2-yaml-divergence-asymmetry
      owner: 미정
      reason: >-
        projections.py 의 YAML_PROJECTION_DIVERGED 가 reconcile 에서는
        OutboxReconcileError, send 에서는 GovernanceEventError 다. 같은 divergence 가
        발견 위치에 따라 즉시 hold 와 5회 재시도로 갈린다. D-022 의 논거가 그대로
        적용되지만 AC-09 가 지목한 두 code 밖이다.
    - id: W2-pytest-import-mode
      owner: 미정
      reason: >-
        tests/test_slack_projection.py 가 test_governance_events 를 top-level 로
        import 한다. pytest 의 prepend import mode 에 의존해서 --import-mode=importlib
        이나 tests/__init__.py 가 생기면 깨진다. pyproject.toml 에 pythonpath 를 넣어야
        하는데 그 파일이 forbidden_paths 라 별도 item 이다.
    - id: W3-transport-readback-selfcheck
      owner: Package 4
      reason: >-
        adapter 가 기동 전에 자기가 보낸 message 를 read_history 로 되읽어 marker 가
        복원되는지 확인해야 한다. 값이 틀린 app_id, metadata 매핑 누락, event_type 개명을
        한 번에 잡는 유일한 검사다. destination 은 그중 일부만 지문으로 잡고, 못 잡는
        경우의 결과는 hold 가 아니라 조용한 중복 Card 다. contracts C-1.2, D-024 항목 2.
    - id: W3-history-ordering-unverified
      owner: Package 4
      reason: >-
        conversations.history 가 최신 message 부터 돌려주는지 Slack 문서에서 확인하지
        못했다. page 사이의 순서가 뒤집히면 중복 Card 가 난다. destination 은 page 안에서만
        그 의존을 없앴다. contracts C-1, research R-004 미확인.
    - id: W3-history-oauth-scope
      owner: Package 4
      reason: >-
        conversations.history 에 필요한 OAuth scope 가 C-1.2 에 없다. chat:write 만 있는
        배포는 send 는 성공하고 첫 재시도의 read 에서 missing_scope → terminal →
        되돌릴 수 없는 hold 가 된다.
  excluded:
    - id: A1-A10
      reason: Package 1·2 에서 이미 충족했다. gate PASS at ef35201, 2dcf663.
  uncovered: []

open_questions:
  - id: OQ-003
    question: >-
      Slack message metadata 의 크기 상한은 얼마인가. 공식 문서에서 찾지 못했다
      (research.md R-003 미확인).
    owner: Package 4
    blocking: false
    note: >-
      marker 에 payload 본문을 넣지 않는 것으로 회피한다. 실측은 실제 workspace 가 있는
      Package 4 몫이다.

resolved_questions:
  - id: OQ-001
    question: >-
      max_history_pages 의 확정 값은 얼마인가.
    resolved_by: D-023 항목 4
    resolution: >-
      page 당 limit 999, max_history_pages 5. limit 은 S2 의 상한을 그대로 쓴다 — Slack 은
      호출 수를 세므로 한 번에 꽉 채우는 쪽이 손해가 없다. 5 는 판단이지 측정이 아니고 그
      사실을 코드에 적는다. 실측은 Package 4 몫이다.
  - id: OQ-004
    question: >-
      destination 의 첫 전달에서 reconcile 은 무엇을 반환하는가. C-2.2 의 세 규칙으로는
      destination_sequence 가 1 인 event 가 규칙 3 (판정 불가) 로만 떨어져 모든
      destination 의 첫 Card 가 되돌릴 수 없는 hold 가 됐다.
    resolved_by: D-023
    resolution: >-
      첫 시도(attempts == 1 이고 last_error_code is None)는 조회 없이 None 을 반환한다.
      그리고 판정 규칙에 "history 소진" 을 더해 넷으로 늘린다. 2026-08-05 grill-me 로
      네 갈래를 순서대로 확정했다. spec.md 의 관련 Edge Case 도 함께 해소됐다.

