schema_version: "1.0"

id: MGC-012-T002
title: Slack projection send path with marker and receipt
type: feature
status: done

goal:
  outcome: >-
    SlackProjectionDestination.send() 가 destination_ref 와 payload digest 를 먼저
    검증하고, 통과한 event 만 marker 를 실어 transport 로 보내며, slack:{channel}:{ts}
    receipt 를 반환한다.
  user_value: >-
    Card 가 Slack 으로 나가는 유일한 경로가 생긴다. 사전 검증이 없으면 손상된 payload 가
    사람에게 보이는 Card 로 나간다.

source:
  feature: MGC-012
  files:
    - path: specs/001-mgc-012-slack-reference-adapter/contracts/slack-transport.md
      section: C-2.1, C-2.3
    - path: specs/001-mgc-012-slack-reference-adapter/data-model.md
      section: SlackMessageMarker, Validation Rules
    - path: specs/001-mgc-012-slack-reference-adapter/research.md
      section: R-003, R-005
  requirements:
    - FR-001
    - FR-003
    - FR-008
    - FR-009
  decisions:
    - D-018
    - D-019
    - D-020
    - D-021
    - D-022

scope:
  include:
    - SlackProjectionDestination 클래스와 destination_ref 속성
    - send() — 사전 검증 두 가지, marker 구성, receipt 생성
    - payload digest 계산을 YamlProjectionDestination 과 같은 규칙으로 맞추기
    - transport 가 SlackTransportError 아닌 예외를 던져도 destination 이 잡아 재감싼 뒤
      분류한다. C-1 의 transport 의무를 대체하지 않고 방어선을 하나 더한다 (D-020 항목 4)
    - >-
      retryable 실패의 원인을 dead letter 까지 남긴다 (D-020 항목 6). 2026-08-05 사용자
      결정으로 destination 안에서 닫는다 — 생성자가 max_attempts 를 받고
      event.attempts >= max_attempts 인 호출에서만 retryable 을 terminal 로 올려
      SLACK_PROJECTION_RETRY_EXHAUSTED:{suffix} 를 남긴다. contracts C-3.1 참조.
      events.py 는 안 고친다. 마지막 attempt 는 어차피 dead letter 라 state 전이는
      그대로고 error_code 만 달라진다 (events.py:2778)
    - >-
      사전 검증 실패 두 가지를 OutboxReconcileError 로 올린다 (D-022). 2026-08-05 사용자
      결정으로 scope 를 넓혀 YamlProjectionDestination 도 같이 바꿨다. 부모인
      GovernanceEventError 로 던지면 deliver_next 의 unreconcilable 경로를 못 타고
      원인이 OUTBOX_DELIVERY_FAILED 로 덮인다
  exclude:
    - reconcile()
    - chat.update 로 기존 Card 를 갱신하는 것
    - OutboxDispatcher 수정. 필요하다고 판단되면 scope_boundary_must_expand 로 멈춘다
    - >-
      T004 의 순서·supersession 시나리오. 다만 D-021·D-022 의 논거가 dispatcher 의
      state 전이에 의존하므로 그 두 주장만 실물 dispatcher 로 고정한다. wave 2 review
      Blocking-P2 반영이다
  allowed_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - tests/test_slack_projection.py
    # D-022 로 scope 를 넓혔다. 두 destination 이 같은 사전 검증 실패를 다르게 다루면
    # 안 되므로 YamlProjectionDestination 과 그 test 를 함께 연다. events.py 는 열지
    # 않는다 — 새 예외 class 없이 기존 OutboxReconcileError 를 쓰므로 dispatcher 계약이
    # 그대로다.
    - src/amplai_foundry/governance/projections.py
    - tests/test_governance_events.py
    # D-021·D-022 가 contract 를 바꿨으므로 그 결정을 적는 문서도 함께 연다. 코드 경로는
    # 위 넷뿐이다. spec 계열은 projections.py 인용 line 번호가 밀려 함께 고쳤다.
    - specs/001-mgc-012-slack-reference-adapter/contracts/slack-transport.md
    - specs/001-mgc-012-slack-reference-adapter/data-model.md
    - specs/001-mgc-012-slack-reference-adapter/spec.md
    - specs/001-mgc-012-slack-reference-adapter/plan.md
    - specs/001-mgc-012-slack-reference-adapter/research.md
    - specs/001-mgc-012-slack-reference-adapter/quickstart.md
    - specs/001-mgc-012-slack-reference-adapter/tasks.md
    - specs/001-mgc-012-slack-reference-adapter/task-manifests/MGC-012-T002.yaml
    - specs/001-mgc-012-slack-reference-adapter/task-manifests/index.yaml
    - docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
    - docs/workstreams/messenger-governance-closure-v3/CHECKPOINTS/MGC-012-package-3-wave-2-review-2026-08-05.md
  forbidden_paths:
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/slack.py
    - pyproject.toml

dependencies:
  tasks:
    - MGC-012-T001
  external: []

implementation:
  guidance:
    - 검증 순서는 projections.py:57-61 과 같다. transport 를 부르기 전에 둘 다 통과해야 한다.
    - >-
      digest 규칙은 projections.py:169 와 같아야 한다 — ensure_ascii=False,
      separators=(",", ":"), sort_keys=True, "sha256:" prefix.
    - marker 는 event_id, destination_ref, destination_sequence, payload_digest 넷만 담는다.
  invariants:
    - destination_ref 형식 provider:{provider}:{channel_digest} 를 만들거나 해석하지 않는다.
    - marker 에 payload 본문을 넣지 않는다. metadata 크기 상한이 미확인이다.
    - receipt 는 같은 message 에 대해 항상 같은 문자열이어야 한다.
  non_goals:
    - reconcile 판정
    - 실패 분류 (T001 소유)

acceptance:
  behaviors:
    - id: AC-01
      given: event.destination_ref 가 destination 자신의 것과 다른 event
      when: send() 를 부르면
      then: OutboxReconcileError("OUTBOX_DESTINATION_MISMATCH") 로 실패하고 transport 를
        부르지 않는다 (예외 종류는 D-022, AC-09 가 함께 본다)
    - id: AC-02
      given: payload 를 바꿔 payload_digest 와 어긋나게 만든 event
      when: send() 를 부르면
      then: OutboxReconcileError("OUTBOX_PAYLOAD_INTEGRITY_FAILURE") 로 실패하고
        transport 를 부르지 않는다 (D-022)
    - id: AC-03
      given: 검증을 통과하는 event 와 성공을 반환하는 fake transport
      when: send() 를 부르면
      then: slack:{channel}:{ts} 형식의 receipt 를 반환한다
    - id: AC-04
      given: 검증을 통과하는 event
      when: send() 가 transport.post_message 를 부르면
      then: marker 에 event_id, destination_ref, destination_sequence, payload_digest 가
        담기고 payload 본문은 담기지 않는다
    - id: AC-05
      given: 같은 payload
      when: SlackProjectionDestination 과 YamlProjectionDestination 이 각각 digest 를
        계산하면
      then: 두 값이 같다
    - id: AC-06
      given: SlackTransportError 가 아닌 임의의 예외를 던지는 transport
      when: send() 를 부르면
      then: destination 이 그것을 잡아 재감싼 뒤 분류한다. 분류를 건너뛰지 않는다
    - id: AC-07
      given: event.attempts 가 max_attempts 미만이고 retryable 로 분류되는 실패
      when: send() 를 부르면
      then: 원래 예외를 그대로 올린다. dispatcher 의 retry_wait 경로를 탄다
    - id: AC-08
      given: event.attempts 가 max_attempts 에 도달한 상태의 retryable 실패
      when: send() 를 부르면
      then: SLACK_PROJECTION_RETRY_EXHAUSTED:{suffix} 를 code 로 갖는
        OutboxReconcileError 를 올리고 suffix 가 원인을 담는다 (D-020 항목 6, C-3.1)
    - id: AC-09
      given: destination_ref 가 어긋난 event, 그리고 digest 가 어긋난 event
      when: send() 를 부르면
      then: 둘 다 OutboxReconcileError 로 실패해 dispatcher 가 즉시 dead letter 와
        operator hold 를 만든다. 재시도하지 않고 원인 code 가 그대로 저장된다.
        YamlProjectionDestination 도 같다 (D-022)
    - id: AC-10
      given: destination_ref 또는 channel 이 공백뿐이거나 max_history_pages 또는
        max_attempts 가 1 미만인 인자
      when: SlackProjectionDestination 을 생성하면
      then: ValueError 로 거부한다. destination_ref 와 channel 은 통과 시 앞뒤 공백을
        지워 저장한다 (contracts C-2)
  commands:
    - id: unit
      kind: test
      run: python -m pytest tests/test_slack_projection.py
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: unit
      required: true
    - type: command_output
      source: typecheck
      required: true

risk:
  level: medium
  concerns:
    - digest 규칙이 YamlProjectionDestination 과 어긋나면 두 destination 이 같은 event 를
      다르게 판정한다.
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  # wave 2 gate PASS. 3 lens 를 3라운드 돌렸고 round 3 에서 P0·P1·Blocking-P2 가 0건이다.
  completed_at: 2026-08-05
  evidence_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - tests/test_slack_projection.py
    - src/amplai_foundry/governance/projections.py
    - tests/test_governance_events.py
    - docs/workstreams/messenger-governance-closure-v3/CHECKPOINTS/MGC-012-package-3-wave-2-review-2026-08-05.md

handoff:
  expected_changes:
    - src/amplai_foundry/governance/slack_projection.py 확장
    - tests/test_slack_projection.py 확장
    - src/amplai_foundry/governance/projections.py 사전 검증 예외 종류 변경 (D-022)
    - tests/test_governance_events.py 그 변경의 test 추가
  notes:
    - wave 2 종료 후 3 lens review 를 돌린다.
    - >-
      T003 이 reconcile 을 구현하면 tests/test_slack_projection.py 의
      ReconcilelessSlackDestination stub 과 test_destination_implements_the_protocol_
      members_t002_owns 를 지운다. 후자는 reconcile 부재를 단언하므로 그때 실패한다.
    - >-
      C-2.3 의 절반 (send 와 reconcile 이 같은 receipt 를 만드는가) 은 T002 에서 검사할
      수 없다. T003 이 닫는다.
