schema_version: "1.0"

id: MGC-012-P5-T014
title: Pin the migration history continuity and store identity guards
type: test
status: done

goal:
  outcome: >-
    적용된 migration 기록의 version 연속성 검사와 store 신원 metadata 검사가 test 로 고정된다.
    둘 중 하나를 약화하면 test 가 실패한다.
  user_value: >-
    이 둘은 governed store 가 자기 자신인지 확인하는 마지막 관문이다. 지금은 약화해도 아무도
    모른다. 어긋난 store 를 governed store 로 열면 그 뒤 모든 판단의 근거가 무너진다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-11.md
      section: R-9
    - path: specs/003-slack-proposal-card/evidence/mutation-round-11.md
      section: R-9
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-038
  requirements:
    - FR-021
    - SC-003
  decisions:
    - D-038

scope:
  include:
    - 적용된 migration version 이 1부터 빈틈없이 이어지는지 보는 검사의 회귀 test.
    - store 신원 metadata 검사의 회귀 test.
  exclude:
    - "`src/` 수정. 이 task 는 회귀 방어만 추가한다."
    - 새 migration 추가.
    - 기존 migration 의 SQL 이나 checksum 변경.
    - 무결성 대조 guard. MGC-012-P5-T013 이 맡는다.
  allowed_paths:
    - tests/test_governance_migrations.py
  forbidden_paths:
    - vault/
    - src/
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      대상은 두 곳이다. `migrations.py:4193` 부근이 `applied_versions` 를
      `tuple(range(1, len(applied_versions) + 1))` 과 비교해 연속성을 요구하고,
      `migrations.py:4950` 부근이 `governance_store_metadata` 의 `store_kind` 값을 확인한다.
      round 11 mutation 이 둘 다에서 살아남았다.
    - >-
      연속성 test 는 빈틈 있는 기록을 실제로 만들어야 한다. version 을 건너뛴 상태를 넣고
      열었을 때 거부되는지 본다. 미지원 future version 은 그 위 분기가 먼저 잡으므로 그것과
      구분되는 입력을 골라야 한다. 다른 분기가 먼저 잡으면 겨냥한 guard 를 고정한 것이 아니다.
    - >-
      store 신원 test 는 metadata 값을 다른 값으로 바꾸거나 지운 store 를 만들어 거부되는지 본다.
    - >-
      각 test 는 겨냥한 guard 를 실제로 깨뜨려 실패를 확인한 뒤에야 고정한다고 적을 수 있다.
  invariants:
    - "`src/` 는 수정하지 않는다."
    - 기존 migration 정의와 checksum 이 바뀌지 않는다.
    - 신규 test 가 실제 vault 나 사용자 데이터를 건드리지 않는다.
  non_goals:
    - migration 추가나 schema 변경.
    - 기존 migration test 의 재작성.

acceptance:
  behaviors:
    - id: AC-01
      given: 신규 test.
      when: version 연속성 검사를 약화한다.
      then: test 가 실패한다.
    - id: AC-02
      given: 신규 test.
      when: store 신원 metadata 검사를 약화한다.
      then: test 가 실패한다.
    - id: AC-03
      given: 두 신규 test.
      when: 아무것도 바꾸지 않고 돌린다.
      then: 모두 통과한다.
    - id: AC-04
      given: AC-01 의 실험.
      when: 실패 사유를 확인한다.
      then: 미지원 future version 분기가 아니라 연속성 분기가 잡았음을 보인다.
    - id: AC-05
      given: AC-01 과 AC-02 의 각 실험.
      when: 실패한 test 이름과 실패 사유를 기록한다.
      then: 각 실험이 겨냥한 guard 하나만 깨뜨렸음을 보인다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_governance_migrations.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-05 의 실험별 실패 확인 기록
      required: true

risk:
  level: low
  concerns:
    - 연속성 실험 입력을 잘못 고르면 그 위의 미지원 version 분기가 먼저 잡아 고정을 잘못 주장하게 된다.
  approvals: []

loop:
  max_attempts: 4
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - guard_appears_unreachable_without_src_change
    - migration_definition_would_change
    - src_change_would_be_required
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-14T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T014.md

handoff:
  expected_changes:
    - 두 guard 의 회귀 test.
  notes:
    - >-
      실제 동작 결함이 아니다. 회귀 방어 부재다.
