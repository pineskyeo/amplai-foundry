schema_version: "1.0"

id: MGC-012-P5-T046
title: Annotate every sibling site a Decision invalidated, counted two ways
type: docs
status: done

goal:
  outcome: >-
    round 21 의 C21-4 를 닫고, D-057 이 새로 거짓으로 만든 자리에도 같은 정정을 단다.
  user_value: >-
    문서와 코드 주석이 지금 사실을 말한다. 자세한 것은
    `specs/003-slack-proposal-card/evidence/3lens-review-round-21.md` 다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-21.md
      section: New Blockers
  requirements:
    - FR-024
  decisions:
    - D-047
    - D-048
    - D-049
    - D-050
    - D-057

scope:
  include:
    - >-
      **`C21-4`** — `D-048`·`D-049` 가 틀렸다고 지목한 주장이 정정 없이 서 있는 자리에
      각주를 단다. wave 14 가 한 자리만 달고 `T038.yaml:38` 과 `CURRENT_ITEM.md` 를
      빠뜨렸다. **`C20-1` 의 재생산이다.**
    - >-
      **`D-057` 이 새로 무효로 만든 자리** — "`stranded()` 의 `limit` 과 뜻이 다르고 그
      차이는 없앨 수 없다" 계열. `ingress.py` 의 docstring, `T041.yaml`, `D-049`·`D-050` 의
      해당 절이다.
    - >-
      **`A21-5`**(= `A20-C3`, 두 라운드 미해결) — `test_slack_ack_boundary.py` 의 assert
      message 문구.
    - >-
      **형제 위치를 두 방법으로 센다.** grep 전수와 건수 세기가 일치해야 하고, 두 수를
      evidence 에 나란히 적는다.
  exclude:
    - "코드 동작 변경. `T047` 이 소유한다."
    - "test 추가. `T048` 이 소유한다."
    - "완료된 wave 의 evidence 본문 수정 — 각주만 단다 (`T039` 규칙)."
    - "`decisions.index.json` 등록 — `D-047`~`D-050` 이 전부 미등록이고 `D-057` 은 그 형제다."
  allowed_paths:
    - specs/003-slack-proposal-card/
    - docs/workstreams/messenger-governance-closure-v3/
    - src/amplai_foundry/governance/ingress.py
    - src/amplai_foundry/cli.py
    - tests/test_slack_ack_boundary.py
  forbidden_paths:
    - vault/
    - specs/003-slack-proposal-card/spec.md
    - .github/

dependencies:
  tasks:
    - MGC-012-P5-T047
  external: []

implementation:
  guidance:
    - >-
      **형제 위치를 끝까지 센다.** 규칙은 "정의 사본 + 호출 지점 + 같은 검사의 모든 성분"
      이다. 여섯 라운드 연속 이것을 어겼다.
    - >-
      **기존 사실 진술을 지우지 않는다 — 정정을 덧붙인다.** 승인 문구와 과거 evidence 는
      그대로 둔다 (`T039`).
    - >-
      **"과거에 참이던 기록" 과 "지금 거짓인 단정" 을 구분한다.** `(D-048 까지)` 처럼
      시점이 붙은 표 행은 정정 대상이 아니다.
  invariants:
    - "코드 동작을 바꾸지 않는다. 주석과 docstring 문구만 고친다."
    - "전 suite 결과가 바뀌지 않는다."
  non_goals:
    - 코드 동작 변경.
    - 새 Decision.

acceptance:
  behaviors:
    - id: AC-01
      given: "`D-048`·`D-049`·`D-057` 이 틀렸다고 지목한 주장이 있는 자리."
      when: 두 방법으로 센다.
      then: 두 수가 일치하고, 정정이 필요한 자리에 전부 각주가 있다.
    - id: AC-02
      given: 시점이 붙은 과거 기록.
      when: 읽는다.
      then: 정정 대상이 아니라는 판단과 그 근거가 evidence 에 있다.
    - id: AC-03
      given: 전체 test suite.
      when: 돌린다.
      then: 이전과 같은 결과다.
  commands:
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: manifest-validator
      kind: lint
      run: .venv/bin/python .claude/skills/taskify/scripts/validate_task_manifest.py specs/003-slack-proposal-card/task-manifests
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: sibling-count
      observer: 구현자
      action: grep 전수와 건수 세기 두 방법으로 형제 위치를 세고 둘 다 적는다.
      expected: 두 수가 일치한다. 불일치면 원인을 적는다.
      reason_not_automated: 정정이 필요한 단정인지를 기계로 판정할 규칙이 없다.
  evidence:
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: manifest-validator
      required: true
    - type: note
      source: 형제 위치 계수표 (두 방법)
      required: true

risk:
  level: low
  concerns:
    - "정정하면서 또 틀릴 수 있다. 실측으로 확인한다."
    - "형제 위치를 또 빠뜨릴 수 있다. 두 방법으로 세고 둘 다 적는다."
  approvals: []

loop:
