schema_version: "1.0"

id: MGC-012-P5-T009
title: Share one interruption classifier so a plain exception cannot escape the dispatcher
type: bugfix
status: done

goal:
  outcome: >-
    `slack_projection.py` 와 `slack_http.py` 가 같은 interruption 분류기 하나를 쓴다. 평범한
    Exception 은 두 파일 어디에서 나든 `deliver_next` 의 `except Exception` 이 잡을 수 있는
    형태로 올라가고, KeyboardInterrupt·SystemExit·GeneratorExit 는 그대로 전파된다.
  user_value: >-
    non-review event 배달 중 흔한 예외가 나면 지금은 bare BaseException 이 dispatcher 밖으로
    새어 event 가 `leased` 로 남고 worker 가 매번 죽는다. 공유 helper 하나로 그 경로를 닫고
    같은 drift 가 다시 생길 구조를 없앤다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-11.md
      section: R-1
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-11.md
      section: R-6
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-038
    - path: specs/003-slack-proposal-card/spec.md
      section: FR-021
  requirements:
    - FR-021
    - SC-003
  decisions:
    - D-038

scope:
  include:
    - "`_interruption_kind` 와 `_raise_sanitized_interruption` 을 공유 helper 한 쌍으로 합친다."
    - 두 파일이 그 helper 를 쓰고 각자 메시지만 인자로 넘긴다.
    - 네 interruption kind 전부에 대해 두 호출자 경로의 회귀 test 를 넣는다.
  exclude:
    - "`_clear_exception_frames` 4사본 통합. 아직 갈라지지 않았고 결함을 만든 적이 없다."
    - transient 와 terminal 의 분류 판단. MGC-012-P5-T010 이 맡는다.
    - interruption 의미 자체의 재정의.
    - retry, lease, supersession 정책 변경.
  allowed_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - src/amplai_foundry/governance/slack_http.py
    - tests/test_slack_projection.py
    - tests/test_slack_http.py
  forbidden_paths:
    - vault/
    - src/amplai_foundry/memory/
    - src/amplai_foundry/proposals/apply.py
    - src/amplai_foundry/cli.py
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      결함은 복제된 함수 쌍이 한쪽만 고쳐진 것이다. `slack_projection.py:1003` 은 평범한
      Exception 에 `"exception"` 을 돌려주고 `:1018` 이 catchable 한 `RuntimeError` 를 올린다.
      `slack_http.py:593` 은 `"base_exception"` 을 돌려주고 `:603` 은 `BaseException` 을 올려
      `deliver_next` 의 `except OutboxReconcileError` 와 `except Exception` 을 모두 통과한다.
    - >-
      `slack_http.py:35` 가 이미 `slack_projection` 을 import 하고 역방향 간선은 없다. helper 를
      `slack_projection` 에 module 수준으로 두면 순환 없이 양쪽이 쓴다. 새 import 간선을 만들지
      않는 배치를 고른다.
    - >-
      `slack_projection.py:942` 의 `if not is_review: raise` 가 non-review event 를 그대로
      통과시킨다. 그래서 leak 이 review 가 아닌 경로에서만 보였다. helper 를 합쳐도 이 분기의
      의미는 바꾸지 않는다 — 통과한 예외가 catchable 하기만 하면 된다.
    - >-
      `slack_projection.py:1014-1017` 의 주석이 왜 catchable 이어야 하는지 적고 있다. 그 근거를
      공유 helper 에 옮긴다.
  invariants:
    - KeyboardInterrupt 와 SystemExit 는 여전히 interruption 으로 전파된다.
    - GeneratorExit 는 여전히 GeneratorExit 로 전파된다.
    - 평범한 Exception 은 어느 호출자에서도 BaseException 으로 승격되지 않는다.
    - 실패 시 raw ActionToken credential 은 durable state, log, exception, traceback 에 남지 않는다.
    - 성공 경로의 동작은 바뀌지 않는다.
  non_goals:
    - transient 재분류. MGC-012-P5-T010 이 맡는다.
    - ingress 소진 종결. MGC-012-P5-T011 이 맡는다.

acceptance:
  behaviors:
    - id: AC-01
      given: non-review outbox event 배달 중 transport 가 평범한 Exception 을 던지는 상태.
      when: dispatcher 가 그 event 를 배달한다.
      then: 예외가 `deliver_next` 밖으로 나가지 않고 durable 실패 기록이 남으며 event 가 `leased` 로 방치되지 않는다.
    - id: AC-02
      given: review outbox event 배달 중 같은 평범한 Exception 이 나는 상태.
      when: dispatcher 가 그 event 를 배달한다.
      then: AC-01 과 같은 종류의 durable 결말에 도달한다.
    - id: AC-03
      given: 두 호출자 각각에서 KeyboardInterrupt, SystemExit, GeneratorExit 가 발생한 상태.
      when: dispatcher 가 그 event 를 배달한다.
      then: 같은 종류로 전파되고 삼켜지지 않는다.
    - id: AC-04
      given: 합쳐진 helper.
      when: 저장소에서 interruption 분류기 정의를 센다.
      then: 정의가 한 곳이고 두 파일이 그것을 쓴다.
    - id: AC-05
      given: AC-01 과 AC-03 을 고정한다고 주장하는 신규 test.
      when: helper 의 각 분기를 하나씩 되돌려 결함을 재도입한다.
      then: 해당 test 가 실제로 실패한다. 실패를 확인하지 못한 분기는 evidence 에 고정한다고 적지 않는다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_slack_projection.py tests/test_slack_http.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-05 의 분기별 negative verification 결과
      required: true

risk:
  level: medium
  concerns:
    - helper 배치를 잘못 고르면 import 순환이 생긴다.
    - interruption 판별을 넓게 잡으면 실제 process interruption 이 삼켜진다.
    - 두 호출자의 메시지 문자열이 다르므로 합칠 때 한쪽 메시지가 사라질 수 있다.
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - import_cycle_would_be_introduced
    - interruption_semantics_would_change
    - raw_secret_appears_in_any_evidence
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-14T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T009.md

handoff:
  expected_changes:
    - 공유 interruption 분류기 한 쌍과 두 호출자의 전환.
    - 네 kind × 두 호출자 경로의 회귀 test.
  notes:
    - >-
      wave 4 가 `slack_projection` 사본만 고치고 `slack_http` 사본을 놓쳐서 생긴 결함이다.
      고칠 때 저장소 전체에서 같은 형태를 센다는 stop rule 이 여기서 나왔다.
    - >-
      `_clear_exception_frames` 는 `decisions.py:775`, `slack_projection.py:1085`,
      `slack_http.py:572`, `slack_cards.py:327` 네 사본이다. 이 task 범위 밖이고 backlog 다.
