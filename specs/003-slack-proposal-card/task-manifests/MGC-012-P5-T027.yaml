schema_version: "1.0"

id: MGC-012-P5-T027
title: Dead-letter an ingress command row that cannot be read instead of stalling the queue
type: fix
status: done

goal:
  outcome: >-
    `claim_next` 가 durable row 를 `IngressCommandView` 로 만들지 못하면 그 row 를
    `dead_letter` 로 옮기고 `INGRESS_COMMAND_UNREADABLE` 을 적는다. `stranded()` 가 그것을
    낸다. **큐가 풀리고 operator 가 본다.**
  user_value: >-
    round 15 `F-1` 이 P0 로 실측했다. `_view`(`ingress.py:482`)의 `json.loads`(`:492`)가
    `ValueError` 를 내는데 `process_next` 의 except tuple 이 그것을 안 잡는다. `_view` 가
    transaction 안이라 claim 이 rollback 되고 row 는 `pending`·`attempts=0` 으로 돌아간다.
    `received_at` 순으로 다시 뽑히므로 **뒤에 들어온 command 가 하나도 처리되지 않는다.**
    그리고 `pending` 이라 `stranded()` 에 안 걸려 `governance stranded` 가 `NONE` 을 낸다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-15.md
      section: F-1
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-15.md
      section: F-2
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-045
  requirements:
    - FR-024
    - FR-026
    - SC-004
  decisions:
    - D-045

scope:
  include:
    - >-
      `_view` 실패를 `claim_next` 안에서 잡아 그 row 를 `dead_letter` +
      `INGRESS_COMMAND_UNREADABLE` 로 옮긴다. 옮긴 뒤 다음 row 로 진행한다.
    - >-
      `stranded()`(`:382`)와 `get()`(`:378`)에서도 `_view` 실패가 raw `ValueError` 로
      나가지 않게 한다. `stranded()` 는 읽을 수 있는 row 를 계속 낸다.
    - "`_view` 가 실패할 수 있는 모든 진입점을 전수로 센다. 셋만이라고 가정하지 않는다."
    - head-of-line 이 실제로 풀리는지 두 command 로 재현하는 test.
  exclude:
    - "`dead_letter` 에서 빼내는 governed recovery. `D-038` 항목 1 이 별도 item 으로 뒀다."
    - "`sqlite3.Error` 나 store 손상 경로 변경. 기존 분류를 그대로 쓴다."
    - "사용자 통지. `INGRESS_COMMAND_UNREADABLE` 은 error code 이지 safe outcome 이 아니다."
    - "`ingress_worker.py` 의 except tuple 확장. 경계에서 닫는다 — 호출자를 세지 않는다."
    - "`cli.py`. MGC-012-P5-T028 이 맡는다."
  allowed_paths:
    - src/amplai_foundry/governance/ingress.py
    - tests/test_ingress.py
    - tests/test_slack_ack_boundary.py
  forbidden_paths:
    - vault/
    - .github/
    - src/amplai_foundry/governance/ingress_worker.py
    - src/amplai_foundry/governance/store.py
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/migrations.py

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **먼저 재현한다.** reviewer 가 `UPDATE governance_ingress_commands SET
      channel_json='{bad'` 로 만들었다. 같은 방식으로 (a) `process_next` 가 raw 로 죽는 것,
      (b) row 가 `pending`·`attempts=0` 에 남는 것, (c) 뒤 command 가 막히는 것,
      (d) `stranded()` 가 터지는 것 넷을 각각 실측한다. **재현 없이 고치지 않는다.**
    - >-
      **`_view` 호출 지점을 전수로 센다.** reviewer 는 `claim_next`(`:335`), `stranded()`,
      `get()` 을 지목했다. `grep -n "_view("` 로 직접 다시 세고 표로 적는다. 이번 wave 가
      다섯 라운드 연속 "형제를 안 셌다" 로 걸린 것을 반복하지 않는다.
    - >-
      **`_view` 가 낼 수 있는 예외를 전수로 센다.** `json.loads` 의 `JSONDecodeError` 와
      pydantic `ValidationError` 둘 다 `ValueError` 이지만, `row[N]` index 오류는
      `IndexError` 이고 `TypeError` 도 가능하다. **어디까지 잡을지 정하고 근거를 적는다.**
      `Exception` 으로 넓히면 프로그래밍 오류가 durable 하게 숨는다.
    - >-
      **`dead_letter` 로 옮기는 write 는 claim transaction 과 분리해야 한다.** 지금 실패는
      transaction rollback 을 낳는다. 같은 transaction 안에서 옮기려 하면 rollback 이
      그것도 되돌린다. 순서를 실측으로 확인한다.
    - >-
      **다음 row 로 진행한다.** 손상 row 하나를 치우고 끝내면 손상이 둘일 때 두 번 돌아야
      한다. 그것이 맞는지 아니면 한 번에 하나만 치우고 반환할지 정하고 근거를 적는다.
    - >-
      **`stranded()` 는 부분 결과를 낸다.** 읽을 수 없는 row 때문에 목록 전체가 사라지면
      `T026` 의 목적이 무너진다 (`F-2`). 읽은 것을 내고 못 읽은 것은 수를 알린다.
  invariants:
    - "`process_next` 밖으로 `ValueError` 가 나가지 않는다."
    - "손상 row 뒤의 command 가 처리된다."
    - "손상 row 가 `stranded()` 에 보인다."
    - "정상 claim 경로의 동작이 바뀌지 않는다."
    - "사용자 통지가 생기지 않는다."
    - "프로그래밍 오류(`AttributeError`, `TypeError`)는 여전히 시끄럽게 나간다."
    - "`ingress_worker.py`, `store.py`, `events.py` 를 수정하지 않는다."
  non_goals:
    - dead letter 해제 경로.
    - store 손상 분류 변경.
    - 새 safe outcome.

acceptance:
  behaviors:
    - id: AC-01
      given: 착수 전 코드와 손상 row 하나.
      when: "`process_next` 를 부른다."
      then: >-
        raw `ValueError` 가 밖으로 나가는 것을 실측한다. row 가 `pending`·`attempts=0` 에
        남는 것도 함께 보인다.
    - id: AC-02
      given: 같은 상태, command 둘 (손상 row 가 먼저).
      when: worker loop 를 여러 번 돌린다.
      then: 뒤 command 가 처리되지 않는 것을 실측한다. **이것이 P0 의 실체다.**
    - id: AC-03
      given: 소스 전체.
      when: "`_view` 호출 지점을 전수 열거한다."
      then: 표로 적고 개수를 명시한다. 각 지점이 이 변경으로 덮이는지 판정한다.
    - id: AC-04
      given: 고친 코드와 손상 row.
      when: "`process_next` 를 부른다."
      then: >-
        예외가 밖으로 나오지 않고 그 row 가 `dead_letter` + `INGRESS_COMMAND_UNREADABLE` 이다.
    - id: AC-05
      given: 같은 상태, command 둘.
      when: worker loop 를 돌린다.
      then: 뒤 command 가 처리된다. **head-of-line 이 풀린다.**
    - id: AC-06
      given: 고친 코드.
      when: "`stranded()` 를 부른다."
      then: >-
        읽을 수 있는 row 가 전부 나오고 예외가 나지 않는다. 손상 row 는 별도 조회로
        `command_id` 를 낸다.

        **초안 정정 (구현 전, 2026-08-18).** 처음 이 AC 를 "손상 row 가 목록에 있고" 로
        썼다. **이 설계로는 만족할 수 없다** (round 16 이 "구현 불가능" 은 과장이라고
        정정했다 — `stranded()` 의 반환 model 을 바꾸면 가능했고, 불가능한 것이 아니라 그
        설계를 택하지 않은 것이다) — `stranded()` 는 `tuple[IngressCommandView, ...]` 를
        내는데 손상 row 는 그 model 로 만들 수 없다. 그게 손상의 정의다. 빈 값을 채운
        가짜 view 를 넣으면 operator 에게 거짓을 보이는 것이라 더 나쁘다. 그래서 읽을 수
        없는 row 의 `command_id` 를 내는 별도 조회를 두고 CLI 가 둘을 함께 보인다.
        **구현 뒤에 AC 를 맞추지 않고 착수 전에 고쳤다** — round 12 `C-2` 가 잡은 것이
        그 순서였다.
    - id: AC-07
      given: 고친 코드.
      when: 사용자 통지 경로를 본다.
      then: 아무것도 나가지 않는다. `INGRESS_COMMAND_UNREADABLE` 은 safe outcome 이 아니다.
    - id: AC-08
      given: 고친 코드.
      when: "`_view` 안에서 `AttributeError` 가 나게 한다."
      then: 그대로 나간다. 정규화가 프로그래밍 오류를 숨기지 않는다.
    - id: AC-09
      given: 고친 코드.
      when: 정상 command 만 있는 store 에서 worker 를 돌린다.
      then: 착수 전과 같은 결과다. 정상 경로가 안 바뀌었다.
    - id: AC-10
      given: 신규 test.
      when: dead-letter 전환을 제거한다.
      then: test 가 실패한다.
    - id: AC-11
      given: 전체 test suite.
      when: 아무것도 바꾸지 않고 돌린다.
      then: round 15 기준(1358 passed, 4 deselected) 이상으로 통과하고 실패가 없다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_ingress.py tests/test_slack_ack_boundary.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01 과 AC-02 의 착수 전 재현
      required: true
    - type: note
      source: AC-03 의 `_view` 호출 지점 전수 표
      required: true
    - type: note
      source: 잡을 예외 집합의 선택 근거
      required: true

risk:
  level: high
  concerns:
    - >-
      읽기 실패를 근거로 durable state 를 바꾼다. 넓게 잡으면 정상 row 를 dead letter 로
      보낼 수 있고 그것은 되돌릴 수 없다. 잡는 예외 집합을 좁게 유지한다.
    - >-
      claim transaction 과 dead-letter write 의 순서를 잘못 잡으면 rollback 이 그 write 를
      되돌려 아무것도 안 고쳐진다. 실측으로 확인한다.
    - >-
      `stranded()` 를 고치면서 부분 결과를 내면 operator 가 목록이 완전하다고 오해할 수
      있다. 못 읽은 수를 함께 알린다.
  approvals:
    - >-
      `D-045` 가 2026-08-18 에 승인됐다 — 읽을 수 없는 row 를 `dead_letter` 로 옮기고
      `stranded()` 에 노출한다. fail-closed 정지와 raw escape 만 감싸는 안은 기각됐다.

loop:
  max_attempts: 4
  replan_after_same_failure: 3
  stop_conditions:
    - dead_letter_write_is_rolled_back_by_the_claim_transaction
    - a_healthy_row_would_be_dead_lettered
    - exception_set_must_widen_to_Exception
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-18T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T027.md

handoff:
  expected_changes:
    - "`claim_next` 가 읽을 수 없는 row 를 dead letter 로 옮기고 진행한다."
    - "`stranded()` 와 `get()` 이 raw `ValueError` 를 내지 않는다."
  notes:
    - >-
      **P0 이다.** 큐가 무한정 멈추고 operator 에게 보이지도 않는다.
    - >-
      `T024` 가 "경계에서 정규화한다" 를 `connect()` 에만 적용해서 남은 구멍이다. 같은
      모양을 `T024-F1`(`_replayed_decision` 의 `ValueError`)로 기록해 놓고 이쪽을 안 찾았다.
