  concerns:
    - >-
      도달 불가능한 실패를 억지로 만들면 test 가 구현을 흉내낼 뿐 계약을 고정하지 않는다.
      도달 방법을 못 찾으면 그렇게 적는다.
  approvals: []

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
