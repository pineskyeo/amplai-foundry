# --- 정정 (wave 12 / `T039`, 2026-08-26, round 18 `N18-3`) -------------------
# 이 파일이 말하는 "아홉 handler" 는 `connect()` 를 감싸며 `sqlite3.Error` 를 잡는 `try`
# 를 센 값이다. **그 값은 지금 열이다** — `legacy_migration:1665` 가 그 뒤에 늘었다.
# `sqlite3.Error` 계열을 잡는 `except` handler 는 **열셋**이고, 둘은 다른 것을 센다.
# 근거는 `src/amplai_foundry/governance/store.py` 머리말의 두 목록과
# `specs/003-slack-proposal-card/evidence/MGC-012-P5-T039.md` 다.
#
# **본문은 고치지 않는다.** manifest 는 그 wave 가 무엇을 계약했는지의 기록이고, 숫자를
# 지금 값으로 덮으면 그 기록이 사라진다 (Knowledge Safety). 다만 `invariants:` 아래의
# 현재형 문장은 위 값으로 읽는다.
# ---------------------------------------------------------------------------
schema_version: "1.0"

id: MGC-012-P5-T033
title: Pin the revert point that no test was holding
type: test
status: done

goal:
  outcome: >-
    `T029` 가 되돌린 세 지점 전부가 test 로 고정된다. 어느 하나를 다시 감싸는 mutation 이
    죽는다.
  user_value: >-
    round 16 `R16-2`. `T029` 는 `_OPEN_FAILURES` 축소와 `_raw_connection` PRAGMA 되돌림을
    했는데 test 는 `_configure` 지점 하나만 고정했다. `_raw_connection` 의 PRAGMA 를 다시
    `GovernanceStoreError` 로 감싸는 mutation 이 `test_governance_store.py` 40건을 전부
    통과한다. **round 15 `R-1` 이 "test 가 없어서 suite 는 조용했다" 로 잡은 그 상태가 절반
    남아 있다.**

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-16.md
      section: R16-2
    - path: specs/003-slack-proposal-card/evidence/MGC-012-P5-T029.md
      section: The Change
  requirements:
    - FR-021
    - FR-024
    - SC-003
  decisions:
    - D-042

scope:
  include:
    - >-
      `T029` 가 정규화하지 않기로 한 지점을 **전수로 센다.** evidence 는 셋을 적었다 —
      `_configure` 의 PRAGMA, `PRAGMA database_list`, `_raw_connection` 의 PRAGMA.
      **직접 다시 센다.**
    - 각 지점을 다시 감싸는 mutation 이 죽는 test.
    - "`A16-2` — `T029` evidence 가 못 한 아홉 handler 독립 재계수를 여기서 한다."
  exclude:
    - "`store.py` 의 동작 변경. 이 task 는 test 만 더한다."
    - "`legacy_*.py` 수정."
    - "`cli.py`, `ingress.py`. T031·T032 가 맡는다."
  allowed_paths:
    - tests/test_governance_store.py
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T029.md
  forbidden_paths:
