    - src/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **먼저 무방비를 실측한다.** 각 지점을 `try/except sqlite3.Error → GovernanceStoreError`
      로 감싸고 `test_governance_store.py` 를 돌린다. 어느 것이 살아남는지 목록으로 적는다.
      reviewer 는 `_raw_connection` 하나를 확인했다 — 나머지 둘도 직접 본다.
    - >-
      **`src/` 를 수정하지 않는다.** mutation 은 측정용이고 반드시 복원한다. `allowed_paths`
      가 `src/` 를 막고 있다.
    - >-
      **각 지점에 도달하는 방법이 다르다.** `_configure` 는 monkeypatch 로 됐다.
      `_raw_connection` 의 PRAGMA 와 `PRAGMA database_list` 는 어떻게 실패시킬지 정한다 —
      **실제로 도달 가능한 방법을 찾는다.** 도달 불가능하면 그것을 finding 으로 적는다.
    - >-
      **아홉 handler 를 직접 센다.** `T029` evidence 가 round 15 표를 옮겼을 뿐이다
      (`A16-2`). AST 로 `connect()` 를 감싸며 `sqlite3.Error` 를 잡되 `GovernanceStoreError`
      나 `Exception` 은 안 잡는 `try` 를 열거한다. 값이 아홉인지 확인한다.
  invariants:
    - "`src/` 를 수정하지 않는다."
    - "기존 test 를 지우거나 약화하지 않는다."
    - "전 suite 결과가 나빠지지 않는다."
  non_goals:
    - store 동작 변경.
    - legacy handler 수정.

acceptance:
  behaviors:
    - id: AC-01
      given: 착수 전 코드.
      when: 세 지점을 각각 다시 감싸고 `test_governance_store.py` 를 돌린다.
      then: 어느 것이 살아남는지 목록으로 적는다. 이것이 기준선이다.
    - id: AC-02
      given: 소스 전체.
      when: "`connect()` 를 감싸며 `sqlite3.Error` 를 잡는 `try` 를 AST 로 전수한다."
      then: 표로 적고 개수를 명시한다. 아홉인지 **직접** 확인한다.
    - id: AC-03
      given: 새 test.
      when: AC-01 에서 살아남던 mutation 을 다시 돌린다.
      then: 전부 죽는다.
    - id: AC-04
      given: 도달 불가능한 지점이 있으면.
      when: 그것을 판정한다.
      then: 이유를 evidence 에 적는다. 억지 test 를 만들지 않는다.
    - id: AC-05
      given: 전체 test suite.
      when: 돌린다.
      then: 실패가 없다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_governance_store.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: note
      source: AC-01 의 지점별 기준선
      required: true
    - type: note
      source: AC-02 의 handler 독립 재계수
      required: true

risk:
