schema_version: "1.0"

id: MGC-012-P5-T037
title: Stop reproducing the evidence failure this feature keeps pointing at
type: docs
status: done

goal:
  outcome: >-
    `required: true` 로 선언한 evidence 가 전부 실재하고, `all_acceptance_passed` 가 실제
    AC 절 유무와 일치하며, handler 개수 주장이 실측값을 쓴다.
  user_value: >-
    round 17 `F17-4`·`F17-5`·`F17-6`. **`T034` 가 지적한 것을 같은 wave 가 재생산했다.**
    `C16-3`(선언한 evidence 부재)과 `A16-5`(주장만 있고 실측 없음)를 지적하면서 `T031` 과
    `T033` 이 각각 그 둘을 다시 냈다. Completion Gate 가 금지하는 것 — 실행하지 않은
    검증을 통과했다고 선언하는 것 — 이다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-17.md
      section: New Blockers
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-17.md
      section: Advisory
  requirements:
    - FR-024
  decisions:
    - D-045
    - D-047

scope:
  include:
    - >-
      **`F17-4`** — `required: true` 인 command_output 선언 **206개를 전수 대조**한다.
      round 17 은 wave 8~10 산출물(`T026`~`T034`) 범위에서 **9 중 5** 를 댔고 그 판정은
      맞다. 그러나 feature 전체로 넓히면 **19 manifest 의 49 선언**이 evidence 에 없다 —
      `T002`·`T003`·`T006`·`T007`·`T009`~`T014`·`T021`~`T024` 열넷이 더 있다. 사용자가
      2026-08-26 에 **열아홉을 전부 닫기로** 정했다. **자기 manifest 부터 본다.**
    - >-
      **`F17-5`** — `T033` AC-02 가 "`connect()` 를 감싸는 handler 를 AST 로 전수하고 표로
      적고 개수를 **직접** 확인한다" 를 요구하는데 evidence 에 절도 표도 개수도 없다.
    - >-
      **`F17-6`** — `T031` evidence 에 AC-07·AC-12 절이 없고 AC-03 이 **남의 재현**을
      인용한다.
    - >-
      **`A17-5`** — "legacy_*.py **아홉** handler" 가 **실측 13** 이다. round 17 은 그
      주장이 문서 **넷**에 있다고 적었으나 wave 11 이 전수로 세니 **여덟**이다 —
      `store.py` 둘, `test_governance_store.py:1259`, `test_cli.py:346` 이 빠져 있었다.
      **round 17 자신도 형제를 다 세지 못했다.** 두 방법으로 세고 둘 다 적는다.
    - >-
      **범위 밖 발견 기록** — `OutboxDispatcher.claim_next` 가 같은 형태를 갖는 것을 wave 11
      이 실측했다. wave 11 은 고치지 않는다. evidence 와 `CURRENT_ITEM.md` 에 남겨 다음
      wave 가 받게 한다.
  exclude:
    - "코드 변경."
    - "test 변경."
    - "`spec.md` 의 FR 신설 — `OQ-001` 은 사용자가 wave 11 밖에 뒀다."
    - "`OutboxDispatcher` 수정."
    - >-
      `live-e2e` 실행. 실제 Slack workspace 로 나가는 행위라 wave 11 이 하지 않는다. 그
      선언은 채우는 대신 이유를 적는다.
  allowed_paths:
    - specs/003-slack-proposal-card/task-manifests/
    - specs/003-slack-proposal-card/evidence/
    # 열아홉 manifest 의 evidence 를 채운다 (사용자 결정 2026-08-26).
    - src/amplai_foundry/cli.py
    - src/amplai_foundry/governance/store.py
    - tests/test_governance_store.py
    - tests/test_cli.py
    - docs/workstreams/messenger-governance-closure-v3/
  forbidden_paths:
    - vault/
    - specs/003-slack-proposal-card/spec.md
    - src/amplai_foundry/governance/ingress.py
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/legacy_migration.py
    - src/amplai_foundry/governance/legacy_recovery.py
    - src/amplai_foundry/governance/legacy_rollback.py
    - src/amplai_foundry/governance/legacy_lifecycle.py
    - src/amplai_foundry/governance/legacy_gates.py
    - .github/

dependencies:
  tasks:
    - MGC-012-P5-T035
    - MGC-012-P5-T036
  external: []

implementation:
  guidance:
    - >-
      **자기 manifest 부터 본다.** `T035`·`T036`·`T037` 이 선언한 `required: true` evidence
      를 먼저 전수 대조한다. 그 다음 기존 아홉을 본다. round 17 이 실패한 순서가 그
      반대였다.
    - >-
      **세고 나서 적는다.** `A17-5` 는 AST 로 `sqlite3.Error`/`DatabaseError`/
      `OperationalError` 를 잡는 `ExceptHandler` 를 세고, grep 으로 다시 센다. **두 값을 다
      적는다.** 파일 수도 함께 센다 — round 17 이 "아홉은 파일 수도 handler 수도 아니다"
      라고 적었다.
    - >-
      **"아홉" 이 있는 문서가 넷인지 다시 센다.** round 17 은 `cli.py:716` 과
      `test_governance_store.py:1177,1186,1220` 넷을 댔다. **형제 위치를 끝까지 세는 것이
      여섯 라운드 연속 실패한 지점이다.**
    - >-
      **남의 재현을 인용하지 않는다.** AC 마다 이 wave 가 실행한 출력을 붙인다. 못 붙이면
      **못 붙이는 이유**를 적고 `all_acceptance_passed` 를 그에 맞춘다.
    - >-
      **Outbox 발견은 사실만 적는다.** 실측 명령과 출력, 그리고 ingress 와의 차이
      (`governance_outbox_payload_immutable` trigger 가 payload 11 column 을 막는 것,
      `D-045` 의 치우기 경로가 없는 것)를 함께 적는다. 고칠지는 다음 wave 가 정한다.
  invariants:
    - "기존 사실 진술을 지우지 않는다 — 정정을 덧붙인다."
    - "실행하지 않은 출력을 지어내지 않는다."
    - "코드와 test 의 동작을 바꾸지 않는다. `A17-5` 정정은 주석·문자열에 한한다."
    - "전 suite 결과가 바뀌지 않는다."
  non_goals:
    - 코드 동작 변경.
    - 새 Decision.
    - Outbox 수정.

acceptance:
  behaviors:
    - id: AC-01
      given: feature 의 모든 task manifest.
      when: "`evidence[].required: true` 목록과 evidence 문서를 전수 대조한다."
      then: >-
        어긋난 것이 0개다. 다만 **실행할 수 없는 것**(외부 workspace 를 치는 `live-e2e`)은
        실행하지 않고 그 이유를 적으며 `required` 선언을 그에 맞춘다. 대조 표를 evidence 에
        적고 **선언 총계와 채운 수를 둘 다** 쓴다.
    - id: AC-02
      given: "`T033` evidence."
      when: 읽는다.
      then: AC-02 절과 handler 표와 실측 개수가 있다.
    - id: AC-03
      given: "`T031` evidence."
      when: manifest 의 AC 목록과 대조한다.
      then: AC-07·AC-12 절이 있고 AC-03 이 자기 실행을 인용한다.
    - id: AC-04
      given: "`legacy_*.py`."
      when: AST 와 grep 두 방법으로 handler 를 센다.
      then: 두 값이 같다. 값과 방법과 파일 수를 evidence 에 적는다.
    - id: AC-05
      given: "`legacy_*.py` handler 개수를 \"아홉\" 으로 주장하는 위치."
      when: repository 전역에서 전수로 찾는다.
      then: >-
        개수를 세어 적고 현재 사실을 말하는 것(코드·test 주석)은 전부 실측값으로 고친다.
        과거 evidence 의 기록은 지우지 않고 정정 각주를 단다. **round 17 이 댄 넷과
        실측값이 다르면 그 차이도 적는다.**
    - id: AC-06
      given: wave 11 의 Outbox 실측.
      when: evidence 와 `CURRENT_ITEM.md` 를 읽는다.
      then: 실측 명령·출력·ingress 와의 차이가 적혀 있고 범위 밖임이 명시돼 있다.
    - id: AC-07
      given: 전체 test suite.
      when: 돌린다.
      then: 이전과 같은 결과다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_cli.py tests/test_governance_store.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: manifest-validator
      kind: lint
      run: .venv/bin/python .claude/skills/taskify/scripts/validate_task_manifest.py specs/003-slack-proposal-card/task-manifests
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: evidence-crosswalk
      observer: 구현자
      action: >-
        12 manifest 의 `evidence[].required: true` 항목을 하나씩 읽고 대응하는 evidence
        문서에서 그 출력을 찾는다.
      expected: 빠진 항목이 0개다. 대조 표에 manifest·항목·evidence 위치가 있다.
      reason_not_automated: >-
        evidence 문서는 산문이라 항목 존재를 기계적으로 판정할 규칙이 없다. validator 는
        manifest 형식만 본다.
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: manifest-validator
      required: true
    - type: command_output
      source: diff-check
      required: true
    - type: note
      source: AC-01 의 evidence 대조 표 (12 manifest)
      required: true
    - type: note
      source: AC-04 의 handler 두 방법 계수와 파일 수
      required: true
    - type: note
      source: AC-06 의 Outbox 실측 기록
      required: true

risk:
  level: low
  concerns:
    - >-
      **정정하면서 또 틀릴 수 있다.** 여섯 라운드 연속 수치를 틀렸고 원인은 매번 같았다 —
      세지 않고 기억하거나 추정한 값을 적었다. 두 방법으로 세고 둘 다 적는다.
    - >-
      **evidence 규율을 고치는 task 가 자기 evidence 를 빠뜨리면 여덟 번째다.**
  approvals: []

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - a_correction_would_require_a_code_change
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-26T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T037.md

handoff:
  expected_changes:
    - "evidence 대조 표와 빠진 출력 채움."
    - "`T031`·`T033` evidence 의 빠진 AC 절."
    - "\"아홉\" 을 실측값으로 정정."
    - "Outbox 발견 기록."
  notes:
    - >-
      **evidence 가 gate 의 근거다.** 수치가 틀리거나 요구된 출력이 없으면 gate 판정이
      근거를 잃는다.
