schema_version: "1.0"

id: MGC-012-P5-T040
title: Stop the freeze from carrying what the freeze itself creates
type: docs
status: done

goal:
  outcome: >-
    review target 의 재확인 script 가 전 건 통과하고, aggregate 가 무엇을 보장하고 무엇을
    보장하지 않는지 그 파일이 스스로 말한다. mutation 결과가 `.pyc` 캐시에 위조되지 않는다.
  user_value: >-
    round 18 `N18-4` 와 `A18-R1`. freeze manifest 가 `evidence-trace.jsonl` 의 **4줄 시점
    hash** 를 담았는데 파일은 7줄이다 — **freeze 뒤에 trace 를 더 썼다.** 그리고 aggregate 는
    manifest 행 문자열만 해싱하므로 **어떤 파일 내용 변조도 못 잡는다.** 세 reviewer 가 전부
    aggregate 일치를 무손상 근거로 인용했다.

    `A18-R1` 은 더 무겁다. **`.pyc` 캐시가 mutation 결과를 위조한다.** round 17·18 이
    mutation 을 blocker 판정의 근거로 삼는다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-18.md
      section: New Blockers
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-18.md
      section: Advisory
  requirements:
    - FR-024
  decisions:
    - D-045

scope:
  include:
    - >-
      **`N18-4` 앞부분** — freeze 가 자기 자신이 만드는 변경을 담지 않게 한다. evidence
      trace 를 freeze **앞**에 다 쓰거나, target 에서 제외하고 그 이유를 적는다.
    - >-
      **`N18-4` 뒷부분** — aggregate 의 한계를 target 파일에 적는다. **aggregate 일치는
      목록이 안 바뀌었다는 뜻이지 파일이 안 바뀌었다는 뜻이 아니다.** 재확인 script 가
      행별 hash 를 확인하는 것이 실제 보장이다.
    - >-
      **`A18-R1`** — mutation 절차에 `.pyc` 캐시 방지를 넣는다. `CURRENT_ITEM.md` 의 Stop
      rule 에도 남긴다.
    - >-
      **`A18-7`** — trace 의 `review_target_frozen` 이 manifest 작성 뒤에 쓰였다. `N18-4`
      와 같은 뿌리다.
  exclude:
    - "코드·test 변경."
    - "round 18 target 파일 자체의 재작성 — 이미 review 가 끝났다. round 19 freeze 부터 적용한다."
    - "`T038`·`T039` 가 소유한 것."
  allowed_paths:
    - specs/003-slack-proposal-card/evidence/
    - specs/003-slack-proposal-card/task-manifests/
    - docs/workstreams/messenger-governance-closure-v3/
  forbidden_paths:
    - vault/
    - specs/003-slack-proposal-card/spec.md
    - src/
    - tests/
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **freeze 는 마지막에 한다.** trace·evidence·문서를 다 쓴 뒤에 얼린다. 그래도 freeze
      자체를 기록하려면 그 기록은 target 밖이어야 한다 — **자기참조다.** target 파일이
      자기 자신을 목록에 안 넣는 것과 같은 이유다.
    - >-
      **aggregate 가 무엇인지 정확히 적는다.** 지금 문구는 "aggregate = sha256 of the N
      lines above" 다. 그 행들이 각 파일의 hash 를 담으므로 **목록 자체의 무결성**은
      보장하지만, 행이 가리키는 파일이 그 뒤에 바뀐 것은 **재확인 script 를 돌려야만**
      드러난다. 세 reviewer 가 그것을 혼동했다.
    - >-
      **`.pyc` 방지를 절차로 만든다.** 한 번 적고 끝내지 않는다. round 17·18 의 mutation
      표가 전부 그 위험 아래 있었다.
  invariants:
    - "round 18 target 파일을 고치지 않는다 — 이미 끝난 review 의 근거다."
    - "기존 기록을 지우지 않는다."
    - "코드와 test 를 바꾸지 않는다."
  non_goals:
    - 코드 변경.
    - round 18 결과 재판정.

acceptance:
  behaviors:
    - id: AC-01
      given: round 19 의 freeze 절차.
      when: 문서로 적는다.
      then: >-
        freeze 뒤에 target 안의 파일을 쓰지 않는 순서가 명시돼 있다. 어길 수밖에 없는
        파일(evidence trace)은 target 에서 빼고 그 이유를 적는다.
    - id: AC-02
      given: round 19 target 파일.
      when: 머리말을 읽는다.
      then: >-
        aggregate 가 목록의 무결성만 보장하고 파일 내용은 재확인 script 로만 확인된다는
        문구가 있다.
    - id: AC-03
      given: round 19 target 파일.
      when: 재확인 script 를 돌린다.
      then: 전 건 통과한다. 어긋남 0건이다.
    - id: AC-04
      given: mutation 절차.
      when: 문서로 적는다.
      then: >-
        `.pyc` 캐시 방지가 명시돼 있고 `CURRENT_ITEM.md` 의 Stop rule 에도 있다. round 18
        `A18-R1` 이 실측한 위조 사례를 인용한다.
    - id: AC-05
      given: 전체 test suite.
      when: 돌린다.
      then: 이전과 같은 결과다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_cli.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: manifest-validator
      kind: lint
      run: .venv/bin/python .claude/skills/taskify/scripts/validate_task_manifest.py specs/003-slack-proposal-card/task-manifests
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: freeze-reverify
      observer: 구현자
      action: round 19 target 을 얼린 뒤 그 파일 머리말의 재확인 script 를 그대로 실행한다.
      expected: 어긋남 0건. 출력의 aggregate 가 파일 끝의 값과 같다.
      reason_not_automated: >-
        freeze 는 review 착수 직전 한 번 하는 절차라 suite 에 넣을 대상이 아니다.
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: manifest-validator
      required: true
    - type: command_output
      source: diff-check
      required: true
    - type: note
      source: AC-03 의 재확인 script 실행 출력
      required: true
    - type: note
      source: freeze 순서와 aggregate 한계 문구
      required: true

risk:
  level: low
  concerns:
    - >-
      **절차 문서는 지키지 않으면 소용이 없다.** round 19 freeze 에서 실제로 통과하는지
      확인해야 닫힌다.
  approvals: []

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-26T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T040.md

handoff:
  expected_changes:
    - "freeze 순서와 trace 취급."
    - "aggregate 한계 문구."
    - "mutation 의 `.pyc` 방지 Stop rule."
  notes:
    - >-
      **aggregate 일치가 무손상 증거가 아니다.** 세 reviewer 가 그것을 근거로 인용했다.
