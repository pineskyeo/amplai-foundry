schema_version: "1.0"

id: MGC-012-P5-T017
title: Write the third exhaustion ending into the requirement and the contract
type: docs
status: done

goal:
  outcome: >-
    `spec.md` FR-026 과 `contracts/interaction-feedback.md` 가 소진 종점을 셋으로 적는다.
    셋째는 "마지막 attempt 가 관측됐고 실패했으나 앞선 attempt 가 결정을 이미 commit 한
    경우 → 아무 outcome 도 알리지 않고 recovery hold 로 남긴다" 다. 그리고
    `INGRESS_DECISION_COMMITTED_UNRECONCILED` 가 safe outcome 이 아니라 error code 임을
    명시한다.
  user_value: >-
    지금 계약을 읽고 구현하는 사람은 관측된 소진 전부에 `unavailable` 을 붙인다. 그러면
    `D-039` 가 없앤 모순 — 승인 Result Card 가 나간 뒤 `unavailable` 통지가 도착하는 것 — 이
    그대로 되살아난다. 문서가 코드보다 오래 남고 더 많이 읽힌다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: CT-1
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: CT-2
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-041
  requirements:
    - FR-024
    - FR-026
  decisions:
    - D-039
    - D-041
    - D-042

scope:
  include:
    - "`spec.md` FR-026 에 세 번째 종점을 넣는다."
    - >-
      `spec.md:23` 의 Clarifications Session 2026-08-14 두 번째 항목 정정. 그 답변이
      "The worker's final attempt ends as a recovery hold, so the existing safe-feedback path
      announces `unavailable`" 이라고 **무조건** 적는다. 결정이 이미 commit 된 부분집합에서
      거짓이다. **사용자 답변 원문을 지우지 않는다** — 원문을 남기고 그 뒤 `D-039`·`D-041` 이
      부분집합 예외를 추가했음을 덧붙인다.
    - >-
      `contracts/interaction-feedback.md` 의 `Two endings are possible` 절을 종점 셋으로
      고치고, 관측된 소진에 언제나 `unavailable` 이 붙는다는 단정을 정정한다.
    - >-
      `INGRESS_DECISION_COMMITTED_UNRECONCILED` 가 safe outcome enum 밖의 **error code** 이고
      `_safe_outcome` 에서 침묵으로 mapping 됨을 계약에 적는다.
    - "`D-042` 가 만든 네 번째 진입 조건 — 결정 기록 여부를 읽지 못한 경우 — 도 같은 종점에 넣는다."
    - "`stranded()` 가 종점 셋을 전부 보여준다는 서술 갱신."
  exclude:
    - "코드 변경. `D-041` 이 코드는 옳고 문서가 틀렸다고 확정했다."
    - "`FR-021` 과 `FR-027` 의 문구. `D-040` 이 이미 확정했다."
    - "safe outcome enum 에 값 추가."
    - "`plan.md`, `research.md`, `data-model.md`. 이 셋에 소진 종점 서술이 있으면 열거만 하고 고치지 않는다."
    - "lease 만료 소진 종점의 침묵 (`D-038` 항목 6). 이미 계약에 있다."
  allowed_paths:
    - specs/003-slack-proposal-card/spec.md
    - specs/003-slack-proposal-card/contracts/interaction-feedback.md
  forbidden_paths:
    - vault/
    - src/
    - tests/
    - .github/

dependencies:
  tasks:
    - MGC-012-P5-T016
  external: []

implementation:
  guidance:
    - >-
      **왜 문서가 틀렸는지부터 적는다.** round 12 `F-1` 이 실측한 것은 결정이 commit 된 뒤
      `unavailable` 통지가 배달된 Result Card 와 모순된다는 것이다. 모순된 통지는 되돌릴 수
      없다. 그래서 `D-041` 은 코드가 아니라 계약을 고치기로 했다.
    - >-
      **FR-026 현재 문장**(`spec.md:133`)은 종점 둘이다 — 관측된 실패 → `unavailable`,
      완료된 attempt 없음 → 침묵 + operator recovery. 셋째를 넣되 **기존 두 문장을 약화하지
      않는다.** round 13 `CT-1` 이 지적한 것이 "Decision 없이 요구사항에서 벗어남" 이고,
      round 12 `C-2` 가 지적한 것이 "Decision 없이 요구사항을 약화" 다. 둘 다 피한다.
    - >-
      셋째 종점의 조건을 정확히 쓴다. 마지막 attempt 가 **관측됐고 실패했다.** 그리고 앞선
      attempt 가 **결정을 이미 commit 했다.** 이 둘이 같이 성립할 때만이다. 결정이 commit 되지
      않았으면 첫째 종점(`unavailable`)이 그대로 맞다.
    - >-
      **`D-042` 의 네 번째 진입을 같은 종점에 넣는다.** 결정 기록 여부를 **읽지 못한** 경우도
      같은 결과(침묵 + recovery hold)로 간다. 이유는 다르다 — 모르기 때문이다. 계약은 결과가
      같아도 진입 조건 둘을 구분해 적는다. 그래야 읽는 사람이 왜 침묵인지 안다.
    - >-
      **`contracts/interaction-feedback.md:33`** 의 `Two endings are possible and they are not
      the same.` 과 그 아래 bullet 둘을 고친다. 특히 "the mapping above reports
      `unavailable`" 이 부분집합에서 거짓이므로 조건을 붙인다.
    - >-
      계약의 `Every listed outcome has a producer.` 절과 어긋나지 않게 한다.
      `INGRESS_DECISION_COMMITTED_UNRECONCILED` 는 outcome 이 아니라 error code 이므로 enum
      밖이 맞다 — round 13 이 그것을 Verified Clean 으로 확인했다. 그 사실을 명시적으로 적어
      다음 읽는 사람이 enum 에 넣으려 하지 않게 한다.
    - >-
      **형제 위치를 센다.** 소진 종점 서술이 몇 곳에 있는지 전수 열거한다. wave 5 에서
      `plan.md` 와 `research.md` 가 각각 safe outcome 열거의 네 번째 사본을 들고 있어
      `/speckit-analyze` 가 HIGH 를 냈다 (index.yaml update_history 2026-08-14 기록).
      같은 일이 소진 종점에도 있는지 본다. **이 task 의 `allowed_paths` 밖이면 고치지 말고
      evidence 에 목록으로 적는다.**
    - >-
      코드에서 실제 종점을 세어 계약과 대조한다. `_settle_exhausted_retry`(`:405-446`)와
      `_safe_outcome`, `_with_feedback`, `stranded()` 가 근거다. **문서가 코드를 따라가는
      방향이지 그 반대가 아니다** (`D-041`).
  invariants:
    - "코드를 수정하지 않는다."
    - "FR-021, FR-024, FR-025, FR-027 의 문구가 바뀌지 않는다."
    - "FR-026 의 기존 두 종점 서술이 약화되지 않는다."
    - "safe outcome enum 의 값 다섯이 그대로다."
    - "`grep` 으로 셀 수 있는 안전 결과 목록이 문서 사이에서 어긋나지 않는다."
  non_goals:
    - 새 요구사항 번호 도입.
    - Decision 신설.
    - operator recovery 절차 설계.

acceptance:
  behaviors:
    - id: AC-01
      given: 갱신된 FR-026.
      when: 소진 종점을 센다.
      then: 셋이고, 각각의 진입 조건과 결과가 서로 겹치지 않는다.
    - id: AC-02
      given: 갱신된 FR-026.
      when: 기존 두 종점 문장을 round 13 target 의 원문과 대조한다.
      then: 두 문장의 요구 강도가 약해지지 않았음을 diff 로 보인다.
    - id: AC-03
      given: 갱신된 `contracts/interaction-feedback.md`.
      when: "`Two endings` 문구를 찾는다."
      then: 남아 있지 않고 종점 셋 서술로 대체됐다.
    - id: AC-04
      given: 갱신된 계약.
      when: "`INGRESS_DECISION_COMMITTED_UNRECONCILED` 를 찾는다."
      then: >-
        error code 로 명시돼 있고 safe outcome enum 밖임이 이유와 함께 적혀 있다. round 13
        `CT-2` 가 실행한 `grep` 이 이제 hit 을 낸다.
    - id: AC-05
      given: 갱신된 계약.
      when: "`D-042` 의 읽기 실패 진입을 찾는다."
      then: 결과가 같고 이유가 다른 별도 진입 조건으로 적혀 있다.
    - id: AC-06
      given: 코드의 실제 종점.
      when: "`_settle_exhausted_retry`, `_safe_outcome`, `_with_feedback` 을 읽어 종점을 센다."
      then: 계약이 적은 종점 집합과 정확히 같다. 대조표를 evidence 에 적는다.
    - id: AC-07
      given: "`specs/003-slack-proposal-card/` 전체."
      when: 소진 종점 서술의 사본을 전수 열거한다.
      then: >-
        목록을 evidence 에 적는다. 사본은 최소 셋이다 — FR-026, `contracts/
        interaction-feedback.md`, 그리고 `spec.md:23` 의 Clarifications 항목.
        `allowed_paths` 안의 사본은 전부 고친다. 밖의 사본이 있으면 위치와 어긋나는 내용을
        적고 후속 task 가 필요한지 판단해 open question 으로 남긴다.
    - id: AC-09
      given: 갱신된 Clarifications 항목.
      when: 2026-08-14 세션의 두 번째 Q/A 를 읽는다.
      then: >-
        사용자 답변 원문이 그대로 남아 있고, 그 뒤 `D-039`·`D-041` 이 추가한 부분집합 예외가
        덧붙어 있다. 답변을 고쳐 쓴 것이 아니다.
    - id: AC-08
      given: 갱신된 두 문서.
      when: "`/speckit-analyze` 를 돌린다."
      then: 이 변경으로 새 CRITICAL 이나 HIGH 가 생기지 않는다.
  commands:
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: MC-01
      observer: implementation agent
      action: >-
        `/speckit-analyze` 를 호출해 `spec.md`, `plan.md`, `tasks.md` 정합성을 본다 (AC-08).
      expected: >-
        이 변경으로 새 CRITICAL 이나 HIGH finding 이 생기지 않는다. 결과 요약과 finding 등급을
        evidence 에 적는다.
      reason_not_automated: >-
        `/speckit-analyze` 는 skill 로만 호출되고 저장소에 동등한 CLI command 가 없다.
  evidence:
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: verify
      required: true
    - type: command_output
      source: diff-check
      required: true
    - type: note
      source: AC-02 의 FR-026 원문 대조 diff
      required: true
    - type: note
      source: AC-06 의 코드 종점 대 계약 종점 대조표
      required: true
    - type: note
      source: AC-07 의 소진 종점 서술 사본 전수 목록
      required: true
    - type: note
      source: MC-01 의 `/speckit-analyze` 결과 요약
      required: true

risk:
  level: medium
  concerns:
    - >-
      계약 문서를 고치는 일이다. 요구사항을 약화하는 방향으로 흐르기 쉽다. round 12 `C-2` 가
      정확히 그 사고였고 되돌리는 데 한 wave 를 썼다.
    - >-
      종점 셋을 적으면서 조건을 겹치게 쓰면 읽는 사람이 어느 종점인지 못 고른다. 그러면 계약이
      없는 것과 같다.
    - >-
      `spec.md` 수정은 `index.yaml` 의 source revision 을 낡게 만든다. MGC-012-P5-T019 가
      그것을 갱신한다.
  approvals: []

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - change_would_weaken_an_existing_requirement
    - code_change_would_be_required
    - contract_endings_cannot_be_made_disjoint
    - analyze_reports_new_high_or_critical
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-17T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T017.md

handoff:
  expected_changes:
    - FR-026 이 소진 종점 셋을 적는다.
    - "`contracts/interaction-feedback.md` 가 종점 셋과 error code 구분을 적는다."
  notes:
    - >-
      코드 변경이 없다. `D-041` 이 코드가 옳고 문서가 틀렸다고 확정했다.
    - >-
      MGC-012-P5-T016 뒤에 둔 이유는 `D-042` 가 만드는 네 번째 진입 조건을 같이 서술해야
      하기 때문이다. T016 이 그 조건을 코드로 확정한다.
