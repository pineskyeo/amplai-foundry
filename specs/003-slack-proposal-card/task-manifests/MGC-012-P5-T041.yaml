schema_version: "1.0"

id: MGC-012-P5-T041
title: Make limit an output cap and pin what the table said was already pinned
type: code
status: done

goal:
  outcome: >-
    어떤 state 의 벽이 얼마나 쌓여도 손상 row 가 `unreadable()` 에 나온다. `except` 범위와
    정렬을 각각 가르는 test 가 있다.
  user_value: >-
    round 19 `F19-1`(P1)·`F19-2`·`R19-1`·`R19-2`. **`D-048` 이 `completed` 하나만 뺐는데
    "읽을 수 없다" 는 SQL 로 판정할 수 없다** — 어떤 state 집합을 골라도 그 안의 읽을 수
    있는 row 가 손상 row 를 창 밖으로 민다. `R19-1`·`R19-2` 는 더 나쁘다. `T038` AC-06 표가
    그 둘을 **"test 있음" 으로 적었는데 실제로는 비어 있었다.**

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-19.md
      section: New Blockers
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-049
  requirements:
    - FR-024
  decisions:
    - D-045
    - D-047
    - D-048
    - D-049

scope:
  include:
    - "**`F19-1`**(P1) — `D-049` 대로 `LIMIT` 을 SQL 에서 빼고 python 출력 상한으로 만든다."
    - "**`F19-2`** — 도달하지 않는 경로를 **전수로** 세고 각각의 `last_error_code` 를 적는다."
    - "**`R19-1`** — `unreadable()` 의 `except _UNREADABLE_ROW` 를 가르는 test."
    - "**`R19-2`** — `unreadable()` 의 정렬을 가르는 test."
  exclude:
    - "`unreadable()` 을 두 조회로 나누는 것. `D-048`·`D-049` 가 거절했다."
    - "`stranded()`·`get()`·`is_unreadable()` 의 signature 와 계약."
    - "CLI 출력 형식과 `--limit` 의 truncation 표시 (`A19-F2`)."
    - "문서·표 정정. `T042`·`T043` 이 소유한다."
  allowed_paths:
    - src/amplai_foundry/governance/ingress.py
    - tests/test_slack_ack_boundary.py
  forbidden_paths:
    - vault/
    - specs/003-slack-proposal-card/spec.md
    - src/amplai_foundry/cli.py
    - src/amplai_foundry/governance/events.py
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **`limit` 은 이제 출력 상한이다.** SQL 은 `completed` 만 빼고 전부 스캔한다. 읽을 수
      있는 row 는 건너뛰므로 어떤 벽도 손상 row 를 못 민다. **비용이 `limit` 이 아니라
      "종결 아닌 row 수" 에 비례한다** — `D-049` 가 그 대가를 명시적으로 받아들였다.
    - >-
      **`limit` 의 의미가 `stranded()` 와 다르다는 사실을 docstring 에 정확히 적는다.**
      `D-048` 이 그 차이를 없애려 했으나 없앨 수 없는 차이였다. 저쪽은 후보 상한, 이쪽은
      출력 상한이다.
    - >-
      **도달하지 않는 경로를 "하나" 로 가정하지 않는다.** round 19 `F19-2` 가 둘을 찾았다.
      sweep 의 두 UPDATE 가 만드는 전이를 전수로 세고 각각 `last_error_code` 를 관찰한다.
    - >-
      **`R19-1`·`R19-2` 의 test 는 `unreadable()` 을 직접 불러야 한다.** `T038` 표가 적은
      test 들은 `get()`·`stranded()` 만 부르거나 결과 순서를 안 본다. mutation 으로 KILLED
      를 확인하기 전에는 "있다" 고 적지 않는다.
    - >-
      **mutation 은 `PYTHONDONTWRITEBYTECODE=1` 과 `__pycache__` 삭제 뒤에 돌린다.**
  invariants:
    - "`stranded()` 가 내는 목록의 의미가 바뀌지 않는다."
    - "읽기 실패만 `_UNREADABLE_ROW` 로 잡는다. 구현 결함은 그대로 올린다."
    - "`unreadable()` 과 `stranded()` 가 같은 정렬 규칙을 쓴다."
    - "test 를 지우거나 약화하지 않는다."
  non_goals:
    - 조회 분할.
    - CLI 변경.

acceptance:
  behaviors:
    - id: AC-01
      given: 읽을 수 있는 row 로 만든 벽이 `limit` 보다 많고 그 뒤에 손상 row 가 있다.
      when: 벽의 state 를 바꿔 가며 `unreadable(limit=...)` 을 부른다.
      then: >-
        모든 벽 종류에서 손상 row 가 나온다. round 19 가 실측한 여섯 종을 전부 확인하고 표로
        적는다.
    - id: AC-02
      given: 치우기가 영구히 실패하고 오래된 `dead_letter` 벽이 있다.
      when: "`claim_next` 를 여러 번 부른 뒤 `unreadable()` 을 본다."
      then: 손상 row 가 나온다. round 19 `F19-1` 재현 B 가 닫힌다.
    - id: AC-03
      given: sweep 의 두 UPDATE.
      when: "`_dead_letter_unreadable` 에 도달하지 않는 경로를 전수로 센다."
      then: 경로 수와 각각의 `last_error_code` 를 표로 적는다. 코드 주석이 같은 값을 말한다.
    - id: AC-04
      given: "`unreadable()` 의 `except _UNREADABLE_ROW`."
      when: "`except Exception` 으로 넓힌다."
      then: test 가 죽는다.
    - id: AC-05
      given: "`unreadable()` 의 `ORDER BY`."
      when: 바꾼다.
      then: test 가 죽는다.
    - id: AC-06
      given: 전체 test suite.
      when: 돌린다.
      then: 통과하고 test 수가 줄지 않는다. 두 방법으로 센다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_ingress.py tests/test_slack_ack_boundary.py tests/test_cli.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: lint
      run: .venv/bin/python -m mypy
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: mutation-table
      observer: 구현자
      action: >-
        AC-01·AC-04·AC-05 의 mutation 을 하나씩 넣고 `PYTHONDONTWRITEBYTECODE=1` 로 돌린 뒤
        되돌린다. `__pycache__` 를 먼저 지운다.
      expected: 셋 다 KILLED 이고 서로 다른 test 가 죽는다.
      reason_not_automated: mutation 은 구현 파일을 바꾸는 것이라 suite 안에서 자동화할 수 없다.
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: diff-check
      required: true
    - type: note
      source: AC-01 의 벽 6종 전수 표 (고침 전/후)
      required: true
    - type: note
      source: AC-03 의 도달 안 하는 경로 전수 표
      required: true
    - type: note
      source: mutation 표 (KILLED 와 죽은 test 이름)
      required: true

risk:
  level: high
  concerns:
    - >-
      **`D-049` 가 비용을 받아들였다.** `limit` 이 아니라 종결 아닌 row 수에 비례한다.
      그 사실을 docstring 에 적고 숨기지 않는다.
    - >-
      **`T038` 표가 "막았다" 고 적은 칸이 비어 있었다.** 이번 표는 mutation 으로 각 칸을
      검증하기 전에는 채우지 않는다.
  approvals:
    - public_contract

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - a_fix_would_require_splitting_the_query
    - a_fix_would_require_a_durable_corruption_column
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-26T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T041.md

handoff:
  expected_changes:
    - "`unreadable()` 의 `LIMIT` 을 python 으로."
    - "도달 안 하는 경로 전수를 주석에."
    - "`except` 범위와 정렬을 가르는 test 둘."
  notes:
    - >-
      **mutation 으로 확인하기 전에는 표의 test 칸을 채우지 않는다.**
