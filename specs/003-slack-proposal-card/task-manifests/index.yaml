      T023 replaces the eight audit or-chains with one helper taking an expected mapping,
      which absorbs T020's 60 components and settles BP2-5.
      T024 normalizes store.connect() failures at the boundary rather than listing
      exception classes, closing P1-1 and BP2-2 without touching any of the 62 callers.
