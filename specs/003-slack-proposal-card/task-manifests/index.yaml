        showed that half of it is structure, not attention — four identical copies of one
        clearer, eight copies of one audit comparison, four copies of one documented rule.
        File ownership is disjoint and was checked path by path: T021 owns slack_http.py,
        T023 owns events.py, T024 owns store.py and ingress_worker.py, T025 owns the four spec
        and contract documents. No two name the same path. T021 carries the P0 and goes first
        in priority even though all four may run concurrently.
    - wave: 15
      tasks:
        - MGC-012-P5-T022
        - MGC-012-P5-T026
      note: >-
        T022 waits for T021 because both own slack_http.py. T026 waits for T022 because both
        own src/amplai_foundry/governance/__init__.py — T022 may move the shared
        _clear_exception_frames definition and T026 may export the two read-only accessors, and
        the earlier claim that these two shared no path was wrong (corrected 2026-08-18 by
        /speckit-analyze finding F1 before wave 8 started). Run this wave sequentially. Both are
        lower risk than wave 14.
    - wave: 16
      tasks:
        - MGC-012-P5-T027
        - MGC-012-P5-T028
        - MGC-012-P5-T029
        - MGC-012-P5-T030
      note: >-
        Convergence wave from the round 15 three-lens review. Nine blockers, two roots.
        T027 closes the P0: an unreadable ingress row rolled the claim back and stalled the
        whole queue invisibly (D-045). T028 fixes the four blockers that all came from calling
        check_startup() in a read-only CLI. T029 narrows the T024 normalization back off
        sqlite3.Error, which had silently removed nine legacy handlers' containment. T030
        corrects the statements round 15 proved false. File ownership is disjoint and was
        checked path by path: T027 owns ingress.py, T028 owns cli.py, T029 owns store.py,
        T030 owns slack_http.py docstrings. Evidence file ownership is also disjoint —
        T028 owns T026's evidence, T029 owns T024's, T030 owns T021/T022/T025's. No two name
        the same path, so all four may run concurrently. T027 carries the P0 and goes first
        in priority.
    - wave: 17
      tasks:
        - MGC-012-P5-T031
        - MGC-012-P5-T032
        - MGC-012-P5-T033
        - MGC-012-P5-T034
      note: >-
        Convergence wave from the round 16 three-lens review. Round 15's nine blockers were all
        confirmed closed; these nine are new. Two roots. Four of them (S-1, FR-1, FR-2, C16-1)
        come from the dead-letter structure T027 introduced without filling in what that
        structure requires — progress guarantee, contention guard, write-failure handling, and
        telling "unknown" from "absent". T031 closes those. Two more (FR-3, R16-1) are the same
        CLI raw traceback reopened by two different fixes, T029's narrowing and T028's removal;
        T032 closes both by normalizing at the CLI boundary, which is the position neither
        earlier attempt used. T033 pins the revert point T029 left untested. T034 corrects the
        sixth count error and the evidence declared present but absent. T032 waits for T031
        because it consumes the unknown/absent distinction T031 creates. The other three own
        disjoint paths — T031 ingress.py, T033 tests/test_governance_store.py, T034 evidence
        and DECISIONS.md only.
    - wave: 18
      tasks:
        - MGC-012-P5-T035
        - MGC-012-P5-T036
        - MGC-012-P5-T037
      note: >-
        Convergence wave from the round 17 three-lens review. Eight blockers, three roots.
        Round 16's nine were eight-closed-one-not, and the grade dropped for the first time
        (P0 0 / P1 3 / Blocking-P2 5). T035 owns the first root and closes F17-1, F17-2 and
        F17-7 together because all three came from one place - _claim_one holds the recovery
        sweeps and the speculative claim in a single transaction, so a _view failure rolls the
        sweeps back with it and leaves the corrupt row durable in a state the
        _dead_letter_unreadable guard does not match. Separating the sweeps closes the first
        two without widening the guard, which matters: widening it would revive the live-lease
        deletion round 16 FR-1 closed. F17-2 needs a separate call and the user approved D-047
        on 2026-08-26 - widen unreadable() only, leave the stranded() contract alone.
        T036 owns the second root: the fixes landed and the tests holding them are partial,
        the same shape for the third consecutive round (round 15 R-1, round 16 R16-2). Three
        of nine mutations survived. The scenarios must tell each guard apart - today's only
        race test changes generation and state together, so either one can be deleted.
        T037 owns the third root: the wave that pointed at the evidence discipline reproduced
        it. T034 raised C16-3 and A16-5 while T031 and T033 each filed one of them again.
        T037 reads its own manifests first.
        Wave 11 also measured OutboxDispatcher.claim_next and found the same shape - sweeps
        inside the claim transaction and a view built there too. It is out of scope by the
        user's decision on 2026-08-26 and recorded rather than fixed; the outbox has no
        D-045 clearing path and its payload columns are trigger-protected, so the reach is
        narrower than ingress.
      note_counts_verified_twice: true
    - wave: 19
      tasks:
        - MGC-012-P5-T038
        - MGC-012-P5-T039
        - MGC-012-P5-T040
      note: >-
        Convergence wave from the round 18 three-lens review. Five blockers, two roots, and
        the grade improved again - round 17's eight became five, P1 three became one.
        Seven of round 17's eight closed; only F17-2 is partial.
        T038 owns the first root and it is the same root round 16 had: a new structure went
        in and what it required was undercounted. Wave 11 added two structures - unreadable()
        as its own query and _sweep_recoverable() split out - and round 18 found three
        blockers in them. T035's evidence listed "five things the new structure requires"
        and F18-R1 is the FIRST item on that list: the handling was written, the test was
        not. N18-1 is the widened query's limit turning from a candidate cap into a table
        cap, which two lenses measured independently - 150 completed rows push the corrupt
        one out of the window and governance stranded prints NONE. D-048 bounds the query
        to rows that still need recovery.
        T039 owns the second root: wave 11 wrote "counted exhaustively" and swept src/ and
        tests/ only, leaving 21 lines across 6 spec files still claiming nine - one of them
        a present-tense invariant. The correction to round 17's "four" was itself partial.
        T040 owns the freeze and mutation procedures. The round 18 manifest carried a hash
        of evidence-trace.jsonl from when it had four lines; wave 11 wrote three more after
        freezing. And A18-R1 measured something heavier - .pyc caching can forge a mutation
        result, which rounds 17 and 18 both leaned on for blocker verdicts.
      note_counts_verified_twice: true
    - wave: 20
      tasks:
        - MGC-012-P5-T041
        - MGC-012-P5-T042
        - MGC-012-P5-T043
      note: >-
        Convergence wave from the round 19 three-lens review. Nine blockers, and the count
        went up for the first time since round 17 - eight, five, nine. The grade held
        (P0 zero, P1 one) but the shape changed: eight of the nine are documents and tables,
        only F19-1 is a code defect.
        T041 owns it. D-048 removed completed alone, but "unreadable" is not a SQL predicate
        - _view has to run - so a SQL LIMIT lets whatever readable rows sit in the chosen
        state set push the corrupt one out of the window. Every wall reproduced it:
        pending, retry_wait, dead_letter, recovery_hold, and leased. The heaviest reproduction
        has the queue actually blocked while governance stranded prints only old dead_letter
        rows. D-049 moves LIMIT to a python output cap and accepts the cost D-048 had
        rejected. T041 also closes R19-1 and R19-2, which are worse than open gaps: the AC-06
        table wave 12 built to stop undercounting listed both as "test present" when neither
        had one. A filled-in cell that is wrong gets filed as "already covered" and nobody
        looks again.
        T042 makes the approved wording match the code - D-045's INGRESS_COMMAND_UNREADABLE
        marks the _dead_letter_unreadable path, not every unreadable row, and the sweep
        reaches dead_letter first by two separate routes.
        T043 fixes the three tables wave 12 got wrong: an empty freeze section, a census
        classification that named 24 of 26 files, and the AC-06 count of 12 that measured 10.
      note_counts_verified_twice: true
    - wave: 21
      tasks:
        - MGC-012-P5-T044
        - MGC-012-P5-T045
      note: >-
        Convergence wave from the round 20 three-lens review. Six blockers, and round 19's
        nine all closed - the first round since 17 with no partial closures.
        F20-1 is not the kind of defect that gets fixed. Rounds 19 and 20 measured the same
        spot twice: a SQL LIMIT lets readable rows push the corrupt one past the window, and
        a python output cap lets unreadable terminal rows do the same. Both are what a limit
        is. D-049 counted the wall's state across six values but never counted its
        readability, and _dead_letter_unreadable builds that second axis itself - every row
        it clears is dead_letter and unreadable, and nothing takes a row out of dead_letter.
        D-050 stops trying to remove it and makes it visible instead: the CLI asks for
        limit+1 and says so when the list was cut. Two lenses had asked for that line in two
        consecutive rounds.
        T044 also counted what the new structure requires before building it - the first item
        was visible before the work started, because limit+1 turns --limit 0 into 1 and slips
        past the service guard that had been catching it. And its own rule ("do not fill a
        cell until a mutation confirms it") caught a weak test before submission: the R20-1
        test only covered the case where last_error_code was set, so a COALESCE mutation
        survived until the test was widened to the NULL case.
        T045 annotates the sentence D-049 called wrong - wave 13 had annotated five other
        places and skipped that one - and corrects a Source line that credited round 19 with
        six walls when it measured five.
      note_counts_verified_twice: true
    - wave: 22
      tasks:
        - MGC-012-P5-T047
        - MGC-012-P5-T048
        - MGC-012-P5-T046
      note: >-
        Convergence wave from the round 21 three-lens review. Six blockers, three of round
        20's six only partially closed.
        F21-1 (P1) is the third axis of the same limit problem. Rounds 19 and 20 measured
        the wall by state and by readability; this one is about the return path itself.
        stranded() read limit+1 rows with a SQL LIMIT and then silently dropped the ones
        _view could not build - a skip D-047 added because round 15 F-2 had one corrupt row
        erase the whole list. So the number returned was not the number fetched, and D-050's
        truncation test ("limit+1 came back, so there is more") read false whenever a corrupt
        row sat inside the window. Measured: 200 candidates, 1 corrupt, --limit 100 printed
        100 rows and no cut marker, hiding 99. D-057 moves stranded()'s limit to a python
        output cap - the same move D-049 made for unreadable() - so the two reads finally
        mean the same thing and the count is the count. The signature does not change, which
        is why option A was chosen over carrying a fetch count in the return value.
        Removing the SQL LIMIT costs no extra scan: the table carries no index at all, so
        ORDER BY already forces a full sort. EXPLAIN QUERY PLAN is identical with and without
        the LIMIT.
        F21-2 closed structurally as a side effect - limit+1 no longer reaches a sqlite3
        binding, so --limit at int64 max stopped raising OverflowError past the CLI's except
        chain. Measured before and after.
        T048 fills the two AC-07 cells wave 14 wrote without running a mutation. Both were
        false. The signal was there and nobody looked: eight cells, four mutations.
        T046 annotates the sibling sites - C21-4 is C20-1 reproduced, wave 14 having fixed
        one of the three places that assert what D-049 called wrong - plus the places D-057
        itself just made false.
      note_counts_verified_twice: true
