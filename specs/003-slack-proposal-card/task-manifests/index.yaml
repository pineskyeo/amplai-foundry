        Convergence wave from the round 10 three-lens review. T004 is the only behavioral fix;
        T005 and T006 add regression protection without touching src; T007 aligns the contract
        to the implemented behavior under D-034. File ownership does not overlap between T004
        and T005/T006 except tests/test_review_cards.py and tests/test_slack_projection.py, so
        run T004 before or after those two rather than concurrently with them.
    - wave: 5
      tasks:
        - MGC-012-P5-T008
      note: Re-measures regression protection after the new tests land. Meaningless before wave 4.
    - wave: 6
      tasks:
        - MGC-012-P5-T009
        - MGC-012-P5-T014
      note: >-
        Convergence wave from the round 11 three-lens review, resolved by D-038. T009 removes the
        duplicated interruption classifier that let a plain exception escape the dispatcher; T014
        pins the migration guards. The two own disjoint files (Slack transport and projection
        versus the migration test module), so they may run concurrently.
    - wave: 7
      tasks:
        - MGC-012-P5-T010
      note: >-
        Reclassifies transient store failure. Runs alone because it owns events.py, store.py,
        ingress_worker.py and slack_projection.py at once and every later wave 5 task touches one
        of those or their test modules.
    - wave: 8
      tasks:
        - MGC-012-P5-T011
        - MGC-012-P5-T013
      note: >-
        T011 ends an exhausted ingress command; T013 pins the integrity and cardinality guards.
        File ownership is disjoint — ingress_worker.py plus tests/test_ingress.py and
        tests/test_slack_ack_boundary.py versus tests/test_review_cards.py and
        tests/test_governance_events.py — so they may run concurrently. Both wait for T010 because
        it edits ingress_worker.py and tests/test_governance_events.py.
    - wave: 9
      tasks:
        - MGC-012-P5-T012
      note: >-
        Aligns the safe outcome set last, because T011 adds one producer for unavailable and both
        tasks own tests/test_slack_ack_boundary.py and the interaction feedback contract.
    - wave: 10
      tasks:
        - MGC-012-P5-T015
        - MGC-012-P5-T016
        - MGC-012-P5-T018
      note: >-
        Convergence wave from the round 13 three-lens review, resolved by D-041 and D-042.
        T015 and T016 are the two P1 behavioral fixes; T018 adds regression protection without
        touching src. File ownership is disjoint and was checked path by path — T015 owns
        slack_http.py and tests/test_slack_http.py, T016 owns ingress_worker.py,
        tests/test_ingress.py and tests/test_slack_ack_boundary.py, T018 owns
        tests/test_governance_events.py only. No two of them name the same path, so they may
        run concurrently.
    - wave: 11
      tasks:
        - MGC-012-P5-T017
      note: >-
        Aligns FR-026 and the interaction feedback contract to the three endings the code
        already has (D-041). Runs after T016 because D-042 adds a fourth entry condition into
        the same ending and the contract must describe it. Documents only; no src or tests.
    - wave: 12
      tasks:
        - MGC-012-P5-T019
      note: >-
        Records what the four preceding tasks did, including any scope expansion they took.
        Must run last for that reason. Also refreshes source revisions, which T017 invalidates
        by editing spec.md.
    - wave: 13
      tasks: []
      note: >-
        MGC-012-P5-T020 was scheduled here. It is superseded by MGC-012-P5-T023, which removes
        the 60 components structurally instead of pinning them one by one. The wave is kept as
        an empty entry so the record of what was planned and why it went away survives.
    - wave: 14
      tasks:
        - MGC-012-P5-T021
        - MGC-012-P5-T023
        - MGC-012-P5-T024
        - MGC-012-P5-T025
      note: >-
        Structural wave from the round 14 three-lens review, chosen by the user on 2026-08-18
        over continuing to count siblings. Five rounds running, the same pattern held; measuring
        showed that half of it is structure, not attention — four identical copies of one
        clearer, eight copies of one audit comparison, four copies of one documented rule.
        File ownership is disjoint and was checked path by path: T021 owns slack_http.py,
        T023 owns events.py, T024 owns store.py and ingress_worker.py, T025 owns the four spec
        and contract documents. No two name the same path. T021 carries the P0 and goes first
        in priority even though all four may run concurrently.
    - wave: 15
      tasks:
        - MGC-012-P5-T022
        - MGC-012-P5-T026
      note: >-
        T022 waits for T021 because both own slack_http.py. T026 adds a governance sub-app to
        cli.py and shares no path with T022. Both are lower risk than wave 14 and neither is a
        prerequisite for the others.
