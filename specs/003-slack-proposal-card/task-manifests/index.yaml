open_questions:
  - id: OQ-001
    question: >-
      bot token 이 exception traceback 과 `--showlocals` 출력에 남는 것을 금지하는 요구사항이
      `spec.md` 에 없다. FR-018 과 SC-005 는 one-time decision credential 로, FR-019 는 Card
      content 로 한정된다. round 12 `F-2` 와 round 13 `F-1` 은 이 결함을 blocker 로 잡았고
      근거는 `contracts/review-card-lifecycle.md:111-119` 의 Forbidden diagnostic fields 다.
      즉 계약에는 있고 요구사항에는 없다. FR 을 신설하거나 FR-018 의 대상을 넓혀야 하는가?
    blocking: false
    note: >-
      MGC-012-P5-T015 는 계약을 근거로 진행한다. FR 변경은 계약 변경이므로 Decision 이
      필요하고 이번 wave 밖이다. `/speckit-analyze` round 13-post 가 C1 으로 제기했다.

