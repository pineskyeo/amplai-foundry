  - date: 2026-08-14
    summary: >-
      Convergence wave added as T009-T014 from the round 11 three-lens review
      (evidence/3lens-review-round-11.md) and D-038. T001-T008 keep their done
      status, IDs, and evidence. No surviving task was renumbered or rewritten.
      T009, T010 and T011 are the three behavioral fixes for the round 11 P1
      findings R-1, R-2 and R-3; T012 makes the safe outcome contract true and
      replaces the tautological producer test (R-4, R-5); T013 and T014 add
      regression protection without touching src (R-7, R-8, R-9). R-6 is covered
      by T009 because the untested generator_exit branches are the duplicated
      classifier itself. spec.md and data-model.md revisions were refreshed:
      /speckit-clarify recorded three grilling answers in spec.md and added
      FR-026 and FR-027, and the recorded data-model.md revision had been stale
      since wave 4.
    source_revision: >-
      review target aggregate 36e3923f66599997f2e4eb56d535a63276b7d6b8f8ee93a1bf3d555cdb7ec247
  - date: 2026-08-14
    summary: >-
      Wave 5 (T009-T014) implemented and closed. All fourteen tasks are done.
      T010 expanded its allowed_paths during implementation to include
      tests/test_review_cards.py: two tests there pinned wave 4's over-correction
      (a transient store failure dead-lettering immediately), so R-2 could not be
      fixed without moving them. The expansion and its reason are recorded in that
      manifest's scope.include and allowed_paths rather than taken silently. The
      moved tests kept their guarantee - a new test requires that an exhausted
      retry budget still reaches a dead letter and an operator hold. T012 also
      expanded earlier, before implementation, after /speckit-analyze reported a
