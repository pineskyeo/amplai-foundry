schema_version: "1.0"

id: MGC-012-P5-T023
title: Replace eight audit comparison chains with one helper that takes the expected mapping
type: refactor
status: done

goal:
  outcome: >-
    `reconcile_connection()` 의 여덟 감사 대조 or-chain 이 `expected` mapping 을 받는 helper
    하나로 대체된다. **성분을 세는 일이 사라진다** — 빠진 필드는 mapping 에서 눈에 보이고,
    helper 하나를 test 로 고정하면 여덟 호출 지점이 함께 보호된다.
  user_value: >-
    이 대조는 governed mutation 이 자기가 기록한 감사와 맞는지 보는 무결성 관문이다. 지금
    **69 성분 중 66 개가 무방비**다. 성분을 하나씩 test 로 덮는 것은 60건의 작업이고, 그
    작업이 끝나도 다음 블록이 추가되면 다시 무방비가 된다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-14.md
      section: BP2-5
    - path: specs/003-slack-proposal-card/evidence/MGC-012-P5-T018.md
      section: AC-01
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: F-4
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-12.md
      section: RL-3
  requirements:
    - FR-013
    - FR-015
    - FR-021
    - SC-003
  decisions:
    - D-038

scope:
  include:
    - >-
      여덟 블록을 helper 하나로 대체한다. 2026-08-18 측정 기준 위치와 성분 수는
      L1254(9), L1480(9), L1557(9), L1711(10), L1795(8), L1875(8), L1959(8), L2113(8) 이고
      합 69 다. **착수 시 다시 센다.**
    - helper 자체의 회귀 test — 성분 하나가 어긋나면 지정된 error code 로 거부한다.
    - >-
      각 호출 지점의 `expected` mapping 이 올바른 필드 집합을 담았는지 고정하는 test.
    - >-
      **필드 비대칭의 답.** `policy_snapshot_id` 는 3/8 블록에만, `proposal_ref` 는 2/8 에만
      있다. 나머지가 그 필드를 **왜 안 보는지** 밝혀 evidence 에 적는다.
    - "`MGC-012-P5-T020` 을 `superseded` 로 표시한다. 이 task 가 그 범위를 흡수한다."
  exclude:
    - "감사 event schema 나 저장 형식 변경."
    - "새 감사 성분 추가. 비대칭의 답이 '누락' 이면 **finding 으로 기록하고 별도 task 로 낸다.**"
    - "`reconcile_connection()` 의 다른 부분 리팩터링. 감사 대조 블록만 손댄다."
    - "두 cardinality guard 의 0 방향 (round 13 `N16`/`N17`). Advisory 다."
    - "`slack_http.py`, `ingress_worker.py`. 각각 T021/T022, T024 가 맡는다."
  allowed_paths:
    - src/amplai_foundry/governance/events.py
    - tests/test_governance_events.py
    - tests/test_review_cards.py
  forbidden_paths:
    - vault/
    - .github/
    - src/amplai_foundry/governance/slack_http.py
    - src/amplai_foundry/governance/ingress_worker.py
    - src/amplai_foundry/governance/migrations.py

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **먼저 전수 mutation sweep 을 돌린다.** 성분을 하나씩 지우고 test 를 돌려 무방비 목록을
      만든다. 2026-08-18 측정은 66/69 무방비였다. **그 목록이 합친 뒤 대조할 기준선이다** —
      이번 wave 의 규칙 2.
    - >-
      **수를 두 번 센다.** wave 7 이 8블록을 9로, `L1712` 블록을 9성분으로 적었고 round 14 가
      정정했다. 세 라운드 연속 수치 오류다. 센 값을 다른 방법으로 한 번 더 확인한다 — 예를
      들어 AST 로 세고 grep 으로도 센다.
    - >-
      **구조는 이렇다.** 여덟 필드가 8/8 블록에 있다 — `event_type`, `actor_id`,
      `actor_type`, `before_state`, `after_state`, `definition_digest`,
      `destination_manifest_digest`, `destination_count`. 블록마다 다른 것은 기대값과
      error code 뿐이다.

      ```python
      @staticmethod
      def _assert_audit_matches(
          audit: AuditEventView, expected: Mapping[str, object], code: str
      ) -> None:
          for field, want in expected.items():
              if getattr(audit, field) != want:
                  raise GovernanceEventError(code)
      ```

      **이 형태를 강제하지 않는다** — 더 나은 설계가 있으면 쓰되, "필드를 빠뜨리면 눈에
      보인다" 는 성질은 유지한다.
    - >-
      **비대칭을 덮지 말고 드러낸다.** helper 로 합치면 각 호출 지점의 mapping 이 나란히
      보이고, 어떤 블록이 `policy_snapshot_id` 나 `proposal_ref` 를 안 보는지 한눈에 드러난다.
      **그것이 의도인지 누락인지 답해야 한다.** 의도면 근거를 적고, 누락이면 **이 task 에서
      고치지 말고 finding 으로 기록한다** — 감사 대조를 강화하는 것은 governed 동작 변경이라
      Decision 이 필요하다.
    - >-
      **합친 뒤 mutation sweep 을 다시 돌린다.** helper 의 각 필드 비교를 무력화하면 죽어야
      하고, 각 호출 지점의 mapping 에서 필드를 빼도 죽어야 한다. 기준선보다 나빠지면 안 된다.
    - >-
      **다른 검사가 먼저 걸리면 고정이 아니다.** audit row 를 고치면 hash chain 도 깨져
      `AUDIT_HASH_CHAIN_INVALID` 가 대신 잡을 수 있다. 실패 코드가 겨냥한 것인지 확인한다.
      T018 이 그 방식을 썼고 round 14 가 유효함을 확인했다.
    - >-
      **`proposal_ref` 는 저장 형태가 다르다.** 한 column 이 아니라 `project_namespace`,
      `project_id`, `proposal_id` 셋이고 외래키가 걸려 있다. T018 이 별도 test 로 다뤘다.
    - >-
      **T020 을 `superseded` 로 표시한다.** 지우지 않고 이유를 적는다 — 이 task 가 그
      60성분을 구조로 없앤다. `index.yaml` 의 wave 13 항목도 함께 정리한다.
  invariants:
    - "여덟 대조의 거부 조건이 바뀌지 않는다. 같은 입력에 같은 error code 를 낸다."
    - "감사 event schema 와 저장 형식이 바뀌지 않는다."
    - "기존 test 를 지우지 않는다."
    - "합치기 전 죽던 mutation 이 합친 뒤에도 전부 죽는다."
    - "감사 대조에 새 필드를 추가하지 않는다."
    - "신규 test 가 실제 vault 나 사용자 데이터를 건드리지 않는다."
  non_goals:
    - 감사 대조 강화.
    - "`reconcile_connection()` 전체 분해."
    - migration 변경.

acceptance:
  behaviors:
    - id: AC-01
      given: 착수 전 코드.
      when: 감사 대조 블록과 성분을 전수 열거한다.
      then: >-
        블록별 줄 번호와 성분 수를 표로 적고 합계를 명시한다. **두 가지 방법으로 세어 값이
        일치함을 보인다.**
    - id: AC-02
      given: AC-01 의 목록.
      when: 각 성분을 하나씩 지우고 test 를 돌린다.
      then: 무방비 목록을 evidence 에 적는다. 이것이 기준선이다.
    - id: AC-03
      given: 합친 코드.
      when: 감사 대조 or-chain 을 센다.
      then: 남아 있지 않다. 여덟 호출 지점이 전부 helper 를 쓴다.
    - id: AC-04
      given: 합친 코드.
      when: helper 의 필드 비교를 무력화한다.
      then: test 가 실패한다.
    - id: AC-05
      given: 합친 코드.
      when: 각 호출 지점의 `expected` mapping 에서 필드를 하나씩 뺀다.
      then: >-
        여덟 지점 전부에서 적어도 하나의 test 가 실패하고, 실패 코드가 그 지점의 것이다.
    - id: AC-06
      given: AC-02 의 기준선과 합친 뒤 재측정.
      when: 둘을 대조한다.
      then: >-
        기준선에서 죽던 것이 전부 죽는다. 새로 고정된 것을 열거한다. **나빠진 것이 하나도
        없음을 보인다.**
    - id: AC-07
      given: 여덟 호출 지점의 `expected` mapping.
      when: 필드 집합을 나란히 놓는다.
      then: >-
        `policy_snapshot_id` 를 5블록이, `proposal_ref` 를 6블록이 안 보는 이유를 evidence 에
        적는다. 의도면 근거를, 누락이면 finding 으로.
    - id: AC-08
      given: 전체 test suite.
      when: 아무것도 바꾸지 않고 돌린다.
      then: round 14 기준(1301 passed, 4 deselected) 이상으로 통과하고 실패가 없다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_governance_events.py tests/test_review_cards.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01 의 블록·성분 표 (두 방법으로 센 값 포함)
      required: true
    - type: note
      source: AC-02 의 착수 전 무방비 기준선
      required: true
    - type: note
      source: AC-06 의 before/after 대조
      required: true
    - type: note
      source: AC-07 의 필드 비대칭 조사 결과
      required: true

risk:
  level: high
  concerns:
    - >-
      governed mutation 의 무결성 관문을 통째로 다시 짜는 것이다. 합치면서 한 블록의 조건이
      바뀌면 감사가 틀린 채 통과하고, 그 뒤 모든 판단의 근거가 무너진다.
    - >-
      기대값 계산식이 블록마다 다르다(`str(review[9])`, `decision_commands[command_id][2]`
      등). mapping 으로 옮기면서 잘못된 row index 를 쓰면 조용히 다른 값을 비교한다.
      AC-05 가 그것을 막는다.
    - >-
      비대칭을 "정리" 하고 싶은 유혹이 있다. 감사 대조를 강화하는 것은 governed 동작 변경이라
      Decision 이 필요하고 이 task 의 범위가 아니다.
  approvals:
    - >-
      사용자가 2026-08-18 에 "구조를 먼저 고친다" 를 선택했다. 이 task 가 그 결정의 가장 큰
      항목이고, `MGC-012-P5-T020` 의 60성분을 대체한다.

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - a_block_condition_would_change
    - a_previously_killed_mutation_survives_after_merge
    - expected_mapping_cannot_express_a_block
    - asymmetry_turns_out_to_be_a_missing_check
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-18T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T023.md

handoff:
  expected_changes:
    - "감사 대조 helper 하나와 여덟 호출 지점."
    - "helper 와 각 mapping 의 회귀 test."
    - "`MGC-012-P5-T020` 을 `superseded` 로."
  notes:
    - >-
      **이 task 가 성공하면 T020 의 60성분 작업이 사라진다.** 성분을 세는 규칙 자체가
      필요 없어지는 것이 목적이다.
