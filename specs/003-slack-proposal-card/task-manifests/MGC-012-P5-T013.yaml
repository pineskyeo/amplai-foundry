schema_version: "1.0"

id: MGC-012-P5-T013
title: Pin the integrity comparison components and the outbox cardinality guard
type: test
status: done

goal:
  outcome: >-
    Review Card 무결성 대조의 개별 성분과 요청당 outbox event 개수 검사가 test 로 고정된다.
    성분을 하나 빼거나 개수 검사를 약화하면 test 가 실패한다.
  user_value: >-
    지금은 그 guard 들이 맞게 동작하지만 붙잡는 test 가 없다. 다음 사람이 성분 하나를 지워도
    아무도 모른다. 코드가 오늘 옳은 것과 내일도 옳은 것은 다르다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-11.md
      section: R-7
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-11.md
      section: R-8
    - path: specs/003-slack-proposal-card/evidence/mutation-round-11.md
      section: M39
    - path: specs/003-slack-proposal-card/evidence/mutation-round-11.md
      section: M40
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-038
  requirements:
    - FR-013
    - FR-015
    - FR-021
    - SC-003
  decisions:
    - D-038

scope:
  include:
    - 무결성 대조의 canonical payload 성분이 빠지면 실패하는 test.
    - 감사 대조의 actor 성분이 빠지면 실패하는 test.
    - 요청당 outbox event 개수 검사가 약화되면 실패하는 test.
  exclude:
    - "`src/` 수정. 이 task 는 회귀 방어만 추가한다."
    - 무결성 대조 성분의 추가·삭제.
    - migration guard. MGC-012-P5-T014 가 맡는다.
  allowed_paths:
    - tests/test_review_cards.py
    - tests/test_governance_events.py
  forbidden_paths:
    - vault/
    - src/
    - .github/

dependencies:
  tasks:
    - MGC-012-P5-T010
  external: []

implementation:
  guidance:
    - >-
      round 11 mutation 이 세 자리에서 살아남았다. `review_cards.py:634` 는 root 대조에서
      canonical payload 성분만 빼도 통과했고, `events.py:1247` 은 감사 대조에서 actor 성분을
      빼도 통과했고, `review_cards.py:226` 은 outbox 개수 검사를 약화해도 통과했다.
    - >-
      test 를 쓸 때 그 성분 하나만 어긋난 상태를 만들어야 한다. 여러 성분이 동시에 어긋나면
      다른 성분이 먼저 걸려 무엇이 잡았는지 알 수 없고, 그러면 겨냥한 guard 를 고정한 것이 아니다.
      round 11 이 `T006` evidence 의 "무결성 대조는 전부 도달 불가" 를 부분 오류로 정정했다.
    - >-
      각 test 는 겨냥한 guard 를 실제로 깨뜨려 실패를 확인한 뒤에야 고정한다고 적을 수 있다.
  invariants:
    - "`src/` 는 수정하지 않는다."
    - 기존 test 의 의미를 바꾸지 않는다.
    - 신규 test 는 raw ActionToken credential 을 evidence 에 남기지 않는다.
  non_goals:
    - 무결성 대조 로직 변경.
    - 새 guard 도입.

acceptance:
  behaviors:
    - id: AC-01
      given: 신규 test.
      when: 무결성 대조에서 canonical payload 성분만 제거한다.
      then: test 가 실패한다.
    - id: AC-02
      given: 신규 test.
      when: 감사 대조에서 actor 성분만 제거한다.
      then: test 가 실패한다.
    - id: AC-03
      given: 신규 test.
      when: 요청당 outbox event 개수 검사를 약화한다.
      then: test 가 실패한다.
    - id: AC-04
      given: 세 신규 test.
      when: 아무것도 바꾸지 않고 돌린다.
      then: 모두 통과한다.
    - id: AC-05
      given: AC-01 부터 AC-03 의 각 실험.
      when: 실패한 test 이름과 실패 사유를 기록한다.
      then: 각 실험이 겨냥한 guard 하나만 깨뜨렸음을 보인다. 다른 guard 가 먼저 잡은 경우는 고정으로 세지 않는다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_review_cards.py tests/test_governance_events.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-05 의 실험별 실패 확인 기록
      required: true

risk:
  level: low
  concerns:
    - 여러 성분이 동시에 어긋나는 상태를 만들면 다른 guard 가 먼저 잡아 고정을 잘못 주장하게 된다.
  approvals: []

loop:
  max_attempts: 4
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - guard_appears_unreachable_without_src_change
    - src_change_would_be_required
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-14T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T013.md

handoff:
  expected_changes:
    - 세 guard 의 회귀 test.
  notes:
    - >-
      실제 동작 결함이 아니다. 코드는 오늘 맞게 동작하고 그 정확성을 붙잡는 test 가 없을 뿐이다.
      이 구분을 evidence 에도 유지한다.
