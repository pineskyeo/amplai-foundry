schema_version: "1.0"

id: MGC-012-P5-T048
title: Fill the two AC-07 cells that were written without ever running a mutation
type: test
status: done

goal:
  outcome: >-
    round 21 의 R21-1 과 R21-2 를 닫는다. 두 칸은 wave 14 가 mutation 없이 채운 것이고
    둘 다 거짓이었다.
  user_value: >-
    잘림 판정의 경계와 두 목록의 출력 상한이 test 로 고정된다. 자세한 것은
    `specs/003-slack-proposal-card/evidence/3lens-review-round-21.md` 다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-21.md
      section: New Blockers
  requirements:
    - FR-024
  decisions:
    - D-050
    - D-057

scope:
  include:
    - >-
      **`R21-1`** — `len(...) > limit` 을 `>=` 로 바꾸면 죽는 test. 후보가 정확히 `limit`
      개인 입력을 준다. `T044.md:34` 가 칸에 적은 test 는 후보 1개에 기본 `limit=100` 이라
      경계에 안 선다.
    - >-
      **`R21-2`** — `unreadable = unreadable[:limit]` 을 지우면 죽는 test. 손상 row 가
      `limit` 을 넘는 입력을 준다. `T044.md:37` 이 칸에 적은 test 는 손상 0개 상황이라
      `commands` 쪽만 센다.
    - >-
      **표의 칸 수와 mutation 수를 대조한다.** wave 14 는 여덟 칸에 mutation 넷을 돌렸고
      안 돌린 두 칸이 둘 다 거짓이었다. 대조표를 evidence 에 남긴다.
  exclude:
    - "코드 동작 변경. `T047` 이 소유한다."
    - "문서 정정. `T046` 이 소유한다."
    - "미해결 Advisory `A21-4`·`A21-6`."
  allowed_paths:
    - tests/test_cli.py
    - tests/test_slack_ack_boundary.py
    - specs/003-slack-proposal-card/
  forbidden_paths:
    - vault/
    - src/
    - specs/003-slack-proposal-card/spec.md
    - .github/

dependencies:
  tasks:
    - MGC-012-P5-T047
  external: []

implementation:
  guidance:
    - >-
      **칸을 mutation 으로 확인하기 전에는 채우지 않는다.** `T044` 가 자기 규칙으로 적고도
      두 칸에서 안 지켰다. 이번에는 칸 수와 mutation 수를 나란히 적는다.
    - >-
      **등가 mutant 가 아님을 입력으로 보인다.** 어떤 입력에서 mutant 가 다른 답을 내는지
      실제 값으로 적는다.
    - >-
      **mutation 판정은 전 suite 로 한다.** 대상 파일만 돌리면 SURVIVED 를 놓친다.
  invariants:
    - "`src/` 를 안 고친다."
    - "기존 test 를 지우지 않는다."
  non_goals:
    - 새 코드 동작.
    - 성능 측정.

acceptance:
  behaviors:
    - id: AC-01
      given: 후보가 정확히 `limit` 개인 store.
      when: "`governance stranded --limit N` 을 부른다."
      then: 잘림 표시가 없고 출력이 `N` 줄이다. `>` 를 `>=` 로 바꾸면 이 test 가 죽는다.
    - id: AC-02
      given: 손상 row 가 `limit` 을 넘는 store.
      when: "`governance stranded --limit N` 을 부른다."
      then: "`UNREADABLE` 이 정확히 `N` 줄이다. slicing 을 지우면 이 test 가 죽는다."
    - id: AC-03
      given: 이번 wave 가 만든 mutation 목록.
      when: 전 suite 로 각각 돌린다.
      then: 전부 KILLED 이고 죽은 test 이름과 건수를 적는다. 칸 수와 mutation 수가 같다.
  commands:
    - id: targeted-cli
      kind: test
      run: .venv/bin/python -m pytest tests/test_cli.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: cell-vs-mutation
      observer: 구현자
      action: 표의 칸 수와 실제로 돌린 mutation 수를 세어 나란히 적는다.
      expected: 두 수가 같다. 안 돌린 칸이 없다.
      reason_not_automated: 표와 mutation 목록의 대응을 기계로 판정할 규칙이 없다.
  evidence:
    - type: command_output
      source: targeted-cli
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: note
      source: mutation 표 (칸 수와 mutation 수 대조)
      required: true

risk:
  level: medium
  concerns:
    - "경계에 서는 입력을 잘못 만들면 test 가 경계를 안 친다. 후보 수를 실측으로 확인한다."
  approvals: []

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - a_cell_would_require_a_source_change
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-30T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T048.md

handoff:
  expected_changes:
    - "AC-07 표의 거짓 칸 둘이 mutation 으로 채워진다."
  notes:
    - "**칸 수와 mutation 수를 대조하기 전에는 표를 제출하지 않는다.**"
