schema_version: "1.0"

id: MGC-012-P5-T039
title: Say what range the census covered, and cover the whole of it
type: docs
status: done

goal:
  outcome: >-
    handler 개수를 주장하는 위치를 repository 전역에서 세고, **센 범위를 밝힌다.** 현재형
    규범 문장은 실측값을 쓰고 과거 기록은 정정 각주를 단다.
  user_value: >-
    round 18 `N18-3`. wave 11 이 "**전수로** 세니 여덟" 이라 쓰고 `src/`·`tests/` 만 훑었다.
    spec 쪽에 **21줄 6파일**이 아직 아홉을 현재 값으로 주장하고, `T029.yaml:93` 은
    `invariants:` 아래 **현재형 규범 문장**이다. `work-contract.json` 의 AC-010 은 "문서
    **전부**" 였다. **round 17 의 '넷' 을 '여덟' 로 정정하면서 정정 자체가 또 부분이었다.**

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-18.md
      section: New Blockers
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-18.md
      section: Advisory
  requirements:
    - FR-024
  decisions:
    - D-045

scope:
  include:
    - >-
      **`N18-3`** — repository 전역에서 센다. **센 범위를 evidence 에 명시한다** — 무엇을
      포함했고 무엇을 뺐는지.
    - >-
      **현재형 규범 문장과 과거 기록을 가른다.** `T029.yaml:93` 처럼 `invariants:` 아래
      있는 것은 지금 사실을 말해야 한다. `T024.md` 처럼 그 wave 가 무엇을 보았는지 적은
      것은 **지우지 않고 정정 각주를 단다.**
    - >-
      **`A18-2`** — `T033.md` 가 `store.py` 를 `265, 286` 으로 인용하는데 실측은
      `275, 296` 이다. wave 11 이 머리말을 늘린 뒤 인용을 갱신하지 않았다.
  exclude:
    - "코드 동작 변경."
    - "test 변경."
    - "`tests/test_review_cards.py:2182` 의 \"아홉 블록\" — audit 성분 계수이고 다른 맥락이다."
    - "`T038`·`T040` 이 소유한 것."
  allowed_paths:
    - specs/003-slack-proposal-card/task-manifests/
    - specs/003-slack-proposal-card/evidence/
    - docs/workstreams/messenger-governance-closure-v3/
  forbidden_paths:
    - vault/
    - specs/003-slack-proposal-card/spec.md
    - src/
    - tests/
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **범위를 먼저 적고 센다.** "전수" 라는 말만으로는 다음 사람이 검증할 수 없다.
      명령과 대상 디렉토리를 evidence 에 그대로 적는다.
    - >-
      **두 방법으로 센다.** 한 방법이 놓치는 것이 있다 — wave 11 이 한 줄 grep 으로 12 를
      얻었고 AST 로 13 을 얻었다.
    - >-
      **현재형 규범 문장을 먼저 찾는다.** `invariants:`, `then:`, docstring 처럼 지금
      사실을 주장하는 자리다. 과거 evidence 의 서술과 다르게 다룬다.
  invariants:
    - "기존 사실 진술을 지우지 않는다 — 정정을 덧붙인다."
    - "코드와 test 의 동작을 바꾸지 않는다."
    - "전 suite 결과가 바뀌지 않는다."
  non_goals:
    - 코드 변경.
    - 새 Decision.

acceptance:
  behaviors:
    - id: AC-01
      given: repository 전역.
      when: handler 개수를 주장하는 위치를 두 방법으로 센다.
      then: 값이 같다. **센 범위와 명령을 evidence 에 적는다.**
    - id: AC-02
      given: 찾은 위치 전부.
      when: 현재형 규범 문장과 과거 기록으로 가른다.
      then: 전자는 실측값을 쓰고 후자는 정정 각주를 갖는다. 각 분류의 개수를 적는다.
    - id: AC-03
      given: "`T029.yaml` 의 `invariants:`."
      when: 읽는다.
      then: 지금 사실을 말한다.
    - id: AC-04
      given: "`T033.md` 의 `store.py` 줄번호 인용."
      when: 실제 파일과 대조한다.
      then: 일치한다. 나머지 인용도 함께 확인한 결과를 적는다.
    - id: AC-05
      given: 전체 test suite.
      when: 돌린다.
      then: 이전과 같은 결과다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_governance_store.py tests/test_cli.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: manifest-validator
      kind: lint
      run: .venv/bin/python .claude/skills/taskify/scripts/validate_task_manifest.py specs/003-slack-proposal-card/task-manifests
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: census-range
      observer: 구현자
      action: repository 전역에서 두 방법으로 세고 각 위치를 현재형·과거형으로 분류한다.
      expected: 두 값이 같고 분류마다 개수가 적혀 있다. 센 범위가 명시돼 있다.
      reason_not_automated: >-
        "현재 사실을 주장하는 문장" 과 "그 wave 가 본 것을 적은 기록" 을 가르는 규칙을
        기계적으로 만들 수 없다.
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: manifest-validator
      required: true
    - type: command_output
      source: diff-check
      required: true
    - type: note
      source: AC-01 의 census 범위와 두 방법 계수
      required: true
    - type: note
      source: AC-02 의 현재형·과거형 분류표
      required: true

risk:
  level: low
  concerns:
    - >-
      **정정하면서 또 틀릴 수 있다.** wave 11 이 여덟 곳을 13 으로 고쳤다가 10 으로
      되잡았다 — 그 자리가 무엇을 세는지 확인하지 않았기 때문이다.
  approvals: []

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - a_correction_would_require_a_code_change
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-26T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T039.md

handoff:
  expected_changes:
    - "spec 쪽 현재형 규범 문장의 개수 정정."
    - "과거 evidence 에 정정 각주."
    - "`T033.md` 의 `store.py` 줄번호."
  notes:
    - >-
      **범위를 밝히지 않은 '전수' 는 다음 라운드가 다시 연다.**
