schema_version: "1.0"

id: MGC-012-P5-T022
title: Collapse the four identical exception-frame clearers into one
type: refactor
status: done

goal:
  outcome: >-
    `_clear_exception_frames` 가 저장소에 하나만 존재하고 네 모듈이 그것을 쓴다. 그 하나를
    고치면 모든 호출자가 따라오므로 **사본을 셀 필요가 없어진다.**
  user_value: >-
    이 함수는 예외 chain 에서 credential 을 든 frame 을 지운다. 사본이 넷이면 하나를 고칠 때
    나머지 셋이 뒤처지고, 그것이 round 11 `R-1` 이 실측한 사고였다. `D-038` 항목 4 가 알려진
    한계로 기록해 둔 것을 닫는다.

source:
  feature: MGC-012-P5
  files:
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-038
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-14.md
      section: Verified Clean
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-11.md
      section: R-1
  requirements:
    - FR-018
    - FR-019
    - FR-021
    - SC-003
    - SC-005
  decisions:
    - D-038

scope:
  include:
    - >-
      네 정의를 하나로 합친다 — `slack_http.py:655`, `decisions.py:775`(staticmethod),
      `slack_projection.py:1127`(staticmethod), `slack_cards.py:327`. 본문이 **완전히
      동일함**을 `ast.unparse` digest 로 확인했다.
    - 단일 정의를 둘 위치 결정과 네 모듈의 호출 지점 갱신.
    - 그 하나를 지웠을 때 실패하는 test 가 있는지 확인.
  exclude:
    - "`post_message`/`post_ephemeral` 의 arm 구조. MGC-012-P5-T021 이 맡는다."
    - "호출 지점의 의미 변경. 어디서 부를지는 바꾸지 않는다."
    - "`classify_interruption` 이나 `raise_sanitized_interruption` 의 사본 조사. 별개다."
    - "`events.py`, `ingress_worker.py`. 각각 T023, T024 가 맡는다."
  allowed_paths:
    - src/amplai_foundry/governance/slack_http.py
    - src/amplai_foundry/governance/decisions.py
    - src/amplai_foundry/governance/slack_projection.py
    - src/amplai_foundry/governance/slack_cards.py
    - src/amplai_foundry/governance/__init__.py
    # 구현 중 확장 (2026-08-18). `review_cards.py:548` 이
    # `DecisionService._clear_exception_frames(error)` 로 class 를 가로질러 호출한다 —
    # scope.include 가 이미 지목한 그 호출이다. 정의를 module-level 로 옮기면 이 한 줄이
    # 따라와야 한다. 남겨 두려면 `DecisionService` 에 위임 staticmethod 를 두어야 하는데
    # 그것이 바로 이 task 가 없애려는 사본이다. 한 줄 호출 갱신만 했고 다른 변경은 없다.
    - src/amplai_foundry/governance/review_cards.py
    - tests/test_slack_http.py
    - tests/test_slack_projection.py
    - tests/test_review_cards.py
  forbidden_paths:
    - vault/
    - .github/
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/ingress_worker.py

dependencies:
  tasks:
    - MGC-012-P5-T021
  external: []

implementation:
  guidance:
    - >-
      **먼저 mutation sweep 을 돌린다.** 네 정의를 각각 no-op 으로 만들고 전 suite 를 돌려
      어느 것이 test 로 고정돼 있는지 목록을 만든다. 합치기 **전** 상태를 기록해야 합친 뒤
      비교할 수 있다. 이번 wave 의 규칙 2 다 — 합치면서 guard 를 잃으면 최악이다.
    - >-
      **동일성을 다시 확인한다.** 착수 시점에 네 본문이 여전히 동일한지 `ast.unparse` 로
      직접 확인한다. 2026-08-18 측정은 그랬다. 하나라도 다르면 **왜 다른지 밝히고**, 의도된
      차이면 합치지 말고 그 이유를 evidence 에 적는다.
    - >-
      **둘 위치를 고른다.** `decisions.py` 와 `slack_projection.py` 는 `@staticmethod` 로
      class 안에 있고 `slack_http.py`·`slack_cards.py` 는 module-level 함수다. 어느 쪽으로
      모을지, 어느 모듈에 둘지 정하고 근거를 적는다. import 방향이 순환하지 않는지 확인한다.
    - >-
      **호출 지점을 전수로 센다.** `grep -rn "_clear_exception_frames"` 로 정의와 호출을
      모두 열거하고 표로 적는다. round 14 시점 호출은 `decisions.py:166`, `:289`,
      `review_cards.py:548`, `slack_projection.py` 6곳, `slack_cards.py:85`,
      `slack_http.py` 2곳이다. **직접 다시 센다.**
    - >-
      `review_cards.py:548` 은 `DecisionService._clear_exception_frames(error)` 를 부른다 —
      class 를 가로질러 호출한다. 이것이 사본이 넷인데도 재사용이 일어나고 있었다는 증거다.
      단일 정의로 옮기면 이 호출도 자연스러워진다.
    - >-
      **합친 뒤 mutation sweep 을 다시 돌린다.** 단일 정의를 no-op 으로 만들면 이전에 네
      정의를 각각 죽였던 test 가 **전부** 죽어야 한다. 하나라도 안 죽으면 그 경로의 보호가
      사라진 것이다.
    - >-
      **`__init__.py` export 를 확인한다.** 내부 helper 를 공개 API 로 만들 필요는 없다.
      export 를 추가한다면 이유를 적는다 — wave 5 에서 기록 없는 export 추가가 round 12
      `C-1` 이 됐다.
  invariants:
    - "네 모듈의 credential 보호 동작이 바뀌지 않는다."
    - "합치기 전 죽던 mutation 이 합친 뒤에도 전부 죽는다."
    - "import 순환이 생기지 않는다."
    - "`events.py`, `ingress_worker.py` 를 수정하지 않는다."
    - "공개 API 표면이 이유 없이 넓어지지 않는다."
  non_goals:
    - 함수 동작 변경.
    - 호출 지점 추가나 제거.
    - 다른 중복 helper 의 통합.

acceptance:
  behaviors:
    - id: AC-01
      given: 착수 전 코드.
      when: 네 정의를 각각 no-op 으로 만들고 전 suite 를 돌린다.
      then: >-
        정의별로 죽는 test 목록을 evidence 에 적는다. 어느 정의가 무방비인지 드러난다.
    - id: AC-02
      given: 착수 전 코드.
      when: 네 본문을 `ast.unparse` 로 비교한다.
      then: >-
        동일함을 보인다. 다르면 차이와 이유를 적고 합치기를 멈춘다.
    - id: AC-03
      given: 소스 전체.
      when: "`_clear_exception_frames` 의 정의와 호출을 전수 열거한다."
      then: 표로 적는다. 개수를 명시한다.
    - id: AC-04
      given: 합친 코드.
      when: 정의를 센다.
      then: 하나다.
    - id: AC-05
      given: 합친 코드.
      when: 단일 정의를 no-op 으로 만들고 전 suite 를 돌린다.
      then: >-
        AC-01 에서 죽던 test 가 **전부** 죽는다. 하나라도 안 죽으면 보호가 사라진 것이다.
    - id: AC-06
      given: 합친 코드.
      when: 네 모듈의 credential 관련 test 를 돌린다.
      then: 전부 통과한다.
    - id: AC-07
      given: 전체 test suite.
      when: 아무것도 바꾸지 않고 돌린다.
      then: round 14 기준(1301 passed, 4 deselected) 이상으로 통과하고 실패가 없다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_slack_http.py tests/test_slack_projection.py tests/test_review_cards.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01 의 정의별 mutation 결과 (합치기 전)
      required: true
    - type: note
      source: AC-02 의 동일성 확인
      required: true
    - type: note
      source: AC-03 의 정의·호출 전수 표
      required: true
    - type: note
      source: AC-05 의 합친 뒤 mutation 결과와 AC-01 대조
      required: true

risk:
  level: medium
  concerns:
    - >-
      네 모듈의 credential 보호를 한 곳에 모으는 것이라, 합치는 과정에서 하나의 경로가
      빠지면 그 경로가 조용히 무방비가 된다. AC-05 의 before/after 대조가 그것을 막는다.
    - >-
      import 방향을 잘못 잡으면 순환이 생긴다. `decisions.py` 와 `slack_projection.py` 의
      의존 방향을 먼저 본다.
  approvals: []

loop:
  max_attempts: 4
  replan_after_same_failure: 3
  stop_conditions:
    - definitions_are_not_identical
    - import_cycle_would_be_created
    - a_previously_killed_mutation_survives_after_merge
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-18T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T022.md

handoff:
  expected_changes:
    - "`_clear_exception_frames` 정의 하나와 네 모듈의 호출 갱신."
  notes:
    - >-
      `D-038` 항목 4 가 알려진 한계로 기록해 둔 것을 닫는다. 동작 변경이 아니라 사본 제거다.
    - >-
      MGC-012-P5-T021 뒤에 두는 이유는 둘 다 `slack_http.py` 를 소유하기 때문이다.
