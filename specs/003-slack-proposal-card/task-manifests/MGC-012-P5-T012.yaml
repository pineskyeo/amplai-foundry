schema_version: "1.0"

id: MGC-012-P5-T012
title: Make the safe outcome set contract true and prove it by observing real producers
type: bugfix
status: done

goal:
  outcome: >-
    계약이 열거한 safe outcome 집합과 코드가 실제로 만드는 집합이 같고, 그것을 고정한다고
    주장하는 test 가 enum 이 아니라 producer 를 관측해서 증명한다.
  user_value: >-
    지금 그 test 는 enum 을 hardcoded 문자열로 걸러 자기 자신과 비교하는 동어반복이라
    producer 를 지워도 통과한다. 계약이 지키는 척만 하는 상태를 끝낸다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-11.md
      section: R-4
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-11.md
      section: R-5
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-038
    - path: specs/003-slack-proposal-card/spec.md
      section: FR-024
    - path: specs/003-slack-proposal-card/contracts/interaction-feedback.md
      section: Safe Outcomes
  requirements:
    - FR-024
  decisions:
    - D-038
    - D-034

scope:
  include:
    - producer 를 실제로 관측해서 생산 가능한 safe outcome 집합을 만드는 test 로 바꾼다.
    - 계약의 outcome 표와 그 관측 집합을 대조해 일치시킨다.
    - >-
      같은 열거를 담은 나머지 설계 문서를 맞춘다. `plan.md:118` 과 `research.md:61` 이 넷만
      적고 `unavailable` 을 빠뜨린다 — R-5 와 같은 결함의 두 번째·세 번째 사본이다.
  exclude:
    - "`spec.md` FR-024 의 열거 수정. `/speckit-clarify` 가 이미 반영했다."
    - outcome 값 추가·삭제.
    - 소진 종결 규칙. MGC-012-P5-T011 이 맡는다.
    - feedback 전송 경로나 message 문자열 변경.
  allowed_paths:
    - tests/test_slack_ack_boundary.py
    - specs/003-slack-proposal-card/contracts/interaction-feedback.md
    - specs/003-slack-proposal-card/plan.md
    - specs/003-slack-proposal-card/research.md
  forbidden_paths:
    - vault/
    - src/
    - src/amplai_foundry/cli.py
    - .github/

dependencies:
  tasks:
    - MGC-012-P5-T011
  external: []

implementation:
  guidance:
    - >-
      결함의 형태는 이렇다. `tests/test_slack_ack_boundary.py:1723-1738` 의
      `test_every_safe_outcome_value_has_a_producer` 가 `produced` 를 enum 자신에서 hardcoded
      문자열 집합으로 걸러 만들고 그것을 다시 enum 과 비교한다. producer 를 한 번도 보지 않아
      `ingress_worker.py:389` 의 `return SafeInteractionOutcome.UNAVAILABLE` 을 지워도 통과한다.
    - >-
      producer 를 관측하는 방법은 결과를 만들어 분류 함수에 넣고 나온 값을 모으는 것이다.
      값별로 대표 입력을 만들어 실제로 나온 집합을 세고, 그 집합을 enum 및 message table 과
      대조한다. 어떤 값이 안 나오면 그 값에 producer 가 없다는 뜻이므로 test 가 실패해야 한다.
    - >-
      `T011` 이 소진 종결을 recovery hold 로 승격하므로 `unavailable` 의 producer 가 하나 늘어난다.
      그래서 이 task 는 `T011` 뒤다. 두 task 가 같은 test 파일과 같은 계약 문서를 건드리므로
      동시에 돌리지 않는다.
    - >-
      계약을 코드에 맞출 때 양쪽 집합의 크기를 센다. `R-5` 가 4 대 5 불일치를 남기고 일치했다고
      기록한 사례다. 크기를 세지 않은 대조는 evidence 에 적지 않는다.
  invariants:
    - outcome 값이 늘거나 줄지 않는다.
    - 성공한 첫 decision 은 여전히 safe outcome 을 내지 않는다.
    - "`src/` 는 수정하지 않는다. 이 task 는 계약과 test 만 다룬다."
    - 사용자에게 가는 message 문자열이 바뀌지 않는다.
  non_goals:
    - 새 outcome 값 도입.
    - feedback 전송 실패 처리 변경.

acceptance:
  behaviors:
    - id: AC-01
      given: 갱신된 test.
      when: 저장소의 producer 하나를 지워 그 outcome 이 더 이상 생산되지 않게 만든다.
      then: test 가 실패한다. 지금 test 는 통과하므로 이 차이가 동어반복이 사라졌다는 증거다.
    - id: AC-02
      given: 갱신된 test.
      when: 아무것도 바꾸지 않고 돌린다.
      then: 통과하고 관측된 집합이 enum 및 message table 과 일치한다.
    - id: AC-03
      given: 계약의 outcome 표와 코드가 만드는 집합.
      when: 두 집합의 크기와 원소를 각각 센다.
      then: 크기가 같고 원소가 같다. 두 수를 evidence 에 적는다.
    - id: AC-04
      given: feature 디렉터리의 설계 문서 전부.
      when: safe outcome 을 열거한 곳을 모두 찾아 각 열거의 크기를 센다.
      then: >-
        `plan.md`, `research.md`, `contracts/interaction-feedback.md`, `spec.md` 의 열거가
        모두 같은 집합이고 크기가 같다. 찾은 위치와 각 크기를 evidence 에 적는다.
    - id: AC-05
      given: 갱신 전 상태.
      when: 같은 검색을 갱신 전 tree 에 돌린다.
      then: 넷만 적은 위치가 최소 둘 나온다. 이 대조가 사본을 다 셌다는 증거다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_slack_ack_boundary.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01 의 producer 제거 후 실패 확인 기록
      required: true
    - type: note
      source: AC-03 의 양쪽 집합 크기
      required: true
    - type: note
      source: AC-04 와 AC-05 의 열거 위치 목록과 갱신 전후 각 크기
      required: true

risk:
  level: low
  concerns:
    - producer 관측 test 가 다시 우회 가능한 형태로 쓰일 수 있다. 결정적 검사는 AC-01 의 실패 확인이다.
    - "`T011` 과 파일 소유가 겹친다. 순서를 지키지 않으면 한쪽 변경이 덮인다."
  approvals: []

loop:
  max_attempts: 4
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - outcome_value_would_be_added_or_removed
    - src_change_would_be_required
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-14T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T012.md

handoff:
  expected_changes:
    - producer 를 관측하는 test.
    - 계약의 outcome 표 정렬.
  notes:
    - >-
      wave 4 의 `T007` 이 이 둘을 이미 했다고 기록했으나 하나는 동어반복이었고 하나는 4 대 5
      불일치였다. 같은 주장을 반복하지 않으려면 AC-01 의 실패 확인과 AC-03 의 개수 기록이 필요하다.
