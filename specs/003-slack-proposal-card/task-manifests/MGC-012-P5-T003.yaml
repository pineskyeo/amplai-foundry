schema_version: "1.0"

id: MGC-012-P5-T003
title: Complete signed interaction feedback and end-to-end validation
type: integration
status: done

goal:
  outcome: A signed Slack action is acknowledged within the provider deadline, decided once in the background, reported safely, and followed by one Result Card under local and real-workspace validation.
  user_value: The designated reviewer gets a predictable two-interaction decision flow and safe feedback while unauthorized or stale actions change nothing.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/spec.md
      section: User Story 2 acceptance 2..4; FR-010..FR-015; FR-022..FR-024
    - path: specs/003-slack-proposal-card/plan.md
      section: Interaction Feedback Path; Phase 3
    - path: specs/003-slack-proposal-card/contracts/interaction-feedback.md
      section: Safe Outcomes; Delivery
    - path: specs/003-slack-proposal-card/quickstart.md
      section: Real Workspace; Signed Local Interaction
  requirements:
    - FR-010
    - FR-011
    - FR-012
    - FR-013
    - FR-014
    - FR-015
    - FR-018
    - FR-022
    - FR-023
    - FR-024
    - SC-002
    - SC-003
    - SC-004
    - SC-005
    - SC-007
    - SC-008
  decisions:
    - research.md#D-009
    - research.md#D-010

scope:
  include:
    - Closed safe-outcome mapping and optional post-decision feedback port.
    - Slack chat.postEphemeral adapter with secret-safe HTTP failure handling.
    - Signed raw Block Action integration for all actions, denial classes, replay, and races.
    - Real-workspace production Result and Review Card marker validation.
    - Full offline verification and secret canary scan.
  exclude:
    - Hosting an externally reachable Slack interaction endpoint.
    - Durable response_url storage or reliable ephemeral-message outbox.
    - Production deployment, message editing, modal reason, or multi-reviewer behavior.
  allowed_paths:
    - src/amplai_foundry/governance/ingress_worker.py
    - src/amplai_foundry/governance/slack_http.py
    - src/amplai_foundry/governance/slack_projection.py
    - src/amplai_foundry/governance/slack_cards.py
    - src/amplai_foundry/governance/review_cards.py
    - src/amplai_foundry/governance/__init__.py
    - tests/test_slack_ack_boundary.py
    - tests/test_slack_http.py
    - tests/test_slack_projection.py
    - tests/test_slack_cards.py
    - tests/test_review_cards.py
  forbidden_paths:
    - vault/
    - src/amplai_foundry/memory/
    - src/amplai_foundry/cli.py
    - .github/

dependencies:
  tasks:
    - MGC-012-P5-T002
  external:
    - id: EXT-SLACK-WORKSPACE
      name: Operator-owned Slack test workspace and /Users/pinesky/.config/amplai/slack-test.env
      status: available

implementation:
  guidance:
    - Keep BoundedIngressAck semantics and HTTP status mapping unchanged.
    - Call feedback only after the governance transaction and ingress transition resolve.
    - Map internal codes to a closed safe vocabulary before network delivery.
    - Reuse production renderers in every live E2E path.
  invariants:
    - A success acknowledgement means durably accepted, not decision completed.
    - Feedback failure never rolls back or repeats a committed decision.
    - Unauthorized, expired, stale, revoked, consumed, and replayed actions cause at most one logical decision.
    - A revoked action maps to stale, never already-completed, unless an idempotent result actually exists.
    - Raw Slack body, token value, bot token, and signing secret never enter result, exception, log, or test evidence.
    - Live E2E is excluded from default pytest and offline verify.
  non_goals:
    - Externally reachable server or deployment topology.
    - Reliable ephemeral delivery guarantee.
    - Production rollout or approval reason collection.

acceptance:
  behaviors:
    - id: AC-01
      given: A production-rendered Review Card action signed with the configured Slack signing secret.
      when: BoundedIngressAck accepts it and IngressDecisionWorker processes the durable command.
      then: Ack completes inside three seconds, one matching Proposal transition commits, and one separate Result Card event is enqueued.
    - id: AC-02
      given: An unauthorized, expired, stale, revoked, consumed, or replayed action.
      when: The background worker resolves it.
      then: No additional Proposal transition occurs and the feedback adapter receives only the matching closed safe outcome.
    - id: AC-03
      given: Safe feedback delivery fails after a decision or terminal denial.
      when: The worker returns.
      then: The governed outcome and ingress state remain final and only a secret-free feedback error code is reported.
    - id: AC-04
      given: Configured real-workspace credentials.
      when: The Slack E2E sends production-rendered Result and Review Cards and retries their events.
      then: Each logical Card has one visible message, a readable marker, and no test-only substitute payload.
    - id: AC-05
      given: The default offline verification command.
      when: It runs without Slack environment variables.
      then: All offline gates run, live E2E remains deselected, and unrelated provider behavior passes unchanged.
  commands:
    - id: signed-integration
      kind: integration
      run: .venv/bin/python -m pytest tests/test_slack_ack_boundary.py tests/test_review_cards.py tests/test_slack_projection.py tests/test_slack_http.py -m "not slack_e2e"
      required: true
    - id: live-e2e
      kind: integration
      run: set -a; source /Users/pinesky/.config/amplai/slack-test.env; set +a; .venv/bin/python -m pytest tests/test_slack_http.py -m slack_e2e -k "result_card or review_card" -rs
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: signed-integration
      required: true
    - type: command_output
      source: live-e2e
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true

risk:
  level: high
  concerns:
    - Live Slack calls create visible test messages.
    - Feedback network failure must remain isolated from governed decisions.
    - Test diagnostics can leak authority-bearing values if local capture is unsafe.
  approvals:
    - User explicitly requested implementation, live validation, and three-lens review on 2026-08-12.
    - Real-workspace credentials and target channel remain operator-owned configuration.

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - slack_test_workspace_configuration_missing
    - live_test_would_target_an_unapproved_channel
    - raw_secret_appears_in_any_evidence
    - scope_boundary_must_expand_to_a_new_server
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-12T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T003.md

handoff:
  expected_changes:
    - Safe post-decision feedback port and Slack ephemeral adapter.
    - Signed local end-to-end interaction tests and production-rendered live E2E.
    - Full gate evidence ready for independent three-lens review.
  notes:
    - A human click is not required because external Request URL hosting is excluded; signed raw-byte integration owns that boundary.
