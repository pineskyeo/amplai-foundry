schema_version: "1.0"

id: MGC-012-P5-T015
title: Sanitize every Slack transport failure at the shared exit instead of per caller
type: fix
status: done

goal:
  outcome: >-
    `SlackHttpTransport` 의 네 진입점 어디로 나가는 실패든 bot token 을 traceback 에 남기지
    않는다. sanitize 는 호출자마다가 아니라 공통 통로 하나에서 일어나므로 진입점이 늘어도
    사본을 셀 필요가 없다. 그리고 그 보장을 실제로 깨뜨릴 수 있는 test 가 붙는다.
  user_value: >-
    지금 shipped code 에서 bot token 이 실제로 샌다. round 13 `F-1` 이 unmutated code 에서
    6 frame 을 실측했고, `--showlocals` 렌더러와 구조화 log handler 로 출력하면
    `Authorization: Bearer xoxb-...` 가 그대로 찍힌다. 새어나간 token 은 회수할 수 없다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: F-1
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: F-2
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: PBC-1
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: PBC-2
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-038
    - path: specs/003-slack-proposal-card/contracts/review-card-lifecycle.md
      section: Forbidden diagnostic fields
    - path: specs/003-slack-proposal-card/contracts/slack-card-payloads.md
      section: Forbidden
  requirements:
    - FR-019
    - FR-021
    - SC-003
    - SC-004
  decisions:
    - D-038

scope:
  include:
    - >-
      `SlackTransportError` 가 `_call` 밖으로 나갈 때 exception chain 을 지우는 것. 지금은
      `post_message`(`:402`)와 `post_ephemeral`(`:429`)만 `_sanitized_transport_error()` 를
      부르고 `delete_message`(`:445`)와 `read_history`(`:471`)는 `_call` 을 맨몸으로 부른다.
    - "`_clear_exception_frames` 호출 지점의 회귀 test (`F-2`)."
    - "token 누출 test 의 fixture 결함 수정 (`PBC-1`)."
    - "평범한 `Exception` 과 `HTTPError` arm 을 실제로 타는 누출 test 추가 (`PBC-2`)."
  exclude:
    - "`ingress_worker.py` 의 어떤 변경도. MGC-012-P5-T016 이 맡는다."
    - "`spec.md` 와 계약 문서. MGC-012-P5-T017 이 맡는다."
    - "`events.py` 감사 대조 guard. MGC-012-P5-T018 이 맡는다."
    - "provider 문자열을 durable code 에 쓰는 문제 (round 13 Advisory-3). 이번 wave 밖이다."
    - "`safe_slack_error_code` 나 `safe_transport_exception` 의 분류 규칙 변경."
  allowed_paths:
    - src/amplai_foundry/governance/slack_http.py
    - tests/test_slack_http.py
  forbidden_paths:
    - vault/
    - .github/
    - src/amplai_foundry/governance/ingress_worker.py
    - src/amplai_foundry/governance/events.py
    - specs/003-slack-proposal-card/spec.md
    - specs/003-slack-proposal-card/contracts/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **근거가 FR 이 아니라 계약이다.** `spec.md` 에 "bot token 이 exception traceback 에
      남으면 안 된다" 를 직접 서술하는 FR 이 **없다.** FR-018 과 SC-005 는 one-time decision
      credential 로, FR-019 는 Card content 로 한정된다. 이 task 의 실제 근거는
      `contracts/review-card-lifecycle.md:111-119` 의 "Forbidden diagnostic fields — bot token
      or signing secret" 과 그 아래 "Automated canary tests inspect ... exception strings ...
      pytest `--showlocals` output" 이다. **FR 을 새로 만들지 않는다** — 계약 변경이므로
      Decision 이 필요하고 이번 wave 밖이다. `index.yaml` 의 open question 에 기록돼 있다.
    - >-
      **누출 경로를 먼저 이해한다.** `_fail()`(`:748`)이 `raise SlackTransportError(...) from
      error` 를 한다. 그래서 `__cause__` 에 원본 urllib 예외가 붙고 그 traceback 의
      `open`/`_open`/`http_open`/`do_open` frame 들이 `request` 를 들고 있다. 그 `request` 에
      `Authorization: Bearer <token>` header 가 있다. `_call` 의 `finally`(`:545-557`)는
      **자기 frame 의 local 만** 비우므로 `__cause__` chain 의 frame 은 남는다.
      `_sanitized_transport_error()`(`:596`)가 그 chain 을 지우는 유일한 곳이다.
    - >-
      **호출자 넷에 각각 sanitize 를 붙이지 않는다.** 그것이 네 라운드 연속 반복된 실수다
      (round 11 `R-1`, 12 `F-2`, 12 `RL-3`~`RL-5`, 13 `F-1`). wave 6 이 `BaseException`
      guard 에 대해 이미 옳은 방향을 택했다 — `_call`(`:529-544`) 안에 두어 사본을 없앴다.
      `SlackTransportError` 도 같은 통로에서 처리한다. `_call` 의 `except
      SlackTransportError`(`:520`) arm 이 그 자리다.
    - >-
      그 arm 의 현재 주석은 "다시 감싸면 원인이 흐려진다" 라고 적는다. **sanitize 는 다시
      감싸는 것이 아니다.** `_sanitized_transport_error` 는 `error_code`, `status_code`,
      `retry_after_seconds`, `transport_exception` 을 그대로 옮긴다. 분류에 쓰이는 값은 전부
      보존된다. 주석을 새 사실에 맞게 고친다.
    - >-
      **`_fail_http`(`:709`)도 확인한다.** 그것이 만드는 `SlackTransportError` 가 어떤 경로로
      나가는지 세고, 같은 통로를 타는지 실측한다. 통로가 둘이면 그 자체가 이 task 가 없애려는
      사본이다.
    - >-
      호출자 넷의 기존 `except SlackTransportError` 처리는 sanitize 가 공통 통로로 옮겨진 뒤
      **중복이 되는지 확인하고 판단한다.** 남겨두면 두 번 지우는 무해한 중복이고, 없애면
      사본이 준다. 어느 쪽이든 **네 진입점 전부에서 leak 이 빈 것을 실측으로 보인다.**
    - >-
      **fixture 를 먼저 고친다 (`PBC-1`).** `tests/test_slack_http.py:3085` 의
      `_OpenerRaising.open` 이 `del request, timeout` 을 한다. 그 `request` 가 **guard 가
      지우려는 대상 자체**다. 검사 대상을 fixture 가 먼저 없애므로 지금 test 는 구조상
      통과한다. `del` 을 지우면 세 진입점에서 `[('open','request')]` 가 나온다.
    - >-
      **fake opener 로는 진짜 경로를 못 탄다 (`PBC-2`).** 실제 누출은 `except Exception`
      (`:525`)과 `except urllib.error.HTTPError`(`:523`) arm 에서 난다. 지금 test 는
      `_NotAnException` 만 넣어 `BaseException` arm 만 탄다. **real urllib 로 connection
      refused 를 내는 test** 를 넣는다 — 연결 거부·타임아웃·DNS·TLS 가 전부 그 arm 을 탄다.
      round 13 이 그 방식으로 실측했다.
    - >-
      **문자열 검사로는 못 잡는다.** `Request` 의 `repr` 이 header 를 보여주지 않으므로
      `repr(f_locals)` 를 훑는 test 는 아무것도 고정하지 못한다. wave 6 이 그 함정에 빠졌다
      (`:553-555` 주석이 기록한다). test 는 `frame.f_locals` 에서 객체를 꺼내
      `request.headers` 를 **직접** 본다.
    - >-
      **guard 를 지워 실패를 확인한 뒤에야 고정한다고 적는다.** `_clear_exception_frames(error)`
      호출을 지웠을 때(`F-2`) 실패하는 test 이름을 evidence 에 적는다. 지금은 지워도 1274건이
      전부 통과한다.
  invariants:
    - >-
      성공 경로의 반환값(`SlackSendResult`, `SlackHistoryPage`, `Mapping`)이 바뀌지 않는다.
    - >-
      `SlackTransportError` 의 `error_code`, `status_code`, `retry_after_seconds`,
      `transport_exception` 이 sanitize 뒤에도 같은 값이다. 재시도 분류가 이 값들을 쓴다.
    - "`BaseException` interruption 경로(`:529-544`)의 동작이 바뀌지 않는다."
    - "signing secret 과 bot token 이 test 코드에 평문 상수로 남지 않는다."
    - "`ingress_worker.py`, `events.py`, `spec.md`, 계약 문서를 수정하지 않는다."
  non_goals:
    - transport 재시도 정책 변경.
    - Slack API method 추가.
    - "`SlackTransportError` 의 필드 추가나 제거."

acceptance:
  behaviors:
    - id: AC-01
      given: real urllib opener 가 connection refused 를 내는 상태.
      when: "`post_message`, `post_ephemeral`, `read_history`, `delete_message` 넷을 각각 부른다."
      then: >-
        네 경우 모두 올라온 예외의 `__cause__`/`__context__` chain 을 끝까지 훑어도
        `Authorization` header 를 든 객체가 든 frame 이 하나도 없다. leak 목록이 넷 다 빈다.
    - id: AC-02
      given: AC-01 과 같은 상태.
      when: "`capture_locals=True` 렌더러(`--showlocals` 와 같은 경로)로 traceback 을 출력한다."
      then: 네 경우 모두 출력 문자열에 bot token 값이 나타나지 않는다.
    - id: AC-03
      given: 신규 test.
      when: "`_call` 의 `except SlackTransportError` arm 에서 sanitize 호출을 지운다."
      then: test 가 실패한다. 어느 진입점에서 실패하는지 evidence 에 적는다.
    - id: AC-04
      given: 신규 test.
      when: "`_call` 의 `_clear_exception_frames(error)` 호출(`:543`)을 지운다."
      then: test 가 실패한다 (`F-2`).
    - id: AC-05
      given: 신규 test.
      when: "`_call` 의 `finally` 에 있는 `request = None`(`:556`)을 지운다."
      then: test 가 실패한다.
    - id: AC-06
      given: 수정된 fixture.
      when: "`_OpenerRaising.open` 의 소스를 읽는다."
      then: >-
        guard 가 지우려는 대상(`request`)을 fixture 가 먼저 지우지 않는다. `del` 이 남아 있다면
        그것이 검사 대상이 아님을 evidence 에 근거로 적는다.
    - id: AC-07
      given: 신규 test 집합.
      when: 어떤 arm 을 타는지 센다.
      then: >-
        `except urllib.error.HTTPError`, `except Exception`, `except BaseException` 세 arm 이
        각각 적어도 하나의 test 로 덮인다 (`PBC-2`).
    - id: AC-08
      given: "`SlackTransportError` 를 내는 경로 전부."
      when: 소스에서 그 경로를 전수 열거한다.
      then: >-
        `_fail`, `_fail_http`, `_decode` 를 포함해 각각이 어느 통로로 호출자에게 나가는지
        evidence 에 표로 적고, 그 통로 전부가 sanitize 를 거침을 보인다. 통로가 하나가 아니면
        왜 하나로 못 만드는지 적는다.
    - id: AC-09
      given: 전체 test suite.
      when: 아무것도 바꾸지 않고 돌린다.
      then: round 13 기준(1274 passed, 4 deselected) 이상으로 통과하고 실패가 없다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_slack_http.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01 의 네 진입점별 leak 목록 실측 출력
      required: true
    - type: note
      source: AC-03/AC-04/AC-05 각 실험의 실패한 test 이름과 실패 사유
      required: true
    - type: note
      source: AC-08 의 SlackTransportError 발생 경로 전수 표
      required: true

risk:
  level: high
  concerns:
    - >-
      credential 누출 결함이다. 고쳤다고 잘못 주장하면 다음 라운드가 아니라 운영에서 드러난다.
      wave 6 이 정확히 그렇게 절반만 고치고 닫혔다고 적었다.
    - >-
      `_call` 의 `except SlackTransportError` arm 에 sanitize 를 넣으면 내부에서 발생한
      `SlackTransportError`(`_decode` 등)도 지나간다. 분류에 쓰이는 필드가 보존되는지
      확인하지 않으면 재시도 동작이 조용히 바뀐다.
    - >-
      real urllib 를 쓰는 test 는 network 에 의존하기 쉽다. 닫힌 loopback port 로 connection
      refused 를 만들어 network 를 타지 않게 한다.
  approvals:
    - >-
      사용자가 2026-08-17 에 round 13 blocker 9건을 닫는 wave 7 착수를 지시했다. `F-1` 은 그
      범위의 첫 항목이다.
    - >-
      계약 변경이 아니므로 별도 Decision 이 필요하지 않다. sanitize 는 `SlackTransportError`
      의 분류 필드를 보존하고 credential 만 지운다. 분류가 바뀌면 그것은 `stop_conditions` 의
      `sanitize_would_change_retry_classification` 에 걸려 멈춘다.

loop:
  max_attempts: 4
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - sanitize_would_change_retry_classification
    - single_exit_path_appears_impossible
    - scope_boundary_must_expand
    - test_requires_real_network
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-17T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T015.md

handoff:
  expected_changes:
    - "`slack_http.py` 의 `_call` 이 `SlackTransportError` 를 공통 통로에서 sanitize 한다."
    - "호출자 넷의 중복 sanitize 처리 정리."
    - "token 누출 test 의 fixture 수정과 세 arm 을 덮는 신규 test."
  notes:
    - >-
      **실제 동작 결함이다.** 회귀 방어 부재가 아니다. round 13 이 unmutated shipped code 에서
      실측했다.
