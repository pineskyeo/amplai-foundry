schema_version: "1.0"

id: MGC-012-P5-T020
title: Pin the remaining eight audit comparison blocks in reconcile_connection
type: test
status: superseded

goal:
  outcome: >-
    `reconcile_connection()` 의 나머지 여덟 감사 대조 블록의 **모든** 성분이 test 로
    고정된다. 어느 하나를 지워도 test 가 실패하고, 그 실패가 겨냥한 대조에서 났음을 보인다.
  user_value: >-
    이 대조들은 governed mutation 이 자기가 기록한 감사와 맞는지 보는 무결성 관문이다.
    **성분 69개 중 66개가 무방비였고** 그중 60개가 이 task 의 범위다. 감사가 틀린 채로
    통과하면 그 뒤 모든 판단의 근거가 무너진다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/MGC-012-P5-T018.md
      section: 형제 블록 전수 측정
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: F-4
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-12.md
      section: RL-3
  requirements:
    - FR-013
    - FR-015
    - FR-021
    - SC-003
  decisions:
    - D-038

scope:
  include:
    - >-
      **SUPERSEDED (2026-08-18) — `MGC-012-P5-T023` 이 이 범위를 흡수한다.**
      이 task 는 여덟 블록 60성분에 하나씩 회귀 test 를 다는 것이었다. round 14 뒤 사용자가
      "구조를 먼저 고친다" 를 선택했고, T023 이 여덟 or-chain 을 `expected` mapping 을 받는
      helper 하나로 대체한다. **성분을 세는 작업 자체가 사라지므로** 이 task 는 실행되지
      않는다. 지우지 않고 남기는 이유는 무엇이 왜 없어졌는지가 기록이기 때문이다.

      기록 정정: 이 manifest 는 블록을 8개, `L1712` 를 9성분이라 적었다. round 14 `BP2-5` 가
      실제로는 **7블록이 남았고 `L1712` 는 10성분**임을 두 lens 로 확인했다. 총계 60 은 맞다.
    - >-
      (원래 범위) 아래 여덟 블록의 모든 성분에 대한 회귀 test. 각 성분을 비교에서 지우면 적어도 하나의
      test 가 실패해야 하고, 그 실패 코드가 겨냥한 대조의 것이어야 한다.
    - >-
      `events.py` L1481 legacy(9 성분), L1558 review(9), L1712 recovery(9),
      L1796 decision(8), L1876 apply(8), L1960 job(8), L2114 publish(8).
      **총 60 성분.** 줄 번호는 2026-08-17 기준이고 착수 시 다시 센다.
  exclude:
    - "`src/` 수정. 이 task 는 회귀 방어만 추가한다."
    - >-
      review Card 감사 블록(`events.py` L1255-1263). MGC-012-P5-T018 이 이미 닫았다.
    - "두 cardinality guard 의 0 방향 (round 13 `N16`/`N17`). Advisory 다."
    - 감사 대조 로직 변경이나 성분 추가.
  allowed_paths:
    - tests/test_governance_events.py
    - tests/test_review_cards.py
  forbidden_paths:
    - vault/
    - src/
    - .github/

dependencies:
  tasks:
    - MGC-012-P5-T018
  external: []

implementation:
  guidance:
    - >-
      **줄 번호를 믿지 말고 다시 센다.** 위 목록은 2026-08-17 측정 시점 값이다. 세는 방법은
      `reconcile_connection()` 안에서 `audit.<field> !=` 로 시작하는 비교 줄을 전부 뽑는
      것이다. MGC-012-P5-T018 의 evidence 에 그 스크립트가 있다.
    - >-
      **시작 전에 전수 측정을 한 번 돌린다.** 성분을 하나씩 지우고 test 를 돌려 무방비 목록을
      만든다. 그 목록이 이 task 의 작업 목록이자 완결 기준이다. 60개는 2026-08-17 값이고
      T018 이 그 사이 일부를 덮었을 수 있다.
    - >-
      **다른 검사가 먼저 걸리면 고정이 아니다.** audit row 를 고치면 hash chain 도 깨지므로
      `AUDIT_HASH_CHAIN_INVALID` 가 대신 잡을 수 있다. 각 test 는 실패 코드가 겨냥한 대조의
      것인지 확인한다. T018 이 그 방식을 썼다.
    - >-
      블록마다 fixture 가 다르다 — legacy, review, recovery, decision, apply, job, publish.
      **한 fixture 로 여덟을 덮으려 하지 않는다.** 덮이지 않는 블록이 조용히 남는다.
    - >-
      `proposal_ref` 성분은 한 column 이 아니라 `project_namespace`, `project_id`,
      `proposal_id` 셋으로 저장되고 외래키가 걸려 있다. T018 이 그 성분을 별도 test 로 다뤘다.
    - >-
      **mutation 이 살아남으면 코드보다 test 를 먼저 의심한다.**
  invariants:
    - "`src/` 는 수정하지 않는다."
    - "기존 감사 event schema 와 저장 형식이 바뀌지 않는다."
    - "기존 test 를 지우지 않는다."
    - "신규 test 가 실제 vault 나 사용자 데이터를 건드리지 않는다."
  non_goals:
    - 감사 대조 로직 변경.
    - 새 감사 성분 추가.
    - "`reconcile_connection()` 리팩터링. 여덟 블록을 하나로 합치는 것은 별도 판단이다."

acceptance:
  behaviors:
    - id: AC-01
      given: "`reconcile_connection()` 의 감사 대조 블록 전체."
      when: 성분을 전수 열거한다.
      then: >-
        블록별 줄 번호와 성분 수를 evidence 에 표로 적는다. 합계를 명시한다.
    - id: AC-02
      given: AC-01 의 표.
      when: 착수 전에 각 성분을 하나씩 지우고 test 를 돌린다.
      then: 무방비 성분 목록을 evidence 에 적는다. 이것이 작업 목록이다.
    - id: AC-03
      given: 신규 test.
      when: AC-02 의 각 무방비 성분을 다시 지운다.
      then: 적어도 하나의 test 가 실패한다.
    - id: AC-04
      given: AC-03 의 각 실험.
      when: 실패 코드를 확인한다.
      then: >-
        겨냥한 대조의 코드다. `AUDIT_HASH_CHAIN_INVALID` 처럼 다른 검사가 먼저 잡은 경우는
        고정으로 세지 않는다.
    - id: AC-05
      given: 여덟 블록.
      when: 각 블록이 적어도 하나의 신규 test 로 덮이는지 센다.
      then: 여덟 전부 덮인다. 덮이지 않은 블록이 있으면 이유를 적는다.
    - id: AC-06
      given: 전체 test suite.
      when: 아무것도 바꾸지 않고 돌린다.
      then: 실패가 없다.
  commands:
    - id: targeted-events
      kind: test
      run: .venv/bin/python -m pytest tests/test_governance_events.py
      required: true
    - id: targeted-cards
      kind: test
      run: .venv/bin/python -m pytest tests/test_review_cards.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted-events
      required: true
    - type: command_output
      source: targeted-cards
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01 의 블록별 성분 표
      required: true
    - type: note
      source: AC-02 의 착수 전 무방비 목록
      required: true
    - type: note
      source: AC-03/AC-04 의 성분별 실패한 test 이름과 실패 코드
      required: true

risk:
  level: medium
  concerns:
    - >-
      60 성분이다. 블록마다 fixture 가 달라 한 번에 덮으려 하면 덮이지 않은 블록이 조용히
      남는다. AC-05 가 그것을 센다.
    - >-
      audit row 를 고치면 hash chain 이 깨져 다른 검사가 먼저 잡을 수 있다. 그러면 고정을
      잘못 주장하게 된다.
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - component_appears_unreachable_without_src_change
    - src_change_would_be_required
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: false
  required_evidence_present: false
  completed_at: null
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T020.md

handoff:
  expected_changes:
    - 여덟 블록 60 성분의 회귀 test.
  notes:
    - >-
      실제 동작 결함이 아니다. 회귀 방어 부재다. 다만 **규모가 크다** — round 13 `F-4` 는
      이 결함 class 의 성분 둘만 지목했고, 전수를 세니 66개가 무방비였다. 60개가 여기 남았다.
    - >-
      이 task 는 MGC-012-P5-T018 의 scope 결정(2026-08-17, 사용자)에서 갈라져 나왔다.
      **조용히 줄인 것이 아니라 명시적으로 넘긴 것이다.**
