schema_version: "1.0"

id: MGC-012-P5-T038
title: Count what the two new structures actually require, this time to the end
type: code
status: done

goal:
  outcome: >-
    `unreadable()` 이 `limit` 안에서 손상 row 를 놓치지 않고, sweep 이 만든 모든 상태 전이
    경로가 표와 test 에 있다.
  user_value: >-
    round 18 `N18-1`(P1)·`N18-2`·`F18-R1`·`F18-R2`. **넷이 wave 11 이 넣은 두 구조에서
    나왔다.** `T035` evidence 가 "새 구조가 요구한 것 다섯" 을 세었는데 **그 목록 자체가 덜
    셌고**, `F18-R1` 은 그 목록의 **첫째 항목**이다 — 처리를 적고 test 를 안 만들었다.
    round 16 blocker 넷과 round 18 blocker 셋이 모두 같은 자리에서 나왔다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-18.md
      section: New Blockers
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-18.md
      section: Two Roots
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-048
  requirements:
    - FR-024
  decisions:
    - D-045
    - D-047
    - D-048

scope:
  include:
    - >-
      **`N18-1`** (P1) — `D-048` 대로 `unreadable()` 의 SELECT 가 종결 상태(`completed`)를
      SQL 에서 제외한다. `limit` 이 후보 상한으로 돌아온다.
    - >-
      **`N18-2`** — `leased`+만료+소진 손상 row 가 소진 sweep 으로 먼저 `dead_letter` 가
      되는 경로. **표에 없던 경로다.** 표를 고치고 그 row 가 여전히 `unreadable()` 에
      나오는 것을 test 로 고정한다.
    - >-
      **`F18-R1`** — `_sweep_recoverable()` **자체의 실패**에 test 를 만든다. sweep 만
      실패하고 claim 은 성공할 수 있는 시나리오여야 한다.
    - >-
      **`F18-R2`** — `unreadable()` 의 `limit < 1` guard test.
    - >-
      **두 구조가 요구하는 것을 다시 전수로 센다.** wave 11 의 다섯 항목이 왜 덜 셌는지와
      이번에 무엇이 늘었는지를 표로 적는다.
  exclude:
    - "`unreadable()` 을 두 조회로 나누는 것. `D-048` 이 거절했다."
    - "`stranded()`·`get()`·`is_unreadable()` 의 signature 와 계약."
    - "CLI 출력 형식."
    - "`A18-4`(sweep 의 `last_error_code` 덮어쓰기) — wave 11 이 만든 것이 아니다."
    - "`A18-3`(빈 큐에서 sweep 이 write transaction 을 여는 비용)."
    - "`OutboxDispatcher` (`A18-6`). 사용자가 범위 밖으로 정했다."
    - "문서 census 와 freeze 절차. `T039`·`T040` 이 소유한다."
  allowed_paths:
    - src/amplai_foundry/governance/ingress.py
    - tests/test_slack_ack_boundary.py
  forbidden_paths:
    - vault/
    - specs/003-slack-proposal-card/spec.md
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/cli.py
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **구조가 요구하는 것을 먼저 표로 만들고 그 다음에 고친다.** wave 11 은 고치면서
      세었고 그래서 목록이 덜 찼다. 각 항목에 **처리**와 **그 처리를 지키는 test** 를 둘 다
      적는다. test 칸이 빈 항목이 있으면 그것이 다음 라운드의 blocker 다.
    - >-
      **`N18-1` 은 `limit` 의 의미를 되돌리는 것이다.** `D-048` 이 종결 상태를 SQL 에서
      제외하기로 정했다. 그러면 `stranded()` 와 같은 규칙이 된다 — 두 목록이 다른 규칙을
      따르면 같은 command 의 출력이 어긋난다.
    - >-
      **`N18-2` 는 계약을 바꾸는 것이 아니다.** `D-045` 의 `INGRESS_COMMAND_UNREADABLE` 은
      `_dead_letter_unreadable` 이 치운 경로의 표시다. 소진 sweep 이 먼저 치운 row 는
      `INGRESS_LEASE_EXPIRED` 를 갖는다 — 그것도 사실이다. **문제는 표가 그 경로를 안
      담은 것이다.** 표를 고치고, 그 row 가 여전히 `unreadable()` 에 나오는 것을 고정한다.
    - >-
      **`F18-R1` 의 test 는 sweep 만 실패시켜야 한다.** 기존
      `..._filesystem_failure_in_claim_next_...` 는 `window=(1, 10**6)` 으로 store 를 통째로
      막아 sweep 이 삼켜도 `_claim_one` 이 대신 실패한다. **좁은 창으로 sweep 의 connect
      만 때린다.** wave 11 의 실측이 sweep 은 `validate()` 1-2 번이라고 했다.
    - >-
      **mutation 을 돌릴 때 `.pyc` 캐시를 막는다** (round 18 `A18-R1`). test 파일을 같은
      크기로 1초 안에 다시 쓰면 CPython 이 변경을 감지하지 못해 직전 컴파일 결과가
      재실행된다. `PYTHONDONTWRITEBYTECODE=1` 을 쓰거나 `__pycache__` 를 지운다.
  invariants:
    - "`stranded()` 가 내는 목록의 의미가 바뀌지 않는다."
    - "`_dead_letter_unreadable` 의 guard 를 넓히지 않는다."
    - "읽기 실패만 `_UNREADABLE_ROW` 로 잡는다."
    - "`unreadable()` 과 `stranded()` 가 같은 정렬 규칙을 쓴다."
    - "test 를 지우거나 약화하지 않는다."
  non_goals:
    - 조회를 둘로 나누는 것.
    - CLI 변경.
    - Outbox 수정.

acceptance:
  behaviors:
    - id: AC-01
      given: 종결 상태 row 가 `limit` 보다 많고 그 뒤에 손상 row 가 하나 있다.
      when: "`governance stranded` 를 부른다."
      then: 손상 row 가 `UNREADABLE` 로 나온다. `NONE` 이 아니다.
    - id: AC-02
      given: 같은 시나리오.
      when: "`unreadable()` 의 SELECT 에서 종결 상태 제외를 되돌린다."
      then: test 가 죽는다.
    - id: AC-03
      given: 손상 row 가 durable `leased` + 만료 + `attempts >= max` 다.
      when: "`claim_next` 를 부른다."
      then: >-
        그 row 가 `dead_letter` 가 되고 **`unreadable()` 에 나온다.** `last_error_code` 의
        실제 값을 evidence 에 적고 `ingress.py` 의 표가 같은 값을 말한다.
    - id: AC-04
      given: "`_sweep_recoverable()` 만 실패하고 `_claim_one` 은 성공할 수 있는 상태."
      when: "`process_next` 를 부른다."
      then: "`CLAIM_FAILED` 로 닫힌다. sweep 호출을 `try/except: pass` 로 감싸면 test 가 죽는다."
    - id: AC-05
      given: "`unreadable()` 의 `limit < 1` guard."
      when: 지운다.
      then: test 가 죽는다.
    - id: AC-06
      given: wave 11 이 넣은 두 구조.
      when: 각 구조가 요구하는 것을 전수로 센다.
      then: >-
        표에 항목마다 **처리**와 **test** 가 있다. wave 11 의 다섯 항목이 왜 덜 셌는지와
        이번에 늘어난 항목을 적는다. round 18 의 셋이 표의 어디에 해당하는지 대응시킨다.
    - id: AC-07
      given: 전체 test suite.
      when: 돌린다.
      then: 통과하고 test 수가 줄지 않는다. 두 방법으로 세어 둘 다 적는다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_ingress.py tests/test_slack_ack_boundary.py tests/test_cli.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: lint
      run: .venv/bin/python -m mypy
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: mutation-table
      observer: 구현자
      action: >-
        AC-02·AC-04·AC-05 의 mutation 을 하나씩 넣고 `PYTHONDONTWRITEBYTECODE=1
        .venv/bin/python -m pytest` 를 돌린 뒤 되돌린다.
      expected: 셋 다 KILLED 이고 서로 다른 test 가 죽는다.
      reason_not_automated: >-
        mutation 은 구현 파일을 일시적으로 바꾸는 것이라 suite 안에서 자동화하면 검사 대상을
        지운다.
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: diff-check
      required: true
    - type: note
      source: AC-06 의 두 구조 요구 표 (처리와 test 를 둘 다)
      required: true
    - type: note
      source: mutation 표 (KILLED 와 죽은 test 이름)
      required: true
    - type: note
      source: AC-01 의 RED→GREEN 실측
      required: true

risk:
  level: high
  concerns:
    - >-
      **round 16 blocker 넷과 round 18 blocker 셋이 모두 "새 구조가 요구하는 것을 덜 셌다"
      에서 나왔다.** 이번에도 목록이 덜 차면 아홉 번째다.
    - >-
      `unreadable()` 의 WHERE 를 좁히면 손상 `completed` row 가 안 보인다. `D-048` 이 그
      대가를 승인했고 `is_unreadable()` 이 id 단위로 답한다.
  approvals:
    - public_contract

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - a_fix_would_require_splitting_the_query
    - stranded_contract_would_have_to_change
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-26T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T038.md

handoff:
  expected_changes:
    - "`unreadable()` 의 SELECT 에 종결 상태 제외."
    - "`ingress.py` 의 state 표에 소진 sweep 경로 추가."
    - "sweep 실패 test, `limit < 1` test, `limit` 창 test."
  notes:
    - >-
      **표의 test 칸이 빈 항목이 다음 라운드의 blocker 다.**
