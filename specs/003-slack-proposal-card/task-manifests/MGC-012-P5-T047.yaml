schema_version: "1.0"

id: MGC-012-P5-T047
title: Make the stranded window count what it returns, not what SQL fetched
type: fix
status: done

goal:
  outcome: >-
    round 21 의 F21-1(P1)과 F21-2 를 닫는다. D-057 이 stranded() 의 limit 을 출력 상한으로
    옮긴다.
  user_value: >-
    operator 가 보는 목록이 잘렸을 때 손상 row 유무와 무관하게 잘렸다고 말한다. 자세한
    것은 `specs/003-slack-proposal-card/evidence/3lens-review-round-21.md` 다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-21.md
      section: New Blockers
  requirements:
    - FR-024
  decisions:
    - D-045
    - D-047
    - D-049
    - D-050
    - D-057

scope:
  include:
    - >-
      **`F21-1`** (P1) — `_stranded_rows` 가 `SQL LIMIT` 을 버리고 **읽을 수 있는 row 를
      `limit` 개 모으면 멈춘다.** 손상 row 는 창을 소비하지 않는다. `D-049` 가
      `unreadable()` 에 대해 한 이동과 같다.
    - >-
      **`F21-2`** — `limit + 1` 이 sqlite3 binding 에 도착하지 않게 된다. 위쪽 끝
      (`int64` max)이 raw traceback 없이 도는지 **실측으로 확인하고**, 구조적으로 닫혔는지
      guard 가 잡는지를 구분해 적는다.
    - >-
      `stranded()` 와 `_stranded_rows` 의 docstring 이 새 계약과 그 비용 근거
      (`EXPLAIN QUERY PLAN` 대조)를 담는다.
  exclude:
    - "`stranded()`·`unreadable()` 의 signature 와 반환 타입 변경. `D-057` 이 안 A 로 배제했다."
    - "`governance_ingress_commands` 에 index 추가. 성능 Work 가 아니다."
    - "`cli.py` 의 판정식 변경. 전제가 참이 되므로 고칠 것이 없다."
    - "문서 정정. `T046` 이 소유한다."
  allowed_paths:
    - src/amplai_foundry/governance/ingress.py
    - src/amplai_foundry/cli.py
    - tests/test_cli.py
    - tests/test_slack_ack_boundary.py
    - specs/003-slack-proposal-card/
  forbidden_paths:
    - vault/
    - specs/003-slack-proposal-card/spec.md
    - .github/
    - tools/amplai-loop-kit/

dependencies:
  tasks:
    - MGC-012-P5-T044
  external: []

implementation:
  guidance:
    - >-
      **RED 를 먼저 만든다.** 후보 200 / 손상 1 / `--limit 100` 에서 잘림 표시가 꺼지는
      것을 재현하고 그 수치를 evidence 에 적는다.
    - >-
      **새 구조가 요구하는 것을 양쪽 끝에서 센다.** wave 14 는 아래쪽 끝(`0`·`-1`)만 셌고
      위쪽 끝이 `F21-2` 가 됐다. 이번에는 `0`·`-1`·`1`·`int64 max - 1`·`int64 max` 를 전부
      실측한다.
    - >-
      **비용 주장을 실측으로 받친다.** `SQL LIMIT` 제거가 스캔을 늘리는지 `EXPLAIN QUERY
      PLAN` 으로 대조하고 index 유무를 함께 적는다.
  invariants:
    - "`stranded()`·`unreadable()` 의 signature 와 반환 타입이 안 바뀐다."
    - "`--limit 0` 과 음수는 여전히 fail-closed 다."
    - "손상 row 를 건너뛰는 계약(`D-047`)은 그대로다 — 건너뛴 것은 `unreadable()` 이 낸다."
  non_goals:
    - 잘림 자체를 없애는 것. `D-050` 이 "없애는 대신 보이게" 로 정했다.
    - dead_letter 정리 경로 신설.

acceptance:
  behaviors:
    - id: AC-01
      given: 후보가 `limit` 을 넘고 창 안에 손상 row 가 0·1·2 개인 store.
      when: "`governance stranded --limit N` 을 부른다."
      then: 손상 개수와 무관하게 잘림 표시가 켜지고 출력이 `limit` 줄이다.
    - id: AC-02
      given: 손상 row 3개가 정렬 앞에 있는 store.
      when: "`stranded(limit=5)` 를 부른다."
      then: 손상 0개일 때와 같은 5개를 낸다. 건너뛴 셋은 `unreadable()` 이 낸다.
    - id: AC-03
      given: "`--limit` 의 양쪽 끝 다섯 값."
      when: CLI 를 부른다.
      then: raw traceback 이 없다. `0`·`-1` 은 exit 1, 나머지는 exit 0 이다.
    - id: AC-04
      given: 같은 조회의 `LIMIT` 유무 두 형태.
      when: "`EXPLAIN QUERY PLAN` 을 돌린다."
      then: 계획이 같다. index 부재를 함께 기록한다.
  commands:
    - id: targeted-cli
      kind: test
      run: .venv/bin/python -m pytest tests/test_cli.py
      required: true
    - id: targeted-ack
      kind: test
      run: .venv/bin/python -m pytest tests/test_slack_ack_boundary.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: verifier-v2
      kind: lint
      run: .venv/bin/python .ai-team/verifiers/run.py --profile v2
      required: true
    - id: diff-check
      kind: lint
      run: git diff --check
      required: true
  manual_checks:
    - id: red-then-green
      observer: 구현자
      action: 수정 전후로 같은 재현을 돌려 잘림 표시가 꺼졌다가 켜지는 것을 본다.
      expected: 수치가 evidence 의 표와 일치한다.
      reason_not_automated: 수정 전 상태는 test 로 고정할 수 없다.
  evidence:
    - type: command_output
      source: targeted-cli
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: verifier-v2
      required: true
    - type: note
      source: RED/GREEN 실측표와 EXPLAIN 대조
      required: true

risk:
  level: high
  concerns:
    - "`limit` 계약이 바뀌면 같은 `limit` 이 이전보다 많은 row 를 낸다. 그것이 의도임을 Decision 에 적었다."
    - "`LIMIT` 제거가 비용을 늘린다는 우려. `EXPLAIN` 으로 대조해 근거를 남긴다."
  approvals:
    - public_contract

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - signature_change_would_be_required
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-30T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T047.md

handoff:
  expected_changes:
    - "`_stranded_rows` 가 출력 상한으로 동작한다."
    - "`--limit` 위쪽 끝의 raw traceback 이 사라진다."
  notes:
    - "**mutation 또는 실측으로 확인하기 전에는 '고쳤다' 고 적지 않는다.**"
