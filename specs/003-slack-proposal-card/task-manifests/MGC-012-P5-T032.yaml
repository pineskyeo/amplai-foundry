schema_version: "1.0"

id: MGC-012-P5-T032
title: Normalize at the CLI boundary so neither fix reopens the raw traceback
type: fix
status: done

goal:
  outcome: >-
    두 governance command 가 어떤 store 상태에서도 `_fatal` 형태로 실패한다. read-only
    store 도, governance schema 가 아닌 파일도, 손상도 traceback 을 내지 않는다.
  user_value: >-
    round 16 이 CLI raw traceback 을 **두 갈래**로 다시 냈다. `FR-3` 은 T029 의
    `_OPEN_FAILURES` 축소가, `R16-1` 은 T028 의 `check_startup()` 제거가 원인이다. round 15
    `C-1` 이 잡은 것과 같은 모양이 서로 다른 exception 으로 되살아났다.

    **위치가 잘못됐다.** `connect()` 에서 전부 정규화하면 `legacy_*.py` 아홉 handler 가
    깨지고(round 15 `R-1`), 아무것도 정규화하지 않으면 CLI 가 traceback 을 낸다. 정규화할
    곳은 **CLI 경계**다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-16.md
      section: FR-3
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-16.md
      section: R16-1
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-16.md
      section: C16-1
  requirements:
    - FR-024
    - FR-026
    - SC-004
  decisions:
    - D-044

scope:
  include:
    - >-
      두 command 의 except tuple 에 `sqlite3.Error` 를 더한다. `FR-3`(read-only store 의
      `PRAGMA journal_mode = WAL`)과 `R16-1`(governance schema 아닌 파일의 `no such table`)이
      한 번에 닫힌다.
    - >-
      `C16-1` 의 CLI 쪽 — 읽을 수 없는 id 에 "결정 없음" 이 아니라 "알 수 없음" 을 낸다.
      `T031` 이 만드는 구분을 쓴다.
    - "잃은 schema 검증을 어떻게 다룰지 결정하고 주석에 사실대로 적는다 (`R16-1`)."
    - 세 store 상태(read-only, 비-governance schema, 정상)를 고정하는 test.
    - "`R16-6` — `--json` 거부 test 가 두 command 를 다 보게 한다."
  exclude:
    - "`store.py` 의 `_OPEN_FAILURES` 재확대. round 15 `R-1` 이 그것을 기각했다."
    - "`ingress.py`. T031 이 맡는다."
    - "`check_startup()` 재도입. round 15 `F-3`·`F-4` 가 그것을 기각했다."
    - "새 command 추가."
    - "`A16-6`(PRAGMA journal_mode 가 write 인지). Advisory 다."
  allowed_paths:
    - src/amplai_foundry/cli.py
    - tests/test_cli.py
  forbidden_paths:
    - vault/
    - .github/
    - src/amplai_foundry/governance/store.py
    - src/amplai_foundry/governance/ingress.py
    - src/amplai_foundry/governance/ingress_worker.py
    - src/amplai_foundry/governance/events.py

dependencies:
  tasks:
    - MGC-012-P5-T031
  external: []

implementation:
  guidance:
    - >-
      **두 갈래를 각각 재현한다.** `FR-3` 은 `chmod 444` 로, `R16-1` 은 governance schema 가
      아닌 sqlite 파일을 놓고 재현한다. reviewer 의 출력이
      `evidence/3lens-review-round-16.md` 에 있다.
    - >-
      **`sqlite3.Error` 를 더하는 것이 왜 여기서 옳은지 적는다.** `connect()` 에 넣으면
      아홉 legacy handler 가 깨진다 (round 15 `R-1`). CLI 는 최종 소비자라 아무도 그
      아래에서 class 를 구분하지 않는다. **경계의 위치가 판단의 핵심이다.**
    - >-
      **`sqlite3.Error` 로 충분한지 확인한다.** 세 갈래 말고 다른 store 상태가 raw 로 나갈
      수 있는지 전수로 본다 — 빈 파일, 디렉터리, 권한 없는 부모, 손상 파일. **가정하지 말고
      각각 돌려 본다.**
    - >-
      **`R16-1` 의 주석을 고친다.** 지금 주석이 "조용히 틀린 답을 내지 않는다" 로 정당화하는데
      그 대신 traceback 이 된다는 것을 안 적었다. 고친 뒤 실제 동작을 적는다.
    - >-
      **`C16-1` 은 `T031` 의 구분을 쓴다.** CLI 가 스스로 판정하지 않는다 — 두 곳에서 판정하면
      그것이 다음 형제가 된다.
    - >-
      **출력 문구를 정한다.** operator 가 "결정 없음" 과 "알 수 없음" 을 구분할 수 있어야
      한다. 후자는 `governance stranded` 의 `UNREADABLE` 과 이어져야 한다.
  invariants:
    - "두 command 가 어떤 store 상태에서도 traceback 을 내지 않는다."
    - "두 command 가 여전히 write 를 내지 않는다."
    - "출력에 raw credential 이 없다."
    - "`check_startup()` 을 다시 부르지 않는다."
    - "`store.py`, `ingress.py` 를 수정하지 않는다."
    - "정상 store 의 출력이 바뀌지 않는다 (읽을 수 없는 row 관련 문구 외)."
  non_goals:
    - store 검증 재도입.
    - governed mutation.
    - Advisory 항목.

acceptance:
  behaviors:
    - id: AC-01
      given: 착수 전 코드와 read-only store.
      when: 두 command 를 돌린다.
      then: raw traceback 이 나가는 것을 실측한다.
    - id: AC-02
      given: 착수 전 코드와 governance schema 가 아닌 sqlite 파일.
      when: 두 command 를 돌린다.
      then: raw `sqlite3.OperationalError` 가 나가는 것을 실측한다.
    - id: AC-03
      given: 소스와 여러 store 상태.
      when: 빈 파일, 디렉터리, 권한 없는 부모, 손상 파일을 각각 돌린다.
      then: 각각 무엇이 나가는지 표로 적는다. **전수로 센다.**
    - id: AC-04
      given: 고친 코드.
      when: AC-01 과 AC-02 를 다시 돌린다.
      then: 둘 다 `_fatal` 형태로 exit 1 이다. traceback 이 없다.
    - id: AC-05
      given: 고친 코드.
      when: AC-03 의 모든 상태를 다시 돌린다.
      then: 전부 `_fatal` 형태다. 하나라도 traceback 이면 finding 이다.
    - id: AC-06
      given: 고친 코드와 읽을 수 없는 row.
      when: "`governance decision <id>` 를 돌린다."
      then: >-
        "결정 없음" 과 다른 문구를 낸다. operator 가 둘을 구분할 수 있다.
    - id: AC-07
      given: 고친 코드와 정상 store.
      when: 두 command 를 돌린다.
      then: 출력이 바뀌지 않았다. write 도 여전히 0건이다.
    - id: AC-08
      given: 갱신된 주석.
      when: 읽는다.
      then: 실제 동작과 일치한다. 잃은 검증과 그 결과가 적혀 있다.
    - id: AC-09
      given: 고친 코드.
      when: except tuple 에서 `sqlite3.Error` 를 뺀다.
      then: test 가 실패한다.
    - id: AC-10
      given: 전체 test suite.
      when: 돌린다.
      then: 실패가 없다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_cli.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01 과 AC-02 의 착수 전 재현
      required: true
    - type: note
      source: AC-03 의 store 상태 전수 표
      required: true
    - type: note
      source: CLI 경계에서 정규화하는 이유
      required: true

risk:
  level: medium
  concerns:
    - >-
      `sqlite3.Error` 를 더해도 다른 class 가 남을 수 있다. AC-03 의 전수가 그것을 막는다.
    - >-
      경계를 CLI 로 옮기는 판단이 세 번째다. 두 번 틀렸으므로 이번에는 전수로 확인하고
      근거를 적는다.
  approvals: []

loop:
  max_attempts: 3
  replan_after_same_failure: 2
  stop_conditions:
    - a_store_state_still_produces_a_traceback_after_the_fix
    - the_fix_would_require_touching_store_py
    - scope_boundary_must_expand

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-18T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T032.md

handoff:
  expected_changes:
    - "두 command 의 except tuple 에 `sqlite3.Error` 추가."
    - "읽을 수 없는 id 에 '알 수 없음' 출력."
    - "주석을 실제 동작에 맞춤."
  notes:
    - >-
      **경계의 위치가 요점이다.** `connect()` 는 너무 낮고(legacy handler 아홉이 깨진다)
      command 안은 너무 좁다(class 마다 다시 샌다). CLI 가 최종 소비자다.
