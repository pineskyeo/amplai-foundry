title: Deliver one governed Review Card with recoverable action sets
type: feature
status: done

goal:
  outcome: One reviewed Proposal snapshot produces at most one usable Slack Review Card bound to one reviewer, channel, and 24-hour action set across retries and restarts.
  user_value: The designated reviewer can understand and decide the Proposal without weakening one-time authorization or creating duplicate Cards.

