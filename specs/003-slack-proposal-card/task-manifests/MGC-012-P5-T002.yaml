  external: []

implementation:
  guidance:
    - Add one migration after current schema version 30 and exact verify_schema coverage.
    - Keep raw credentials inside PreparedReviewActionSet and make its repr and serialization unavailable or redacted.
    - Call action-set prepare only after remote absence is confirmed by existing reconcile semantics.
    - Use the existing DecisionService authority and ActionToken checks rather than copying them.
  invariants:
    - Durable state contains token IDs and hashes but no raw credential.
    - One outbox event has at most one issued action-set generation.
    - Replacement revokes the old generation before issuing the next generation in one transaction.
    - Remote ambiguity never creates a replacement Card.
    - Review payload includes titles and counts only, with no reason, evidence, draft content, or path.
    - One successful action revokes unresolved sibling tokens.
    - One snapshot cannot create another Review Card by changing reviewer or Slack channel.
    - Slack destination sequencing is channel-wide while source revisions remain Proposal-scoped.
    - A provider response channel mismatch revokes the prepared action set and enters a hold.
    - Cleanup is generation-bound so a stale attempt cannot revoke a newer replacement.
    - Transport, destination, and dispatcher delivery budgets are bound before an event is claimed.
  non_goals:
    - General-purpose write API or new authority model.
    - Response URL persistence, message editing, or interaction endpoint hosting.
    - Production rollout or more than one designated reviewer.

acceptance:
  behaviors:
    - id: AC-01
      given: A reviewed Proposal, one bound Slack reviewer with current decision permission, and a stable definition.
      when: ReviewCardService receives a new idempotent request.
      then: It records one secret-free command, audit event, and Slack outbox event containing bounded operation counts and the first three titles.
    - id: AC-02
      given: A first Review Card delivery attempt.
      when: The destination prepares and sends the Card.
      then: Three 24-hour action-specific tokens are issued atomically and exactly three confirmed buttons are posted without persisting raw values.
    - id: AC-03
      given: Tokens were issued but remote acceptance did not occur and the process lost their raw values.
      when: Retry reconciliation confirms the Card is absent.
      then: The prior generation is revoked and one fresh generation is issued before one replacement post.
    - id: AC-04
      given: Slack accepted the Review Card but local receipt persistence did not complete.
      when: A restarted worker retries.
      then: Marker reconciliation returns the existing receipt, keeps its token generation usable, and posts no duplicate.
    - id: AC-05
      given: Reconciliation cannot prove presence or absence.
      when: The delivery attempt runs.
      then: It enters the existing fail-closed hold path without changing action generations or posting a replacement.
    - id: AC-06
      given: SQLite rows, exception text, repr output, captured logs, and test output from every recovery boundary.
      when: A raw-token canary scan runs.
      then: The canary is absent from every durable and diagnostic surface.
    - id: AC-07
      given: A Review Card command already exists for one immutable Proposal snapshot.
      when: Another authorized request changes reviewer or Slack channel.
      then: It is rejected without another command, outbox event, Card, or action set.
    - id: AC-08
      given: Slack reports accepting a Review Card in a channel other than the configured destination.
      when: Delivery validates the provider response.
      then: The action set is revoked and the event enters a secret-free hold without a replacement.
    - id: AC-09
      given: A stale delivery attempt prepared generation 1 and a reclaimed attempt already issued generation 2.
      when: The stale attempt reaches terminal cleanup.
      then: Cleanup targets generation 1 only and generation 2 remains issued.
    - id: AC-10
      given: Transport, destination, and dispatcher page, lease, or attempt budgets differ.
      when: The worker is wired or begins delivery.
      then: Construction or pre-claim validation rejects the mismatch and the outbox event remains pending with zero attempts.
  commands:
    - id: focused-tests
      kind: test
      run: .venv/bin/python -m pytest tests/test_review_cards.py tests/test_decisions.py tests/test_governance_events.py tests/test_governance_migrations.py tests/test_governance_store.py tests/test_slack_cards.py tests/test_slack_projection.py
      required: true
    - id: schema-check
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli schema check
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check src/amplai_foundry/governance tests/test_review_cards.py tests/test_decisions.py tests/test_governance_events.py tests/test_governance_migrations.py tests/test_slack_cards.py tests/test_slack_projection.py
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy src
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: focused-tests
      required: true
    - type: command_output
      source: schema-check
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: mypy
      required: true

risk:
  level: high
  concerns:
    - Migration and audit integrity affect durable governance state.
    - Crash recovery around authority-bearing button values can leak or duplicate usable Cards.
    - Token replacement must not revoke credentials for a remotely accepted Card.
  approvals:
    - User approved the grilled one-reviewer, 24-hour, no-durable-raw design on 2026-08-12.
    - Repository governed-mutation and independent-review gates remain mandatory.

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - schema_migration_requires_rewriting_existing_history
    - raw_credential_requires_durable_storage
    - remote_reconciliation_cannot_precede_replacement
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

