scope:
  include:
    - Schema versions 31-32 for immutable Review Card command, one-snapshot uniqueness, and secret-free action-set generations.
    - Idempotent reviewed-snapshot request service with reviewer authority and operation-safe projection.
    - Audit/outbox integrity for one Slack ReviewProjectionPayload.
    - Transaction-scoped action-token issue, sibling revoke, and replacement generation handling.
    - Review Card renderer with exact confirmed actions and recovery-aware Slack delivery.
    - Crash, retry, race, expiry, stale snapshot, and credential leak tests.
  exclude:
    - New Proposal submit API or automatic submit-and-card transaction.
    - Multi-reviewer, quorum, modal reason, message update/delete, or production server.
    - Human-readable terminal interaction feedback.
  allowed_paths:
