schema_version: "1.0"

id: MGC-012-P5-T018
title: Pin every component of the review card audit comparison, not the ones a review named
type: test
status: done

goal:
  outcome: >-
    review Card 감사 대조의 **모든** 성분이 test 로 고정된다. 어느 하나를 지워도 test 가
    실패한다. 성분을 열거한 목록이 evidence 에 남아 다음 라운드가 세 볼 수 있다.
  user_value: >-
    이 대조는 governed mutation 이 자기가 기록한 감사와 맞는지 보는 무결성 관문이다. 성분
    하나가 빠져도 오늘은 동작이 맞지만, 그 성분을 건드리는 다음 변경이 조용히 통과한다.
    감사가 틀린 채로 통과하면 그 뒤 모든 판단의 근거가 무너진다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-13.md
      section: F-4
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-12.md
      section: RL-3
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-12.md
      section: RL-5
  requirements:
    - FR-013
    - FR-015
    - FR-021
    - SC-003
  decisions:
    - D-038

scope:
  include:
    - >-
      `events.py:1253-1264` 의 review Card 감사 대조 `if` 에 들어가는 **모든** 성분의 회귀
      test. round 13 `F-4` 가 지목한 `definition_digest`(`:1261`)와
      `destination_manifest_digest`(`:1262`)를 포함한다.
    - >-
      **범위 확정 (2026-08-17, 사용자 결정).** 착수하며 전수 측정하니 같은 함수
      `reconcile_connection()` 안에 형제 대조 블록이 **8개 더** 있고 성분이 합쳐 69개,
      그중 **66개가 무방비**였다. `F-4` 가 지목한 둘은 그 66 중 둘이다.
      이 task 는 `F-4` 의 블록(`events.py:1255-1263`, review Card 감사) 하나를 전수
      고정한다. 나머지 8블록 60성분은 `MGC-012-P5-T020` 으로 등재해 다음 wave 로 넘긴다.
      **조용히 줄이지 않는다** — 실측 수치와 위치 목록을 evidence 와 index 에 남긴다.
  exclude:
    - "`src/` 수정. 이 task 는 회귀 방어만 추가한다."
    - "두 cardinality guard 의 0 방향 (round 13 `N16`/`N17`). Advisory 이고 이번 wave 밖이다."
    - "outcome → 사용자 문구 mapping (round 13 `N24`). Advisory 이고 이번 wave 밖이다."
    - "migration 관련 guard. MGC-012-P5-T014 가 이미 닫았다."
    - >-
      `reconcile_connection()` 의 나머지 8개 감사 대조 블록(`events.py` L1481, L1558, L1712,
      L1796, L1876, L1960, L2114). MGC-012-P5-T020 이 맡는다.
    - "`ingress_worker.py`, `slack_http.py`. 각각 T016, T015 가 맡는다."
  allowed_paths:
    - tests/test_governance_events.py
    # **scope 확장 (2026-08-17, 착수 중 발견).** 이 감사 대조의 기존 회귀 test 는
    # `test_governance_events.py` 가 아니라 여기 있다 — round 12 `RL-3`~`RL-5` 가 그렇게
    # 넣었다. manifest 가 그 사실을 모른 채 작성됐다.
    - tests/test_review_cards.py
  forbidden_paths:
    - vault/
    - src/
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **성분을 먼저 센다.** `events.py:1253-1264` 의 `if` 는 `or` 로 이어진 비교의 나열이다.
      현재 성분은 `event_type`, `proposal_ref`, `actor_id`, `actor_type`, `before_state`,
      `after_state`, `definition_digest`, `destination_manifest_digest`, `destination_count`
      다. **직접 세어 확인한다** — 이 목록이 낡았을 수 있다. 센 결과를 evidence 에 적는다.
    - >-
      **지목받은 것만 고정하지 않는다. 그것이 이 결함의 뿌리다.** round 12 가 `RL-3`~`RL-5` 로
      성분 셋을 지목하고 **공통 뿌리로 명시**했는데, wave 6 은 그 셋만 고정하고 같은 `if` 의
      나머지를 열거하지 않았다. round 13 `F-4` 가 남은 둘을 다시 잡았다. 이번에는 **전수**다.
    - >-
      **이미 고정된 성분과 아닌 것을 구분해 기록한다.** 성분마다 하나씩 지워서 전 suite 를
      돌린다. 통과하면 무방비다. 지금 무방비인 성분 목록을 먼저 실측으로 만들고 시작한다.
    - >-
      **같은 함수 안에 형제 대조가 있는지 본다.** `:1268` 아래 `action_rows` 를 읽는 블록에도
      비슷한 대조가 있을 수 있다. 있으면 그 성분도 전수 센다. 규칙은 "정의 사본 + 호출 지점 +
      **같은 검사의 모든 성분**" 이다.
    - >-
      test 는 성분마다 **다른 성분이 먼저 걸리지 않는** 입력을 써야 한다. `or` 나열이므로 앞
      성분이 먼저 참이 되면 겨냥한 성분을 고정한 것이 아니다. 각 실험에서 어느 성분이 걸렸는지
      실패 사유로 확인한다. MGC-012-P5-T014 의 AC-04 가 같은 함정을 다뤘다.
    - >-
      **fixture 가 검사 대상을 먼저 없애는지 본다.** `PBC-1` 이 세 라운드 연속 나왔다.
      감사 row 를 만드는 helper 가 겨냥한 성분을 이미 정규화하고 있으면 test 는 구조상
      통과한다.
    - >-
      **mutation 이 살아남으면 코드보다 test 를 먼저 의심한다.** wave 6 에서 그렇게 진짜
      결함을 찾았다.
  invariants:
    - "`src/` 는 수정하지 않는다."
    - "기존 감사 event schema 와 저장 형식이 바뀌지 않는다."
    - "신규 test 가 실제 vault 나 사용자 데이터를 건드리지 않는다."
    - "기존 test 를 지우지 않는다."
  non_goals:
    - 감사 대조 로직 변경.
    - 새 감사 성분 추가.
    - "cardinality guard 의 0 방향 (Advisory)."

acceptance:
  behaviors:
    - id: AC-01
      given: 대상 `if` 의 성분 목록.
      when: 소스에서 전수 열거한다.
      then: >-
        성분 이름과 줄 번호를 evidence 에 표로 적는다. 개수를 명시한다. **이 표가 이 task 의
        완결 기준이다.**
    - id: AC-02
      given: AC-01 의 표.
      when: 각 성분을 하나씩 비교에서 제거하고 전 suite 를 돌린다.
      then: 모든 성분에 대해 적어도 하나의 test 가 실패한다.
    - id: AC-03
      given: AC-02 의 각 실험.
      when: 실패 사유를 확인한다.
      then: >-
        겨냥한 성분이 걸려 실패했음을 보인다. `or` 나열의 다른 성분이 먼저 걸린 경우는
        고정으로 세지 않는다.
    - id: AC-04
      given: AC-02 를 시작하기 전 상태.
      when: 같은 실험을 미리 한 번 돌린다.
      then: >-
        시작 시점에 무방비였던 성분 목록을 evidence 에 적는다. round 13 `F-4` 가 지목한 둘이
        그 안에 있음을 확인한다.
    - id: AC-05
      given: 같은 함수의 다른 감사 대조 블록.
      when: 전수 열거한다.
      then: >-
        존재 여부를 evidence 에 적는다. 있으면 그 성분도 AC-02 와 AC-03 을 통과한다. 없으면
        없음을 근거와 함께 적는다.
    - id: AC-06
      given: 신규 test.
      when: 아무것도 바꾸지 않고 돌린다.
      then: 모두 통과한다.
    - id: AC-07
      given: 전체 test suite.
      when: 아무것도 바꾸지 않고 돌린다.
      then: round 13 기준(1274 passed, 4 deselected) 이상으로 통과하고 실패가 없다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_governance_events.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01 의 성분 전수 표 (이름, 줄 번호, 개수)
      required: true
    - type: note
      source: AC-04 의 시작 시점 무방비 성분 목록
      required: true
    - type: note
      source: AC-02/AC-03 의 성분별 실패한 test 이름과 실패 사유
      required: true
    - type: note
      source: AC-05 의 형제 대조 블록 조사 결과
      required: true

risk:
  level: medium
  concerns:
    - >-
      `or` 나열에서 다른 성분이 먼저 걸리면 고정을 잘못 주장하게 된다. MGC-012-P5-T014 가
      같은 함정을 만났다.
    - >-
      성분을 세는 일 자체를 대충 하면 이 task 가 세 번째로 같은 결함을 남긴다. round 12 와
      round 13 이 이미 두 번이다.
  approvals: []

loop:
  max_attempts: 4
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - component_appears_unreachable_without_src_change
    - src_change_would_be_required
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-17T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T018.md

handoff:
  expected_changes:
    - 감사 대조 성분 전수의 회귀 test.
  notes:
    - >-
      실제 동작 결함이 아니다. 회귀 방어 부재다. 다만 **같은 결함 class 가 두 라운드 연속
      재발했으므로** 전수 열거를 acceptance 로 명시했다.
