schema_version: "1.0"

id: MGC-012-P5-T006
title: Hold the remaining renderer, payload and integrity guards with tests
type: test
status: done

goal:
  outcome: >-
    renderer 거부 나머지 5종, payload 검증 계층, 무결성 대조와 bound·cardinality guard 가
    각각 test 로 고정된다.
  user_value: >-
    `events.py` 는 mutation 6종 중 0종만 잡혔다. 이 계층 전체가 회귀로부터 무방비다.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review.md
      section: C-2b, C-4, C-6, C-8, C-9, C-11, C-13
    - path: specs/003-slack-proposal-card/contracts/slack-card-payloads.md
      section: Validation
    - path: specs/003-slack-proposal-card/data-model.md
      section: Review Projection Payload, Integrity Checks
  requirements:
    - FR-003
    - FR-005
    - FR-006
    - FR-007
    - FR-015
    - FR-020
    - SC-003
    - SC-006
  decisions: []

scope:
  include:
    - 미지원 result status 거부 test.
    - action set count, action 집합, expires_at binding, project identity 한도 거부 test.
    - ReviewProjectionPayload 의 non-Slack channel 거부 test.
    - operation_count 합계와 remaining_operation_count invariant 위반 거부 test.
    - review card replay fingerprint 불일치 거부 test.
    - _review_body 최종 절단 경계 test.
    - REVIEW_CARD_ROOT_MISMATCH 와 REVIEW_CARD_AUDIT_MISMATCH 의 성분별 대조 test. audit event 가 2개 이상인 경우를 포함한다.
    - outbox cardinality 와 token consume rowcount guard test.
  exclude:
    - 위 guard 의 구현 변경.
    - P0 등급 다섯. MGC-012-P5-T005 가 맡는다.
    - 도달 불가로 판명된 branch 의 처리. MGC-012-P5-T007 이 맡는다.
  allowed_paths:
    - tests/test_slack_cards.py
    - tests/test_review_cards.py
    - tests/test_governance_events.py
    - tests/test_governance_store.py
    - tests/test_decisions.py
    - tests/test_slack_projection.py
  forbidden_paths:
    - src/amplai_foundry/
    - vault/
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - 현재 `tests/test_slack_cards.py` 에 render_review test 가 하나도 없다. 거부 test 의 자리는 거기다.
    - 무결성 대조는 성분을 하나씩 어긋나게 만들어야 의미가 있다. 전체를 어긋나게 하면 어느
      성분이 잡았는지 구분되지 않는다.
    - audit cardinality 는 0건이 아니라 2건 이상인 경우가 비어 있다.
    - reason code `result_identity_exceeds_body_limit` 의 도달 가능성이 확인되지 않았다. 도달
      불가로 밝혀지면 test 대신 그 사실을 기록하고 MGC-012-P5-T007 로 넘긴다.
  invariants:
    - 이 task 는 src/ 를 수정하지 않는다.
    - 기존 test 를 삭제하거나 약화하지 않는다.
    - 도달 불가 branch 에 도달하는 척하는 test 를 만들지 않는다.
  non_goals:
    - 구현 결함 수정.
    - 계약 문서 변경.

acceptance:
  behaviors:
    - id: AC-01
      given: 미지원 result status, 정확히 3개가 아닌 action set, 계약과 다른 action 집합, payload 와 다른 expires_at, 한도를 넘는 project identity.
      when: Card 를 렌더한다.
      then: 각 경우가 개별적으로 거부된다.
    - id: AC-02
      given: Slack 이 아닌 channel 을 가진 review projection payload.
      when: payload 를 만든다.
      then: 거부된다.
    - id: AC-03
      given: operation_count 가 operation_counts 합과 다른 payload, 그리고 remaining_operation_count 가 규칙과 다른 payload.
      when: payload 를 만든다.
      then: 각각 거부된다.
    - id: AC-04
      given: 같은 key 에 다른 fingerprint 를 가진 review card 재요청.
      when: 요청을 처리한다.
      then: 충돌로 거부되고 새 action set 이 발급되지 않는다.
    - id: AC-05
      given: 최종 절단 한도를 넘는 review body 입력.
      when: Card 를 렌더한다.
      then: 결과가 한도 안으로 잘리고 필수 식별 항목이 남는다.
    - id: AC-06
      given: command row 의 payload_json 만 어긋난 상태, audit 의 actor_id 만 어긋난 상태, audit event 가 2건인 상태.
      when: governance event 무결성을 검사한다.
      then: 각 경우가 해당 mismatch 로 거부된다.
    - id: AC-07
      given: outbox row 가 정확히 1건이 아닌 상태, 그리고 token consume 이 정확히 1행을 바꾸지 않은 상태.
      when: 각 경로를 실행한다.
      then: 각각 거부된다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_slack_cards.py tests/test_review_cards.py tests/test_governance_events.py tests/test_governance_store.py tests/test_decisions.py tests/test_slack_projection.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true

risk:
  level: low
  concerns:
    - 일부 guard 가 도달 불가일 수 있다. 억지로 도달시키는 test 는 거짓 안전감을 준다.
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - test_would_require_changing_src
    - guard_is_proven_unreachable
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-13T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T006.md

handoff:
  expected_changes:
    - tests/ 아래 renderer 거부, payload 검증, 무결성 대조, bound·cardinality test.
  notes:
    - 도달 불가로 판명된 guard 는 test 를 만들지 말고 그 사실을 기록해 T007 로 넘긴다.
    - AC-06 의 성분 대조 둘과 AC-07 의 outbox·consume cardinality 는 test 를 만들지 않았다.
      대조 대상 durable row 가 immutability trigger 와 UNIQUE 제약으로 보호돼 application
      입력으로 그 전제를 만들 수 없다. 근거는 evidence 의 Unreachable From Application Input
      절에 있다. 미해결 판정은 MGC-012-P5-T008 로 넘긴다.
    - round 10 의 C-13(P1) 은 과대평가였다. `_review_body` 의 최종 절단은 `_text_object` 와
      중복이고 rendered body 한도는 유지된다. 근거는 evidence 에 있다.
