schema_version: "1.0"

id: MGC-012-P5-T031
title: Make the dead-letter loop terminate, guard the write, and stop conflating unknown with absent
type: fix
status: done

goal:
  outcome: >-
    `claim_next` 의 dead-letter loop 가 진행을 보장하고, 그 write 가 다른 worker 의 살아
    있는 lease 를 건드리지 않으며, write 가 실패해도 큐가 `D-045` 가 거절한 상태로 돌아가지
    않는다. 그리고 "읽을 수 없다" 가 "결정이 없다" 로 뭉개지지 않는다.
  user_value: >-
    round 16 blocker 넷이 `T027` 이 넣은 구조 하나에서 나왔다. `while True` + transaction 밖
    write 를 도입하면서 그 구조가 요구하는 넷을 안 채웠다 — 진행 보장(`rowcount`), 경합
    guard(`state`/`claim_generation`), write 실패 처리, 그리고 "모른다" 와 "없다" 의 구분.

source:
  feature: MGC-012-P5
  files:
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-16.md
      section: S-1
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-16.md
      section: FR-1
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-16.md
      section: FR-2
    - path: specs/003-slack-proposal-card/evidence/3lens-review-round-16.md
      section: C16-1
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-045
  requirements:
    - FR-024
    - FR-026
    - SC-004
  decisions:
    - D-045

scope:
  include:
    - >-
      **`S-1` (P0)** — dead-letter write 가 실제로 row 를 바꿨는지 확인하고, 안 바꿨으면
      loop 를 돌지 않는다. `rowcount` 를 본다.
    - >-
      **`FR-1`** — UPDATE 에 `state` 와 `claim_generation` guard 를 건다. 읽을 수 없다고
      판정한 그 세대의 그 상태일 때만 바꾼다. 다른 worker 가 정상 claim 했으면 건드리지
      않는다.
    - >-
      **`FR-2`** — dead-letter write 가 실패해도 raw 예외가 `claim_next` 를 뚫지 않는다.
      poison row 가 `pending` 에 남는 상태로 되돌아가지 않게 한다.
    - >-
      **`C16-1`** — 읽을 수 없는 row 를 "결정 없음" 과 구분한다. `get()` 의 signature 를
      바꿀지, 별도 조회를 쓸지 정하고 근거를 적는다. **계약이 요구하는 구분이다** —
      `contracts/interaction-feedback.md:48-51` 이 "we know a decision landed" 와 "we cannot
      tell" 을 나눈다.
    - loop 종료성, 경합, write 실패, 구분 넷을 각각 고정하는 test.
  exclude:
    - "`cli.py`. MGC-012-P5-T032 가 맡는다."
    - "`store.py`. MGC-012-P5-T033 이 맡는다."
    - "`D-045` 의 정책 변경. dead-letter 로 치우는 판단 자체는 유지한다."
    - "`FR-5`(ChannelRef extra key)와 `FR-4`(accept frame credential). Advisory 이고 별건이다."
    - "`R16-4`(limit 의미)와 `R16-5`(두 snapshot). Advisory 다."
  allowed_paths:
    - src/amplai_foundry/governance/ingress.py
    - tests/test_slack_ack_boundary.py
    - tests/test_ingress.py
  forbidden_paths:
    - vault/
    - .github/
    - src/amplai_foundry/cli.py
    - src/amplai_foundry/governance/store.py
    - src/amplai_foundry/governance/ingress_worker.py
    - src/amplai_foundry/governance/events.py

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - >-
      **넷을 각각 재현하고 시작한다.** `S-1` 은 이미 재현됐다 (50회 초과). `FR-1` 은
      reviewer 가 `_dead_letter_unreadable` 를 지연시켜 재현했고 `completed` 변형에서
      `IntegrityError` 까지 봤다. `FR-2` 는 claim 뒤 `connect()` 를 실패시켜 재현했다.
      **셋 다 직접 다시 만든다.**
    - >-
      **loop 의 종료 조건을 명시한다.** `rowcount != 1` 이면 무엇을 하는가. 그 row 를 이미
      다른 worker 가 처리한 것일 수도 있고, 사라진 것일 수도 있다. 어느 쪽이든 **같은 row 를
      다시 뽑는 loop 를 돌면 안 된다.** 반복 상한을 둘지, 처리한 id 를 기억할지 정하고
      근거를 적는다.
    - >-
      **guard 를 걸면 `rowcount` 가 0 이 되는 정상 경우가 생긴다.** 다른 worker 가 그 사이
      claim 했으면 그것이 옳은 결과다. 그 경우를 실패로 다루지 않는다 — 그냥 다음으로 간다.
      **두 경우(정상 경합 vs 진짜 이상)를 구분할 수 있는지 보고 근거를 적는다.**
    - >-
      **`FR-2` 를 고칠 때 D-045 의 약속을 지킨다.** "큐가 풀리고 손상 row 가 operator 에게
      보인다" 다. write 가 실패하면 그 약속을 못 지키는데, 그때 무엇을 할지 정한다 — 예외를
      호출자가 아는 형으로 닫을지, 그 호출만 포기하고 다음 claim 을 시도할지.
      **조용히 넘어가지 않는다.**
    - >-
      **`C16-1` 은 계약을 먼저 읽는다.** `interaction-feedback.md:47-54` 가 "we cannot tell"
      을 `D-042` 의 침묵 근거로 쓴다. 같은 구분이 operator 조회에도 있어야 한다.
      `get()` 을 바꾸면 caller 가 하나뿐이라 (`ingress_worker.py:310`) 파급이 작다 —
      **그것을 확인하고 정한다.**
    - >-
      **정상 경로를 다시 잰다.** guard 를 걸면 정상 dead-letter 가 안 될 수 있다.
      `T027` 의 여섯 test 가 전부 통과해야 한다.
  invariants:
    - "손상 row 하나로 `claim_next` 가 무한히 돌지 않는다."
    - "다른 worker 의 살아 있는 lease 를 지우지 않는다."
    - "`IntegrityError` 가 `claim_next` 밖으로 나가지 않는다."
    - "dead-letter write 실패가 raw 로 나가지 않는다."
    - "읽을 수 없는 row 가 '결정 없음' 으로 보고되지 않는다."
    - "`T027` 의 여섯 test 가 전부 통과한다."
    - "정상 claim 경로가 바뀌지 않는다."
    - "`cli.py`, `store.py`, `ingress_worker.py` 를 수정하지 않는다."
  non_goals:
    - dead letter 해제.
    - D-045 정책 변경.
    - Advisory 항목.

acceptance:
  behaviors:
    - id: AC-01
      given: 착수 전 코드.
      when: dead-letter UPDATE 가 0행을 바꾸게 만들고 `claim_next` 를 부른다.
      then: 무한히 도는 것을 실측한다. 반복 횟수를 적는다.
    - id: AC-02
      given: 착수 전 코드.
      when: claim rollback 과 write 사이에 다른 worker 가 정상 claim 하게 만든다.
      then: >-
        살아 있는 lease 가 지워지고 그 worker 의 `complete()` 가 실패하는 것을 실측한다.
    - id: AC-03
      given: 착수 전 코드, row 가 그 사이 `completed` 가 된 경우.
      when: 같은 창을 만든다.
      then: "`IntegrityError` 가 `claim_next` 밖으로 나가는 것을 실측한다."
    - id: AC-04
      given: 착수 전 코드.
      when: dead-letter write 의 `connect()` 를 실패시킨다.
      then: >-
        예외가 밖으로 나가고 poison 이 `pending` 에, healthy 가 claim 안 된 채 남는 것을
        실측한다.
    - id: AC-05
      given: 고친 코드.
      when: AC-01 을 다시 돌린다.
      then: 유한 회 안에 끝난다. 종료 조건과 반복 상한을 evidence 에 적는다.
    - id: AC-06
      given: 고친 코드.
      when: AC-02 를 다시 돌린다.
      then: >-
        다른 worker 의 lease 가 유지되고 그 `complete()` 가 성공한다. dead-letter write 는
        아무 행도 안 바꾼다.
    - id: AC-07
      given: 고친 코드.
      when: AC-03 을 다시 돌린다.
      then: "`IntegrityError` 가 나가지 않는다."
    - id: AC-08
      given: 고친 코드.
      when: AC-04 를 다시 돌린다.
      then: >-
        raw 예외가 나가지 않는다. 큐 상태와 operator 가시성을 적고, `D-045` 의 약속을 지키는지
        판정한다.
    - id: AC-09
      given: 고친 코드와 읽을 수 없는 row.
      when: 결정 여부를 조회한다.
      then: >-
        "결정 없음" 이 아니라 **"알 수 없음"** 으로 구분된다. 계약의 두 경우와 대조한다.
    - id: AC-10
      given: 고친 코드.
      when: "`T027` 의 여섯 test 를 돌린다."
      then: 전부 통과한다.
    - id: AC-11
      given: 고친 코드.
      when: 네 수정을 각각 되돌리는 mutation 을 돌린다.
      then: 각각 적어도 하나의 test 가 죽는다.
    - id: AC-12
      given: 전체 test suite.
      when: 돌린다.
      then: round 16 기준(1370 passed, 4 deselected) 이상으로 통과하고 실패가 없다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_ingress.py tests/test_slack_ack_boundary.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true
    - type: note
      source: AC-01~AC-04 의 착수 전 재현 넷
      required: true
    - type: note
      source: loop 종료 조건의 선택 근거
      required: true
    - type: note
      source: AC-09 의 계약 대조
      required: true

risk:
  level: high
  concerns:
    - >-
      guard 를 걸면 정상 dead-letter 가 안 되는 경우가 생길 수 있다. `T027` 의 여섯 test 가
      그 회귀를 잡는다.
    - >-
      loop 종료 조건을 잘못 잡으면 poison row 가 다시 안 치워진다. round 15 P0 로 되돌아간다.
    - >-
      `get()` signature 를 바꾸면 caller 가 영향받는다. 하나뿐임을 확인하고 정한다.
  approvals:
    - >-
      `D-045` 의 정책(읽을 수 없는 row 를 dead-letter 하고 operator 에게 보인다)은 유지한다.
      이 task 는 그 정책의 구현이 요구하는 것을 채우는 것이라 새 Decision 이 필요하지 않다.

loop:
  max_attempts: 4
  replan_after_same_failure: 3
  stop_conditions:
    - a_guard_would_prevent_a_legitimate_dead_letter
    - the_loop_cannot_be_bounded_without_changing_D_045
    - distinguishing_unknown_from_absent_needs_a_contract_change
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-18T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T031.md

handoff:
  expected_changes:
    - "`_dead_letter_unreadable` 이 `rowcount` 를 보고 guard 를 건다."
    - "`claim_next` loop 가 유한하다."
    - "dead-letter write 실패가 닫힌다."
    - "읽을 수 없는 row 가 '결정 없음' 과 구분된다."
  notes:
    - >-
      **P0 이다.** 그리고 그 P0 는 round 15 의 P0 를 고치다 내가 만든 것이다. 새 구조를
      넣을 때 그 구조가 요구하는 것을 세지 않았다.
