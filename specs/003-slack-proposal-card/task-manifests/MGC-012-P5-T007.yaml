schema_version: "1.0"

id: MGC-012-P5-T007
title: Align the safe outcome contract and reference docs to the implemented behavior
type: docs
status: done

goal:
  outcome: >-
    계약, spec, data-model 이 실제 구현과 일치하고 producer 없는 도달 불가 값이 API 에서
    사라진다.
  user_value: >-
    지금은 계약이 `completed` 를 worker 출력으로 선언하는데 코드는 만들지 않는다. 다음
    사람이 "이미 보내고 있다"로 읽거나 producer 를 붙여 이중 통지를 만든다.

source:
  feature: MGC-012-P5
  files:
    - path: docs/workstreams/messenger-governance-closure-v3/DECISIONS.md
      section: D-034
    - path: specs/003-slack-proposal-card/evidence/3lens-review.md
      section: C-7, A-1, A-7, A-8
    - path: specs/003-slack-proposal-card/contracts/interaction-feedback.md
      section: Safe Outcomes, Delivery
    - path: specs/003-slack-proposal-card/spec.md
      section: FR-024
  requirements:
    - FR-024
  decisions:
    - D-034

scope:
  include:
    - safe outcome mapping table 에서 `completed` 행을 뺀다.
    - 같은 table 에서 `unavailable` 의 retry 조항을 뺀다.
    - spec.md FR-024 의 대상 목록에서 accepted 를 뺀다.
    - SafeInteractionOutcome.COMPLETED enum 값과 도달 불가 message 를 지운다.
    - 성공 통지를 Result Card 가 담당한다는 것을 mapping table 의 근거로 승격한다.
    - data-model.md 의 Review Card Command column 목록에 provider_installation_ref 를 추가한다.
    - 도달 불가로 확인된 branch 를 제거하거나 도달 가능성 근거를 기록한다.
  exclude:
    - 코드 동작 변경. safe outcome 생성 정책은 그대로다.
    - Result Card 경로 변경.
    - 새 safe outcome 값 추가.
  allowed_paths:
    - specs/003-slack-proposal-card/contracts/interaction-feedback.md
    - specs/003-slack-proposal-card/spec.md
    - specs/003-slack-proposal-card/data-model.md
    - src/amplai_foundry/governance/ingress_worker.py
    - src/amplai_foundry/governance/slack_http.py
    - src/amplai_foundry/governance/slack_cards.py
    - tests/test_slack_ack_boundary.py
    - tests/test_slack_cards.py
  forbidden_paths:
    - vault/
    - src/amplai_foundry/memory/
    - src/amplai_foundry/proposals/apply.py
    - src/amplai_foundry/cli.py
    - .github/

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - D-034 가 방향을 확정했다. 계약과 spec 을 코드에 맞춘다. 반대 방향은 Result Card 와
      이중 통지가 되므로 택하지 않는다.
    - 계약 문서 `interaction-feedback.md` 의 Delivery 절이 이미 성공 경로를 Result Card 로
      재배치하고 있다. 그 문장이 mapping table 의 근거가 되도록 위치를 올린다.
    - enum 값 제거는 코드 변경이지만 동작 변경이 아니다. producer 가 없으므로 도달하는
      경로가 없다. 제거 후 남은 safe outcome 매핑이 그대로인지 test 로 확인한다.
    - 도달 불가 branch 는 지우기 전에 도달 불가임을 근거와 함께 확인한다. 근거가 서지 않으면
      지우지 말고 test 를 요구하는 항목으로 T006 에 되돌린다.
  invariants:
    - denied, expired, stale, already_completed 의 safe outcome 매핑은 그대로 유지된다.
    - 성공한 결정은 여전히 Result Card 를 정확히 1건 만든다.
    - 내부 예외 문구가 사용자에게 노출되지 않는다.
    - 이 task 는 새 safe outcome 을 만들지 않는다.
  non_goals:
    - test 공백 회수.
    - 구현 결함 수정.

acceptance:
  behaviors:
    - id: AC-01
      given: 갱신된 safe outcome mapping table.
      when: table 의 각 행을 코드의 생성 경로와 대조한다.
      then: 모든 행에 실제 producer 가 있고 producer 없는 행이 남지 않는다.
    - id: AC-02
      given: 갱신된 spec.md FR-024.
      when: 나열된 대상을 코드가 만드는 safe outcome 집합과 대조한다.
      then: 둘이 일치한다.
    - id: AC-03
      given: SafeInteractionOutcome enum 과 message table.
      when: 각 값의 producer 를 저장소 전체에서 찾는다.
      then: producer 없는 값과 도달 불가 message 가 남아 있지 않다.
    - id: AC-04
      given: 성공한 결정.
      when: 결정을 처리한다.
      then: Result Card 가 정확히 1건 만들어지고 별도 성공 feedback 이 발송되지 않는다.
    - id: AC-05
      given: 갱신된 data-model.md 의 Review Card Command column 목록.
      when: schema verifier 의 expected column 과 대조한다.
      then: 둘이 일치한다.
  commands:
    - id: targeted
      kind: test
      run: .venv/bin/python -m pytest tests/test_slack_ack_boundary.py tests/test_slack_cards.py tests/test_review_cards.py
      required: true
    - id: full-pytest
      kind: test
      run: .venv/bin/python -m pytest
      required: true
    - id: schema-check
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli schema check
      required: true
    - id: ruff-check
      kind: lint
      run: .venv/bin/python -m ruff check .
      required: true
    - id: ruff-format
      kind: lint
      run: .venv/bin/python -m ruff format --check .
      required: true
    - id: mypy
      kind: typecheck
      run: .venv/bin/python -m mypy
      required: true
    - id: verify
      kind: integration
      run: .venv/bin/python -m amplai_foundry.cli verify --root .
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: targeted
      required: true
    - type: command_output
      source: full-pytest
      required: true
    - type: command_output
      source: schema-check
      required: true
    - type: command_output
      source: ruff-check
      required: true
    - type: command_output
      source: ruff-format
      required: true
    - type: command_output
      source: mypy
      required: true
    - type: command_output
      source: verify
      required: true

risk:
  level: medium
  concerns:
    - contracts/interaction-feedback.md, spec.md, data-model.md 는 round 10 review target
      aggregate 안에 있다. 이 task 완료 시 그 freeze 가 깨진다.
    - 계약을 코드에 맞추는 방향은 계약이 원래 의도한 사용자 통지를 축소하는 것일 수 있다.
      D-034 가 그 판단을 이미 내렸다.
  approvals:
    - D-034 (APPROVED, 2026-08-13) — 계약과 spec 을 코드에 맞춘다.

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - change_would_alter_runtime_safe_outcome_behavior
    - branch_removal_lacks_unreachability_evidence
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-08-13T00:00:00+09:00"
  evidence_paths:
    - specs/003-slack-proposal-card/evidence/MGC-012-P5-T007.md

handoff:
  expected_changes:
    - contracts/interaction-feedback.md 의 safe outcome mapping table.
    - spec.md FR-024.
    - data-model.md 의 Review Card Command column 목록.
    - SafeInteractionOutcome enum 과 message table 에서 도달 불가 값 제거.
  notes:
    - 이 task 는 round 10 freeze 를 깬다. 완료 후 재freeze 하고 재review 한다. round 9 가
      무효가 된 원인이 freeze 뒤 변경이었다. 같은 실수를 반복하지 않는다.
