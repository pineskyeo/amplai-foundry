schema_version: "1.0"
id: HSO-T007
title: Verify the real Slack and Hermes production path
type: verification
status: blocked
goal:
  outcome: A real Slack request, AMPLAI human activation, worker run, result projection, failure injection, and rollback rehearsal all match the approved contract.
  user_value: The complete user-facing workflow is proven before auto-start is enabled.
source:
  feature: HSO
  files: [{path: specs/011-hermes-slack-orchestration/plan.md, section: S07-Production-Path-Closure}]
  requirements: [AC-011, AC-012, AC-014]
  decisions: [D-060, D-062, D-063]
scope:
  include: [Real Slack workspace E2E, Hermes Socket Mode, signed AMPLAI action, failure injection, rollback]
  exclude: [Telegram, global activation, deploy or release automation]
  allowed_paths: [specs/011-hermes-slack-orchestration/evidence/**, docs/**]
  forbidden_paths: [vault/**]
dependencies:
  tasks: [HSO-T003, HSO-T004, HSO-T005]
  external: [Hermes Slack App credentials, AMPLAI Slack App credentials, allowlisted channel and Actor binding, production-operation approval]
implementation:
  guidance: [Keep auto_start false until the real E2E evidence is accepted.]
  invariants: [The two Slack Apps never share credentials, Project Store remains authoritative]
  non_goals: [Production deployment, Telegram verification]
acceptance:
  behaviors:
    - id: AC-01
      given: configured separate Hermes and AMPLAI Slack Apps
      when: a user submits and approves a Work and failures are injected
      then: exactly one Work reaches the contracted state and rollback preserves existing workflows
  commands: []
  manual_checks:
    - id: slack-hermes-e2e
      observer: authorized Slack operator
      action: execute the S07 production-operation checklist
      expected: request, action, Work, evidence, projection, failure, and rollback correlations all match
      reason_not_automated: Slack signatures and Socket Mode require real external credentials
      required: true
  evidence:
    - {type: operational_log, source: slack-hermes-e2e, required: true}
risk:
  level: high
  concerns: [production credentials, human authority, external delivery]
  approvals: [production_operation]
loop:
  max_attempts: 3
  replan_after_same_failure: 3
  stop_conditions: [required_external_dependency_missing, authority_mismatch, secret_detected, same_failure_class_reaches_replan_threshold]
completion:
  all_acceptance_passed: false
  required_evidence_present: false
  completed_at: null
  evidence_paths: []
handoff:
  expected_changes: [specs/011-hermes-slack-orchestration/evidence/**]
  notes: [Blocked until both Slack Apps and an allowlisted test channel are available.]
