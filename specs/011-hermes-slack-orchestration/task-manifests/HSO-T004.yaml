schema_version: "1.0"
id: HSO-T004
title: Activate Work only through an authoritative Slack action
type: feature
status: done
goal:
  outcome: A signed, actor-bound, one-time Slack action activates DRAFT Work once and projects authoritative Work status without allowing Hermes credentials to decide.
  user_value: Users can approve and track execution in Slack with replay-safe authority.
source:
  feature: HSO
  files:
    - {path: specs/011-hermes-slack-orchestration/spec.md, section: Human-Authority}
    - {path: specs/011-hermes-slack-orchestration/plan.md, section: Activation-Card}
  requirements: [AC-004, AC-005, AC-011, AC-012]
  decisions: [D-060, D-062, D-063]
scope:
  include: [Activation payload and service, Slack card and action adapter, provider activation policy, status projection]
  exclude: [Hermes conversation handling, automatic production enable]
  allowed_paths: [src/amplai_foundry/governance/**, tests/test_work_activation.py, tests/test_slack_projection.py, docs/**]
  forbidden_paths: [vault/**, integrations/hermes-amplai/**]
dependencies:
  tasks: [HSO-T002]
  external: []
implementation:
  guidance: [Reuse raw Slack signature verification, ActorBinding, hash-only ActionToken, and durable outbox patterns.]
  invariants:
    - Only activation.manage plus a valid one-time token changes DRAFT Work state.
    - Notification failure never reverses Work state.
    - Activation is project plus provider plus feature scoped and defaults off.
  non_goals: [Global messenger enable, Telegram activation]
acceptance:
  behaviors:
    - id: AC-01
      given: a valid signed action bound to the expected actor, channel, revision, and digest
      when: approve is applied once
      then: DRAFT becomes WAITING or READY and a duplicate returns the same result
    - id: AC-02
      given: a Hermes token, stale token, wrong actor, or wrong channel
      when: activation is attempted
      then: Work state remains unchanged and an audit result is recorded
    - id: AC-03
      given: an authoritative Work event
      when: Slack delivery fails and retries
      then: Work state remains authoritative and projection is idempotent
  commands:
    - {id: activation-tests, kind: test, run: ".venv/bin/python -m pytest tests/test_work_activation.py tests/test_slack_projection.py", required: true}
  manual_checks: []
  evidence:
    - {type: command_output, source: activation-tests, required: true}
risk:
  level: high
  concerns: [human authority, replay, provider rollout]
  approvals: [architecture_change, public_contract]
loop:
  max_attempts: 3
  replan_after_same_failure: 3
  stop_conditions: [authority_contract_conflict, activation_requires_hermes_provenance, same_failure_class_reaches_replan_threshold]
completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-09-08T08:00:00Z"
  evidence_paths:
    - specs/011-hermes-slack-orchestration/evidence/review-target-round-24.txt
    - specs/011-hermes-slack-orchestration/evidence-trace.jsonl
handoff:
  expected_changes: [src/amplai_foundry/governance/**, tests/test_work_activation.py]
  notes: []
