schema_version: "1.0"
id: HSO-T002
title: Accept one durable idempotent orchestration request
type: feature
status: done
goal:
  outcome: An authorized design or work request creates one durable DRAFT graph, while duplicate or unresolved requests never create another runnable Work.
  user_value: Slack requests can be accepted safely without bypassing AMPLAI state and authority.
source:
  feature: HSO
  files:
    - {path: specs/011-hermes-slack-orchestration/spec.md, section: Request-Contract}
    - {path: specs/011-hermes-slack-orchestration/plan.md, section: S01-and-S02}
  requirements: [AC-001, AC-002, AC-005]
  decisions: [D-059, D-061]
scope:
  include: [Orchestration request schema, Control Plane routes, durable outbox, Project Store bridge, resolution hold, artifact quarantine]
  exclude: [Slack human activation, Hermes UI, automatic Work activation]
  allowed_paths:
    - src/amplai_foundry/control_plane/**
    - scripts/amplai_runtime.py
    - scripts/amplai.py
    - .ai-team/runtime/schemas/**
    - tools/amplai-loop-kit/**
    - tests/test_control_plane.py
    - tests/ai/test_amplai_async_runtime.py
  forbidden_paths: [vault/**, src/amplai_foundry/governance/**]
dependencies:
  tasks: [HSO-T001]
  external: []
implementation:
  guidance: [Use one transaction for request plus outbox, and an idempotent bridge instead of a distributed transaction.]
  invariants:
    - Hermes service permissions cannot activate Work.
    - Same idempotency key and digest returns the prior result; a different digest conflicts.
    - Existing Work JSON remains readable without rewrite.
  non_goals: [Generic write API, remote scheduler]
acceptance:
  behaviors:
    - id: AC-01
      given: a valid project-scoped service principal and new idempotency key
      when: it submits a design or work request
      then: the API stores one request and emits one bridgeable durable event
    - id: AC-02
      given: an unknown or ambiguous target
      when: the request is resolved
      then: it remains held and creates no READY or RUNNING Work
    - id: AC-03
      given: duplicate and crash-before-receipt deliveries
      when: the bridge retries
      then: one correlated DRAFT graph exists
  commands:
    - {id: control-plane-tests, kind: test, run: ".venv/bin/python -m pytest tests/test_control_plane.py", required: true}
    - {id: async-runtime-tests, kind: test, run: ".venv/bin/python -m pytest tests/ai/test_amplai_async_runtime.py", required: true}
  manual_checks: []
  evidence:
    - {type: command_output, source: control-plane-tests, required: true}
    - {type: command_output, source: async-runtime-tests, required: true}
risk:
  level: high
  concerns: [public schema compatibility, cross-store idempotency, service authority]
  approvals: [architecture_change, public_contract]
loop:
  max_attempts: 3
  replan_after_same_failure: 3
  stop_conditions: [cross_store_transaction_required, authority_boundary_expands, same_failure_class_reaches_replan_threshold]
completion:
  all_acceptance_passed: true
  required_evidence_present: true
  completed_at: "2026-09-08T08:00:00Z"
  evidence_paths:
    - specs/011-hermes-slack-orchestration/evidence/review-target-round-24.txt
    - specs/011-hermes-slack-orchestration/evidence-trace.jsonl
handoff:
  expected_changes: [src/amplai_foundry/control_plane/**, scripts/amplai_runtime.py, .ai-team/runtime/schemas/**]
  notes: []
