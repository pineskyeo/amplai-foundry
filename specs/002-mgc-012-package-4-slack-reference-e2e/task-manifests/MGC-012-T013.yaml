schema_version: "1.0"

id: MGC-012-T013
title: Production startup enforces durable probe lifecycle before Slack claim
type: feature
status: blocked

goal:
  outcome: >-
    Production Slack startup가 event claim 전에 durable probe lifecycle을 판정한다. Exact
    cleanup-only 실패는 degraded로 진행하고 unresolved, ambiguous, concurrency loser 또는
    persistence failure는 새 post와 worker activation 없이 hard block한다.
  user_value: >-
    재기동과 동시 startup이 probe를 늘리지 않는다. Cleanup 이상은 보이지만 readback이
    정상인 worker는 사용할 수 있고, 증명할 수 없는 recovery는 조용히 추정하지 않는다.

source:
  feature: MGC-012
  files:
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/spec.md
      section: FR-018, FR-023~FR-031, FR-033~FR-037, SC-017~SC-028
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/plan.md
      section: Wave 8, P-005~P-011
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/data-model.md
      section: ReadbackOutcome, ProbeCleanupLifecycle, OperatorDiagnostic, StartupWiringEvidence
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/contracts/slack-http-transport.md
      section: H-3.2~H-3.6
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/research.md
      section: R-017~R-025
  requirements:
    - FR-018
    - FR-023
    - FR-024
    - FR-025
    - FR-026
    - FR-027
    - FR-028
    - FR-029
    - FR-030
    - FR-031
    - FR-033
    - FR-034
    - FR-035
    - FR-036
    - FR-037
  decisions:
    - D-029
    - D-030
    - D-031

scope:
  include:
    - GovernanceStore 전용 probe lifecycle additive migration
    - channel/app별 unresolved lifecycle 최대 1개
    - concurrent startup atomic claim과 single post winner
    - network 전 durable intent와 exact channel + ts cleanup
    - ambiguous post와 state operation failure의 HARD_BLOCKED_NO_POST 판정
    - delete 성공 뒤 RESOLVED commit 실패의 fail-closed 판정
    - malformed/unknown/unsupported lifecycle record의 typed fail-closed validation
    - 네 crash boundary와 confirmed identity commit failure의 in-process exact compensation
    - production event claim 전 readback outcome 소비
    - startup 평가별 cleanup-only diagnostic 1회와 FR-030 closed allowlist
    - structured log, exception output, metric, persisted diagnostic의 FR-034 safe surface
    - restart 10회 추가 post 0건 증거
    - E-7~E-10 named readiness approval record 검증
    - same-revision composition-root integration result와 configured startup trace
  exclude:
    - operator 강제 해제와 governed recovery mutation
    - text, prefix, metadata, app ID, 위치, 최근 N건, 시간 window 기반 recovery
    - provider-side ambiguous message lookup 또는 global remote probe cap 주장
    - external supervisor configuration
    - 범용 persistence 또는 write API
    - SlackProjectionDestination와 Package 3 계약 변경
  allowed_paths:
    - src/amplai_foundry/governance/migrations.py
    - src/amplai_foundry/governance/slack_startup.py
    - src/amplai_foundry/governance/__init__.py
    - tests/test_governance_store.py
    - tests/test_slack_startup.py
  forbidden_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - src/amplai_foundry/governance/slack.py
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/projections.py
    - vault

dependencies:
  tasks:
    - MGC-012-T010
  external:
    - id: E-7
      name: Production Slack worker entrypoint approval record
      description: >-
        Repository에 production Slack composition root가 없다. Entrypoint path, owner와
        pre-claim insertion point를 적은 user-approved workstream decision을 이 manifest에
        연결하고 allowed_paths와 executable wiring command를 재검토한다.
      owner: 사용자
      status: pending
    - id: E-8
      name: Official provider recovery contract review approval
      description: >-
        Review date, official Slack document version과 caller-controlled pre-response identity 또는
        exact lookup/idempotency 지원 여부를 기록한다. 미지원이면 heuristic을 허용하지 않고
        E-9를 필수로 유지한다. Slack 문서는 fact source이며 사용자가 review를 승인한다.
      owner: 사용자
      status: pending
    - id: E-9
      name: Governed probe recovery work item approval record
      description: >-
        Actor/permission, ActionToken, audit/evidence와 허용 transition을 정한 별도 work item을
        governed workstream workflow로 사용자가 승인한다. T013에 강제 해제를 임의로 넣지 않는다.
      owner: 사용자
      status: pending
    - id: E-10
      name: Narrow lifecycle schema and repository approval record
      description: >-
        Schema version/migration, channel/app atomic unresolved uniqueness와 repository owner를
        정한 decision을 governed workstream workflow로 사용자가 승인한다. Existing outbox,
        ingress, hold table은 재사용하지 않는다.
      owner: 사용자
      status: pending

implementation:
  guidance:
    - governance_transaction의 BEGIN IMMEDIATE와 schema constraint를 사용해 atomic claim을
      만든다. Read 후 별도 insert로 race를 만들지 않는다.
    - 전용 lifecycle service가 Slack HTTP와 GovernanceStore를 조립한다. HttpSlackTransport에
      persistence를 넣지 않는다.
    - RESOLVED는 exact cleanup과 durable commit이 모두 성공한 뒤에만 기록한다.
    - lifecycle decode boundary에서 exact schema version과 closed state enum을 검증하고 invalid
      row를 자동 수정하지 않는다.
    - success response 뒤 identity commit 실패는 current process의 confirmed channel + ts로만
      exact delete 1회와 durable resolution을 시도한다.
    - Production composition root의 경로는 E-7이 정한다. 현재 path를 추정해 만들지 않는다.
  invariants:
    - 같은 channel/app의 non-resolved lifecycle은 최대 1개다.
    - durable intent commit 전 post_message 호출은 0회다.
    - unresolved, ambiguous, state failure 또는 claim loser의 post_message 호출은 0회다.
    - HARD_BLOCKED_NO_POST는 startup outcome이며 persisted cause state를 덮어쓰지 않는다.
    - CLEANUP_PENDING exact delete와 durable RESOLVED commit이 모두 성공하기 전 fresh claim과
      post_message 호출은 0회다.
    - confirmed message_ts 없는 automatic lookup과 delete는 0회다.
    - cleanup-only degraded에서만 worker activation을 허용한다.
    - readback failure와 RESOLVED commit failure는 worker activation을 거부한다.
    - readback/lifecycle 계층은 operator output을 만들지 않는다.
    - diagnostic은 FR-030 allowlist 밖 field를 포함하지 않는다.
    - malformed/unknown/unsupported lifecycle row는 mutation, readback, post와 activation이 0회다.
    - raw exception chain, 자유형 error와 provider body/header는 diagnostic surface에 전달하지 않는다.
    - E-7~E-10 approval record가 모두 연결되기 전 status를 ready로 바꾸지 않는다.
    - dual production evidence는 같은 code revision을 가리킨다.
  non_goals:
    - Operator가 message_ts를 입력하거나 lifecycle을 강제 해제하는 command.
    - Provider contract 없는 ambiguous message 자동 cleanup.
    - Slack worker process 또는 deployment topology를 새로 결정하는 것.

acceptance:
  behaviors:
    - id: AC-01
      given: 같은 channel/app에서 startup 둘이 동시에 durable intent를 claim하는 상태
      when: 둘이 barrier 뒤에서 claim과 startup 판정을 완료하면
      then: claim 성공과 post_message 호출은 각각 최대 1건이고 loser는 HARD_BLOCKED_NO_POST다
    - id: AC-02
      given: >-
        channel/app에 automatic exact recovery가 완료되지 않은 unresolved lifecycle이 이미
        있는 상태
      when: startup을 10회 반복하면
      then: 원인 state가 보존되고 추가 post_message와 worker activation은 각각 0건이다
    - id: AC-03
      given: durable intent commit 뒤 Slack post 응답을 잃어 message_ts가 없는 상태
      when: 현재와 다음 startup을 판정하면
      then: >-
        AMBIGUOUS_POST가 durable하게 남고 HARD_BLOCKED_NO_POST다. History, search 또는
        metadata scan 호출과 추가 post는 0건이다
    - id: AC-04
      given: confirmed channel_id와 message_ts가 있는 CLEANUP_PENDING 상태
      when: startup이 cleanup recovery와 다음 self-check를 평가하면
      then: >-
        저장된 exact identity만 chat.delete에 전달하고 durable RESOLVED commit까지 성공한 뒤
        fresh atomic claim과 self-check를 허용한다. 다른 lookup key는 사용하지 않는다
    - id: AC-05
      given: marker readback은 성공했고 exact cleanup만 실패한 상태
      when: production startup 판정을 완료하면
      then: DEGRADED_CLEANUP으로 worker를 활성화하고 lifecycle은 unresolved 상태를 유지한다
    - id: AC-06
      given: readback과 cleanup이 함께 실패한 상태
      when: production startup 판정을 완료하면
      then: worker activation은 0건이고 원래 readback cause가 primary로 보존된다
    - id: AC-07
      given: Slack delete 성공 뒤 durable RESOLVED commit이 실패한 상태
      when: startup 판정을 완료하면
      then: >-
        마지막 CLEANUP_PENDING cause state가 보존되고 startup outcome은
        HARD_BLOCKED_NO_POST이며 worker activation과 추가 post는 각각 0건이다
    - id: AC-08
      given: cleanup-only degraded outcome이 나온 production startup 평가
      when: composition root가 outcome을 소비하면
      then: >-
        SLACK_PROBE_CLEANUP_DEGRADED를 정확히 1건 출력한다. 같은 평가의 중복은 0건이고
        process 재기동의 새 평가는 다시 1건 출력한다
    - id: AC-09
      given: cleanup-only diagnostic data가 있는 상태
      when: output field를 열거하면
      then: >-
        diagnostic_code, channel_id, app_id, probe_id, confirmed message_ts,
        cleanup_failure_count, provider_error_code, operator_action만 존재한다
    - id: AC-10
      given: readback 또는 lifecycle service가 어떤 outcome을 만드는 상태
      when: log와 stderr를 관측하면
      then: operator output, credential, HTTP 원문과 exception repr 노출은 각각 0건이다
    - id: AC-11
      given: production Slack worker가 claim할 event가 있는 상태
      when: composition root가 startup한다
      then: >-
        같은 production channel/app/transport로 readback outcome을 한 번 소비한 뒤 READY 또는
        DEGRADED_CLEANUP일 때만 event를 claim한다
    - id: AC-12
      given: 이전 schema version의 healthy GovernanceStore가 있는 상태
      when: additive migration을 적용하고 startup schema verification을 실행하면
      then: >-
        전용 lifecycle schema와 unresolved uniqueness가 검증되고 기존 outbox, ingress,
        hold table의 schema와 row는 바뀌지 않는다
    - id: AC-13
      given: lifecycle state read, write, claim 또는 commit이 실패하거나 결과가 ambiguous한 상태
      when: startup 판정을 실행하면
      then: >-
        마지막 cause state를 보존하고 post_message와 worker activation은 각각 0건이며 typed
        hard outcome을 반환한다
    - id: AC-14
      given: 명시적 provider identity가 없는 HARD_BLOCKED_NO_POST lifecycle
      when: Package 4의 public surface와 operator command를 열거하면
      then: 강제 해제, 추정 resolved transition과 operator-supplied identity mutation은 0건이다
    - id: AC-15
      given: malformed field, unknown state와 unsupported schema/state version lifecycle row 각각
      when: production startup이 repository record를 decode하면
      then: >-
        LIFECYCLE_STATE_INVALID를 반환하고 기존 row mutation, readback, post_message와 worker
        activation은 각각 0건이다
    - id: AC-16
      given: >-
        durable intent 전, committed intent 뒤 post 전, post 뒤 response loss의 세 crash boundary
      when: current 또는 next startup을 판정하면
      then: >-
        intent 전 case만 next startup fresh claim이 가능하다. Existing POST_INTENT_RECORDED 또는
        AMBIGUOUS_POST는 cause를 보존하고 unauthorized lookup, 추가 post와 activation은 각각 0건이다
    - id: AC-17
      given: Slack success response의 confirmed channel + ts를 받았지만 identity commit이 실패한 상태
      when: current process와 다음 startup을 판정하면
      then: >-
        current process는 confirmed identity로 exact delete를 최대 1회 수행한다. Delete와 durable
        RESOLVED가 모두 성공한 뒤의 next startup만 fresh claim할 수 있고 현재 startup activation과
        새 post는 0건이다
    - id: AC-18
      given: readback 또는 cleanup failure가 production diagnostic surface에 전달되는 상태
      when: structured log, exception output, metric label, persisted failure diagnostic과 operator output을 열거하면
      then: >-
        각 closed allowlist 밖 field, raw exception chain, 자유형 error, provider body/header와
        channel/app/probe/message identity metric label은 각각 0건이다
    - id: AC-19
      given: T013 readiness와 production completion을 평가하는 상태
      when: linked evidence를 열거하면
      then: >-
        ready 전 E-7~E-10 user-approved record가 각각 1건 존재한다. Completion에는 같은 revision의
        CompositionRootIntegrationResult와 ConfiguredStartupTrace가 각각 1건 존재하고 하나라도
        없으면 FR-018 completion과 Package 4 PASS는 0건이다
    - id: AC-20
      given: MGC-012-T010 live target/config evidence가 완료되지 않은 상태
      when: T013 execution readiness를 평가하면
      then: >-
        production startup execution과 ConfiguredStartupTrace 생성은 각각 0건이다. T010 완료 뒤
        같은 approved target/config path를 사용한 경우에만 T013 execution을 시작한다
  commands:
    - id: unit
      kind: test
      run: python -m pytest tests/test_governance_store.py tests/test_slack_startup.py
      required: true
    - id: regression
      kind: test
      run: python -m pytest
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
    - id: knowledge_lint
      kind: lint
      run: amplai-foundry lint vault/
      required: true
  manual_checks:
    - id: production-evidence-linkage
      observer: Package 4 gate reviewer
      action: >-
        E-7이 승인한 executable entrypoint command로 생성된 same-revision integration result와
        configured startup trace가 T013 manifest와 Package 4 checkpoint에 연결됐는지 검사한다
      expected: 두 artifact의 revision이 같고 data-model StartupWiringEvidence schema와 금지값 계약을 만족한다
      reason_not_automated: E-7이 미완이라 production entrypoint command와 artifact path가 아직 존재하지 않는다
      required: true
  evidence:
    - type: command_output
      source: unit
      required: true
    - type: command_output
      source: regression
      required: true
    - type: command_output
      source: knowledge_lint
      required: true
    - type: artifact
      source: CompositionRootIntegrationResult
      required: true
    - type: artifact
      source: ConfiguredStartupTrace
      required: true

risk:
  level: high
  concerns:
    - SQLite migration과 production activation gate를 함께 바꾸므로 partial state가 치명적이다.
    - Ambiguous external post는 local transaction으로 원격 message 존재를 증명할 수 없다.
    - 잘못된 diagnostic owner는 중복 output 또는 secret 노출을 만든다.
  approvals:
    - E-7~E-10 user-approved governed workstream records
    - 구현 후 contract·failure-recovery·regression 3 lens review

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - governed_recovery_contract_missing
    - production_composition_root_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: false
  required_evidence_present: false
  completed_at: null
  evidence_paths: []

handoff:
  expected_changes:
    - src/amplai_foundry/governance/migrations.py additive migration
    - src/amplai_foundry/governance/slack_startup.py 신규 lifecycle service
    - tests/test_governance_store.py migration·schema 검증
    - tests/test_slack_startup.py startup state matrix
    - E-7이 정한 production composition root path
    - same-revision CompositionRootIntegrationResult와 ConfiguredStartupTrace
  notes:
    - E-6은 2026-08-11 D-031과 APR-016 기록으로 닫혔다. E-7~E-10이 모두 닫히기 전에는 구현하지 않는다.
    - E-7이 닫히면 allowed_paths에 production composition root를 추가하고 validator를 다시 돌린다.
    - T008은 typed outcome만 소유하고 이 task가 persistence, restart, output, production claim을 소유한다.
    - E-7이 닫히면 production evidence manual check를 실제 executable command와 artifact path로 교체한다.
    - T010 완료 evidence의 target channel/app과 credential path를 configured startup trace에 재사용한다.
