      적고 상한을 말하지 않는다.
    owner: MGC-012-T010
    blocking: false
    note: >-
      marker 에 payload 본문을 넣지 않는 것으로 계속 회피한다. 실측은 실제 workspace 가
      생긴 뒤 가능하다. 001 에서 이월했다.
  - id: OQ-005
    question: >-
      marker 를 workspace 구성원 누구나 읽을 수 있다는 사실이 수용 가능한가.
      research P1 이 명시한다 — "Metadata you post to Slack is accessible to any app or
      user who is a member of that workspace."
    owner: MGC-012-T010
    blocking: false
    note: >-
      우리 marker 는 event_id·destination_ref·destination_sequence·payload_digest 넷이고
      credential 은 없다. 다만 destination_ref 는 channel digest 이고 payload_digest 는
      내용 지문이다. 노출 판단이 필요하다.
  - id: OQ-006
    question: >-
      T011 이 Package 3 의 T005 AC-07 과 실질적으로 다른 것을 검사하는가.
    owner: MGC-012-T011
    blocking: false
    note: >-
      차이는 전송 계층이 fake 가 아니라 실제 HTTP 구현이라는 것뿐이다. 그 차이가
      무의미하다고 판정되면 T011 을 접고 FR-021 을 T010 으로 옮긴다. wave 6 review 가
      판단한다.

resolved_questions:
  - id: U-001
    question: chat.postMessage 와 conversations.history 에 필요한 OAuth scope 는 무엇인가.
    resolved_by: research R-009
    resolution: >-
      bot scope 로 chat:write, channels:history (public), groups:history (private) 다.
      chat:write.public 은 주지 않는다 — app 을 대상 channel 에 초대해 쓴다.
      001 index.yaml 의 W3-history-oauth-scope 가 이것으로 닫힌다.
  - id: U-002
    question: HTTP client 를 무엇으로 하는가.
    resolved_by: research R-013
    resolution: >-
      stdlib urllib.request 다. runtime dependency 셋을 유지한다. 호출량이 작고
      (channel 당 초당 1건), 필요한 기능(POST·header·timeout)이 stdlib 에 다 있고,
      재시도는 이미 OutboxDispatcher 가 소유한다.
  - id: U-003
    question: credential 이 프로세스에 어떻게 도달하는가.
    resolved_by: research R-014
    resolution: >-
      환경변수를 entrypoint 한 곳에서만 읽어 SecretStr 로 감싸 주입한다. core 는 계속
      주입만 받는다. 변수 이름은 T007 이 확정한다.
  - id: U-004
    question: E2E 를 어디서 어떻게 돌리는가.
    resolved_by: research R-015, plan P-003
    resolution: >-
      pytest marker 로 분리하고 기본 실행에서 deselect 한다. credential 이 없으면 skip
      하되 이유를 출력한다. amplai-foundry verify 는 건드리지 않는다 — clean clone·
      offline 계약을 유지한다.
  - id: U-005
    question: conversations.history 가 최신 message 부터 돌려주는가.
    resolved_by: research R-011
    resolution: >-
      그렇다. 공식 문서가 "The most recent messages in the time range are returned
      first" 로 명시한다. 001 index.yaml 의 W3-history-ordering-unverified 가 닫힌다.
      다만 C-1.2 의 계약 문장은 유지한다 — page 사이 순서는 여전히 계약 의존이다.

