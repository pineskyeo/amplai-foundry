schema_version: "1.0"

id: MGC-012-T010
title: Reference E2E against a real Slack workspace
type: feature
status: blocked

goal:
  outcome: >-
    실제 Slack 채널에 Card 가 뜨고, marker read-back 으로 같은 receipt 를 다시 만들고,
    history 정렬과 metadata 복원을 실물로 관측한다.
  user_value: >-
    A15 의 "Slack reference E2E" 본체다. 계약이 fake 에서만 성립하고 실물에서 깨지는 것이
    이 task 가 막으려는 결과다.

source:
  feature: MGC-012
  files:
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/spec.md
      section: User Story 1, User Story 2, SC-009, SC-010, SC-011, SC-013
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/quickstart.md
      section: A, C
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/contracts/slack-http-transport.md
      section: H-1, H-5.3
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/research.md
      section: R-009, R-011, R-012
  requirements:
    - FR-013
    - FR-014
    - FR-018
  decisions:
    - D-023
    - D-026

scope:
  include:
    - 실제 채널로 send 하고 receipt 확인
    - reconcile 이 같은 receipt 문자열을 만드는 것 확인 (C-2.3)
    - metadata 와 app_id 복원 확인
    - history 최신-우선 정렬 실측
    - 사람이 지운 Card 에 대한 판정 실측
  exclude:
    - transport 구현 자체 (T006 소유)
    - Provider 격리 (T011 소유)
    - closure 검증 (T012 소유)
  allowed_paths:
    - tests/test_slack_http.py
  forbidden_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - src/amplai_foundry/governance/slack.py
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/projections.py

dependencies:
  tasks:
    - MGC-012-T008
    - MGC-012-T009
  external:
    - id: E-1
      name: 테스트용 Slack workspace 생성
      description: 테스트용 Slack workspace 생성. 회사 workspace 를 쓰지 않는다 (D-026).
      owner: 사용자
      status: pending
    - id: E-2
      name: Slack app 생성·scope 부여·설치 (배포하지 않는다)
      description: >-
        Slack app 생성. bot scope chat:write 와 channels:history 부여 후 workspace 설치.
        **배포하지 않는다** — 비-Marketplace 배포는 conversations.history 를 분당 1회로
        낮춰 reconcile 설계가 성립하지 않는다 (research R-012, contracts H-1.2).
      owner: 사용자
      status: pending
    - id: E-3
      name: test 채널 생성과 app 초대
      description: test 채널 생성과 app 초대. channel ID 확보.
      owner: 사용자
      status: pending
    - id: E-4
      name: signing secret·bot token 을 환경변수로 주입
      description: signing secret 과 bot token 을 실행 환경의 환경변수로 주입.
      owner: 사용자
      status: pending

implementation:
  guidance:
    - 같은 event_id 를 재사용하지 않는다. 과거 실행의 marker 가 조회 범위에 남아 있어도
      오판하지 않게 한다 (contracts H-5.3).
    - credential 이 없으면 skip 한다. T009 가 만든 장치를 쓴다.
    - rate limit 을 넘기지 않는다. chat.postMessage 는 channel 당 초당 1건이다.
  invariants:
    - 실제 채널에 중복 Card 를 만들지 않는다.
    - credential 을 출력하지 않는다.
    - skip 을 pass 로 보고하지 않는다.
  non_goals:
    - production workspace 사용.
    - app 배포.
    - 채널 자동 정리.

acceptance:
  behaviors:
    - id: AC-01
      given: 유효한 credential 과 test 채널이 있는 상태
      when: 실제 transport 로 send 하면
      then: 채널에 Card 가 뜨고 receipt 가 slack:{channel}:{ts} 형식으로 돌아온다
    - id: AC-02
      given: AC-01 로 보낸 Card 가 있는 상태
      when: reconcile 을 부르면
      then: AC-01 과 **같은 receipt 문자열**을 돌려준다
    - id: AC-03
      given: AC-01 로 보낸 Card 가 있는 상태
      when: include_all_metadata=true 로 되읽으면
      then: app_id 가 우리 app 이고 event_payload 네 필드가 모두 복원된다
    - id: AC-04
      given: 채널에 우리 Card 가 둘 이상 있는 상태
      when: conversations.history 를 부르면
      then: 최신 message 가 먼저 온다 (research R-011 실측 확인)
    - id: AC-05
      given: AC-01 의 Card 를 사람이 지웠고 history 를 끝까지 훑을 수 있는 상태
      when: reconcile 을 부르면
      then: 미전송으로 판정한다 (D-023 항목 3)
    - id: AC-06
      given: credential 환경변수가 없는 상태
      when: 이 task 의 test 를 돌리면
      then: skip 으로 보고되고 pass 로 집계되지 않는다
  commands:
    - id: e2e
      kind: integration
      run: python -m pytest -m slack_e2e
      required: true
    - id: regression
      kind: test
      run: python -m pytest
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
  manual_checks:
    - id: MC-01
      observer: 사용자
      action: >-
        AC-01 이 만든 Card 를 Slack UI 에서 지운 뒤 AC-05 의 test 를 다시 돌린다.
      expected: >-
        reconcile 이 미전송으로 판정하고 재전송한다. 채널에 Card 가 한 장만 남는다.
      reason_not_automated: >-
        chat.delete 로 자동화하려면 scope 를 더 줘야 한다. contracts H-1.1 의 최소 권한
        원칙과 어긋나고, 그 scope 는 운영 배포에도 딸려 간다.
  evidence:
    - type: command_output
      source: e2e
      required: true
    - type: command_output
      source: regression
      required: true

risk:
  level: high
  concerns:
    - 실제 채널에 중복 Card 가 나면 사람이 보는 결과라 되돌리기 어렵다.
    - E2E 가 실제 message 를 쌓아 조회 범위를 오염시킨다.
    - rate limit 을 넘기면 test 가 flaky 해진다.
    - external dependency 넷이 전부 사람 손에 달려 있다.
  approvals:
    - wave 7 종료 시 3 lens review 전원

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: false
  required_evidence_present: false
  completed_at: null
  evidence_paths: []

handoff:
  expected_changes:
    - tests/test_slack_http.py 확장
    - research.md 에 R-011 실측 결과 기록
  notes:
    - E-1~E-4 가 끝나기 전에는 시작할 수 없다. status 를 ready 로 올리는 조건이 그것이다.
    - index.yaml 의 W3-history-ordering-unverified 는 research R-011 이 문서로 닫았고
      이 task 가 실측으로 확인한다.
