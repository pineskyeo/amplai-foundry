schema_version: "1.0"

id: MGC-012-T007
title: Credentials enter at one composition root and never persist
type: feature
status: ready

goal:
  outcome: >-
    signing secret 과 bot token 이 entrypoint 한 곳에서만 환경에서 읽히고 SecretStr 로
    감싸여 주입된다. 어디에도 저장되거나 log 되지 않는다.
  user_value: >-
    A2·A7 이 요구하는 secret 비노출을 실제 실행 경로에서 지킨다. 지금 repo 에는
    credential 이 프로세스에 도달하는 경로 자체가 없다.

source:
  feature: MGC-012
  files:
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/spec.md
      section: FR-017
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/contracts/slack-http-transport.md
      section: H-4
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/research.md
      section: R-014
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/data-model.md
      section: SlackCredentials
  requirements:
    - FR-017
  decisions:
    - D-011
    - D-026

scope:
  include:
    - 환경변수를 SecretStr 로 읽는 지점 하나
    - 부재와 빈 문자열을 같게 다루기
    - secret 이 repr·log·예외 message 에 안 나오는 것 고정
    - 환경변수 이름 확정
  exclude:
    - HTTP 호출 자체 (T006 소유)
    - readback 자가검사 (T008 소유)
    - production credential 발급이나 rotation
  allowed_paths:
    - src/amplai_foundry/governance/slack_http.py
    - tests/test_slack_http.py
  forbidden_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - src/amplai_foundry/governance/slack.py
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/projections.py

dependencies:
  tasks: []
  external: []

implementation:
  guidance:
    - core 는 계속 주입만 받는다. 읽는 지점만 하나 추가한다 (R-014). 지금 repo 전체에
      Slack 설정을 읽는 os.environ 이 한 줄도 없고 그 구조가 test 가능성을 만들었다.
    - slack.py 의 signing_secret 이 이미 SecretStr + field(repr=False) 다. 같은 처리를
      bot token 에도 준다.
    - 값 하나에 변수 하나다. 합쳐 담지 않는다 (contracts H-4.1).
  invariants:
    - secret 이 payload·marker·receipt·log·DB·Audit 어디에도 안 들어간다.
    - 읽는 지점이 하나다. core module 이 os.environ 을 직접 읽지 않는다.
  non_goals:
    - config 파일이나 keychain 지원.
    - secret rotation.

acceptance:
  behaviors:
    - id: AC-01
      given: 두 환경변수가 설정된 상태
      when: credential 을 읽으면
      then: 두 값이 SecretStr 로 반환되고 원문이 repr 에 안 나온다
    - id: AC-02
      given: 환경변수가 없거나 빈 문자열인 상태
      when: credential 을 읽으면
      then: 부재와 빈 문자열이 같은 결과다 — 둘 다 "구성 안 됨"이다
    - id: AC-03
      given: credential 을 담은 객체가 있는 상태
      when: repr 또는 str 로 만들면
      then: 원문 secret 이 포함되지 않는다
    - id: AC-04
      given: transport 가 실패해 SlackTransportError 를 만드는 상태
      when: 그 예외의 message 와 속성을 읽으면
      then: token 이나 signing secret 이 포함되지 않는다
    - id: AC-05
      given: 구현 module 을 정적으로 검사하는 상태
      when: os.environ 접근 지점을 세면
      then: entrypoint 한 곳뿐이고 core 경로에는 없다
  commands:
    - id: unit
      kind: test
      run: python -m pytest tests/test_slack_http.py
      required: true
    - id: regression
      kind: test
      run: python -m pytest
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: unit
      required: true
    - type: command_output
      source: regression
      required: true

risk:
  level: high
  concerns:
    - secret 유출은 되돌릴 수 없다. log 나 DB 에 한 번 들어가면 회수 못 한다.
    - repr 억제는 SecretStr 이 주지만 f-string 안에서 get_secret_value 를 부르면 뚫린다.
  approvals:
    - wave 5 종료 시 3 lens review 전원. secret 비노출은 credential secrecy lens 가
      본다 (CURRENT_ITEM Review Team).

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  all_acceptance_passed: false
  required_evidence_present: false
  completed_at: null
  evidence_paths: []

handoff:
  expected_changes:
    - src/amplai_foundry/governance/slack_http.py 확장
    - tests/test_slack_http.py 확장
    - 환경변수 이름을 contracts H-4.1 에 기록
  notes:
    - T006 과 같은 test file 을 쓴다. 병렬 실행하지 않는다.
    - network 없이 돈다.
