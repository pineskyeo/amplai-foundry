schema_version: "1.0"

id: MGC-012-T008
title: Readback self-check refuses to start on a silent marker defect
type: feature
status: ready

goal:
  outcome: >-
    adapter 가 기동 전에 자기가 보낸 message 를 되읽어 marker 가 복원되는지 확인하고,
    안 되면 기동을 거부한다.
  user_value: >-
    marker 를 못 읽는 결함의 결과는 hold 가 아니라 조용한 중복 Card 다. 사람이 매
    재시도마다 Card 를 한 장씩 더 본다. 그 실패를 기동 시점의 시끄러운 거부로 바꾼다.

source:
  feature: MGC-012
  files:
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/spec.md
      section: FR-018
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/contracts/slack-http-transport.md
      section: H-3, H-1.1
    - path: specs/001-mgc-012-slack-reference-adapter/contracts/slack-transport.md
      section: C-1.2
  requirements:
    - FR-018
  decisions:
    - D-024

scope:
  include:
    - 기동 전 send → read → marker 복원 확인
    - app_id 와 event_payload 네 필드 대조
    - 하나라도 안 맞으면 기동 거부
    - scope 부족(missing_scope)을 이 시점에 드러내기
  exclude:
    - 실제 Slack workspace 상대 실행 (T010 소유)
    - reconcile 판정 규칙 변경
  allowed_paths:
    - src/amplai_foundry/governance/slack_http.py
    - tests/test_slack_http.py
  forbidden_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - src/amplai_foundry/governance/slack.py
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/projections.py

dependencies:
  tasks:
    - MGC-012-T006
    - MGC-012-T007
  external: []

implementation:
  guidance:
    - 이 검사가 잡는 것은 destination 안에서 판정할 수 없는 것들이다 — 값이 틀린 app_id,
      metadata 를 안 옮기는 구현, event_type 개명, scope 부족 (contracts H-3).
    - destination 의 SlackProjectionMetadataUnreadableError 는 지문으로 일부만 잡는다.
      이 검사가 나머지를 덮는다 (D-024 항목 2).
    - fake server 로 각 결함을 하나씩 재현한다. 실제 Slack 은 T010 이다.
  invariants:
    - 검사가 실패하면 기동하지 않는다. 경고만 남기고 진행하지 않는다.
    - 검사 자체가 credential 을 log 하지 않는다.
  non_goals:
    - 운영 중 주기적 재검사.
    - 검사 실패를 자동 복구.

acceptance:
  behaviors:
    - id: AC-01
      given: fake server 가 우리가 보낸 marker 를 그대로 되돌려주는 상태
      when: 자가검사를 돌리면
      then: 통과하고 기동을 허용한다
    - id: AC-02
      given: fake server 가 metadata 를 빼고 돌려주는 상태
      when: 자가검사를 돌리면
      then: 기동을 거부하고 원인을 보고한다
    - id: AC-03
      given: fake server 가 app_id 를 안 싣는 상태
      when: 자가검사를 돌리면
      then: 기동을 거부한다
    # 2026-08-08 정정. 원문은 "필드 하나를 빠뜨린" 이었는데 대응 test 는 값을 **바꾼다**.
    # 누락도 거부되지만 그것은 "복원 실패" 라는 다른 경로이고 message 도 다르다.
    # 문장을 test 에 맞춘다 (wave 6 contract review Advisory).
    - id: AC-04
      given: fake server 가 event_payload 의 필드 하나를 바꿔서 돌려주는 상태
      when: 자가검사를 돌리면
      then: 기동을 거부한다
    - id: AC-05
      given: fake server 가 read 에 missing_scope 를 돌려주는 상태
      when: 자가검사를 돌리면
      then: 기동을 거부한다. 첫 재시도까지 기다리지 않는다
    # 2026-08-08 추가. wave 6 review round 1 의 P0 다. D-029 와 contracts H-3.1 이 근거다.
    - id: AC-06
      given: 호출자가 진짜 destination 의 destination_ref 를 단 probe_marker 를 넘긴 상태
      when: 자가검사를 돌리면
      then: >-
        message 를 **보내기 전에** 거부한다. 보낸 뒤에 알면 probe 가 채널에 남아
        reconcile 이 그것을 Card 로 오인한다
    - id: AC-07
      given: 채널에 남의 message 가 probe 앞뒤로 있는 상태
      when: 자가검사를 돌리면
      then: >-
        방금 보낸 ts 로 probe 를 찾아 통과한다. 위치로 찾으면 남의 message 를 검사해
        엉뚱한 이유로 기동을 거부한다
    # 2026-08-08 round 2 추가. D-030 과 contracts H-3.2 가 근거다. 격리만으로는 부족했다 —
    # probe 가 조회 예산을 먹어 진짜 Card 를 묻으면 판정 불가로 되돌릴 수 없는 hold 가 된다.
    - id: AC-08
      given: 자가검사가 통과한 상태
      when: 끝나면
      then: probe message 를 지운다
    - id: AC-09
      given: 자가검사가 실패한 상태
      when: 끝나면
      then: >-
        그래도 probe 를 지운다. 실패하는 상태가 곧 재시작 loop 이 도는 상태이고 거기서
        누적이 가장 빨리 쌓인다
    - id: AC-10
      given: 자가검사는 통과했지만 지우기가 실패하는 상태
      when: 자가검사를 돌리면
      then: 기동을 거부한다. 남은 probe 가 나중에 판정 불가를 만든다
    - id: AC-11
      given: 자가검사도 실패하고 지우기도 실패하는 상태
      when: 자가검사를 돌리면
      then: >-
        원래 원인을 올린다. 삭제 실패는 그 예외에 덧붙인다. 가리면 operator 가 엉뚱한
        곳을 고친다
  commands:
    - id: unit
      kind: test
      run: python -m pytest tests/test_slack_http.py
      required: true
    - id: regression
      kind: test
      run: python -m pytest
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: unit
      required: true
    - type: command_output
      source: regression
      required: true

risk:
  level: medium
  concerns:
    - 검사가 실제 채널에 message 를 하나 남긴다. T010 의 채널 오염과 같은 문제다.
    - 검사가 너무 엄격하면 정상 배포가 기동 못 한다.
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  # 2026-08-08 round 2 갱신. AC-06·AC-07 을 더했고 둘 다 통과한다. round 1 review 의 P0
  # (probe 가 진짜 marker 를 달면 reconcile 이 Card 로 오인) 를 D-029 로 닫았다.
  # mutation 넷을 더 죽였다 — destination_ref 검사 무력화, sentinel 을 진짜 형식으로 교체,
  # probe 를 위치로 찾기, event_payload 검사 무력화.
  #
  # AC-01~05 다섯 다 통과한다. H-3 이 잡기로 한 결함 넷을 각각 fake server 로 재현했다 —
  # metadata 누락, app_id 부재·불일치, 필드 왕복 변조, event_type 개명, 그리고 probe 를
  # 못 찾는 경우. missing_scope 는 SlackTransportError 로 그대로 올린다 (marker 결함이
  # 아니라 권한 문제라 섞지 않는다).
  #
  # mutation 5종 (app_id 대조 제거, 네 필드 대조 제거, probe 못찾음 검사 제거, 복원 실패
  # 무시, 자가검사 조기 return) 이 전부 죽는 것을 확인했다.
  all_acceptance_passed: true
  required_evidence_present: true
  # gate 는 아직이다. wave 6 의 3 lens review 가 끝나고 P0·P1·Blocking-P2 가 0건일 때만
  # 채운다. status 도 그때 done 으로 바꾼다.
  completed_at: null
  evidence_paths:
    - src/amplai_foundry/governance/slack_http.py
    - tests/test_slack_http.py

handoff:
  expected_changes:
    - src/amplai_foundry/governance/slack_http.py 확장
    - tests/test_slack_http.py 확장
  notes:
    - index.yaml 의 W3-transport-readback-selfcheck 를 이 task 가 닫는다.
    - network 없이 돈다. 실제 workspace 검증은 T010 이다.
