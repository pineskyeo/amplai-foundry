schema_version: "1.0"

id: MGC-012-T008
title: Readback self-check returns a typed startup outcome without heuristic recovery
type: feature
status: done

goal:
  outcome: >-
    readback 과 cleanup 결과가 typed startup outcome 으로 분리된다. Cleanup-only 실패는
    degraded 로 진행하고 readback 또는 lifecycle hard failure 는 기동을 거부한다.
  user_value: >-
    marker 를 못 읽는 결함의 결과는 hold 가 아니라 조용한 중복 Card 다. 사람이 매
    재시도마다 Card 를 한 장씩 더 본다. 그 실패를 기동 시점의 시끄러운 거부로 바꾼다.

