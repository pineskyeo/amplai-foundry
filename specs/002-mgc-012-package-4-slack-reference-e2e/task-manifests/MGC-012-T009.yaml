schema_version: "1.0"

id: MGC-012-T009
title: E2E harness skips loudly and stays out of the default suite
type: feature
status: ready

goal:
  outcome: >-
    E2E 가 marker 로 분리되어 기본 실행에서 빠지고, credential 이 없으면 skip 하되 그
    사실이 출력된다. amplai-foundry verify 는 network 없이 계속 통과한다.
  user_value: >-
    조용한 통과가 gate 를 무효로 만든다. "안 돌았다" 가 보이면서 clean clone 은 초록이다.

source:
  feature: MGC-012
  files:
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/spec.md
      section: FR-019, FR-020
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/plan.md
      section: P-003
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/contracts/slack-http-transport.md
      section: H-5
    - path: specs/002-mgc-012-package-4-slack-reference-e2e/research.md
      section: R-015
  requirements:
    - FR-019
    - FR-020
  decisions: []

# 2026-08-08 scope 확장. 사용자가 명시 승인했고 D-028 이 근거다. `loop.stop_conditions` 의
# `scope_boundary_must_expand` 를 조용히 넘기지 않고 결정으로 남긴다.
# 더한 것 둘 — (1) channel ID·app ID 환경변수를 계약 H-4.1 에 확정하고 loader 를 만든다,
# (2) W2-pytest-import-mode 를 같은 파일을 여는 김에 닫는다.
scope:
  include:
    - pytest marker 등록과 기본 deselect
    - credential 부재 시 skip 과 그 이유 출력
    - amplai-foundry verify 가 network 없이 통과하는 것 확인
    - channel ID·app ID 환경변수 확정과 네 변수 tri-state loader (D-028)
    - W2-pytest-import-mode 를 pythonpath 명시로 닫기 (D-028)
  exclude:
    - 실제 Slack 호출 (T010 소유)
    - verify 에 stage 추가
  allowed_paths:
    - pyproject.toml
    - tests/test_slack_http.py
    - src/amplai_foundry/governance/slack_http.py
    - specs/002-mgc-012-package-4-slack-reference-e2e/contracts/slack-http-transport.md
  forbidden_paths:
    - src/amplai_foundry/governance/slack_projection.py
    - src/amplai_foundry/governance/slack.py
    - src/amplai_foundry/governance/events.py
    - src/amplai_foundry/governance/projections.py
    - src/amplai_foundry/verification/runner.py

dependencies:
  tasks:
    - MGC-012-T006
    - MGC-012-T007
  external: []

implementation:
  guidance:
    - skip 이지 fail 이 아니다 (plan P-003). credential 없는 clean clone 에서 기본 suite 가
      빨간색이 되면 개발자가 그 실패를 일상적으로 무시하게 되어 진짜 회귀를 가린다.
    - pass 로 조용히 넘기지도 않는다. Constitution III 위반이다.
    - pyproject.toml 을 연다. Package 3 가 그 파일을 forbidden 에 뒀던 것은 Package 3
      task 의 scope 였고 전역 금지가 아니다.
  invariants:
    - amplai-foundry verify 는 network 를 요구하지 않는다.
    - skip 은 이유와 함께 출력된다.
  non_goals:
    - verify 에 8번째 stage 추가.
    - 별도 CLI 명령 신설.

acceptance:
  behaviors:
    - id: AC-01
      given: credential 환경변수가 없는 상태
      when: E2E marker 를 지정해 pytest 를 돌리면
      then: skip 으로 보고되고 그 이유가 출력된다. pass 로 집계되지 않는다
    - id: AC-02
      given: credential 이 없는 상태
      when: 인자 없이 python -m pytest 를 돌리면
      then: E2E 가 아예 선택되지 않고 전체가 통과한다
    - id: AC-03
      given: network 가 없는 환경
      when: amplai-foundry verify 를 돌리면
      then: 7 stage 가 모두 통과한다
    - id: AC-04
      given: 등록된 marker 목록을 조회하는 상태
      when: 확인하면
      then: E2E marker 가 등록돼 있어 unknown marker 경고가 나지 않는다
    # 2026-08-08 추가. D-028 이 scope 를 넓혔는데 대응 AC 가 없었다 — 그래서 loader 의
    # 결함(빠진 이름을 전부 안 적음)을 대조할 지점이 없었고 round 1 review 가 그것을 P1 로
    # 잡았다. scope 를 넓히면 acceptance 도 함께 넓힌다 (wave 6 contract review).
    - id: AC-05
      given: 네 환경변수가 다 있는 상태
      when: 구성을 읽으면
      then: SlackSettings 하나로 모이고 secret 둘은 SecretStr 이다
    - id: AC-06
      given: 네 환경변수가 다 없거나 다 비어 있는 상태
      when: 구성을 읽으면
      then: 구성 안 됨으로 읽는다. 오류가 아니다
    - id: AC-07
      given: 넷 중 하나라도 빠진 상태
      when: 구성을 읽으면
      then: >-
        오류이고 빠진 변수 **이름을 전부** 적는다. credential 이 부분일 때도 대상 둘의
        누락이 함께 실린다. 값은 message 에 안 들어간다
    - id: AC-08
      given: 부분 구성 상태에서 --showlocals 를 붙여 E2E 를 돌리는 상태
      when: 실행하면
      then: >-
        실패하고 빠진 이름을 보여주되 bot token 은 출력에 안 나온다. os.environ 을 받은
        frame 이 traceback 에 남으면 그 repr 이 환경 전체를 찍는다
  commands:
    - id: unit
      kind: test
      run: python -m pytest tests/test_slack_http.py
      required: true
    - id: regression
      kind: test
      run: python -m pytest
      required: true
    - id: lint
      kind: lint
      run: python -m ruff check .
      required: true
    - id: typecheck
      kind: typecheck
      run: python -m mypy
      required: true
    - id: verify
      kind: integration
      run: amplai-foundry verify
      required: true
  manual_checks: []
  evidence:
    - type: command_output
      source: unit
      required: true
    - type: command_output
      source: verify
      required: true

risk:
  level: medium
  concerns:
    - skip 을 pass 로 적는 실수가 gate 기록에서 일어날 수 있다. quickstart D 절이 그것을
      금지한다.
    - pyproject.toml 변경이 W2-pytest-import-mode 와 겹칠 수 있다.
  approvals: []

loop:
  max_attempts: 5
  replan_after_same_failure: 3
  stop_conditions:
    - acceptance_conflicts_with_approved_spec
    - required_external_dependency_missing
    - scope_boundary_must_expand
    - same_failure_class_reaches_replan_threshold

completion:
  # 2026-08-08 round 2 갱신. AC-05~08 을 더했고 넷 다 통과한다. round 1 review 가 P1 둘과
  # Blocking-P2 하나를 냈다 — 빠진 이름을 전부 안 적는 결함, 그 오류 경로를 test 가 안 타서
  # token 유출 mutation 이 살아남은 것, 그리고 D-028 scope 에 AC 가 없던 것. 셋 다 닫았다.
  # --showlocals 로 token 이 새던 것도 fixture 가 pytest.fail 로 바꿔 닫았다.
  #
  # AC-01~04 넷 다 통과한다. 설정 assertion 만으로 끝내지 않고 child process 로 pytest 를
  # 한 번 더 띄워 실제 선택·비선택·skip 을 봤다 — marker 와 addopts 는 pyproject.toml 이
  # 하는 일이라 in-process 로는 확인할 수 없다.
  #
  # AC-01: credential 을 지운 환경에서 `-m slack_e2e` 가 skip 1건과 이유를 출력한다.
  #        pass 는 0건이다.
  # AC-02: 인자 없는 실행이 E2E 를 고르지 않는다 (1021 passed, 1 deselected).
  # AC-03: `amplai-foundry verify` 7 stage 가 network 없이 통과한다.
  # AC-04: marker 가 등록돼 있어 PytestUnknownMarkWarning 이 없다.
  #
  # 부분 구성은 skip 이 아니라 오류다 — token·secret 만 준 실행이 빠진 두 변수 이름을
  # 적고 error 로 떨어지는 것을 확인했다 (H-4.1).
  all_acceptance_passed: true
  required_evidence_present: true
  # gate 는 아직이다. wave 6 의 3 lens review 가 끝나고 P0·P1·Blocking-P2 가 0건일 때만
  # 채운다. status 도 그때 done 으로 바꾼다.
  completed_at: null
  evidence_paths:
    - pyproject.toml
    - src/amplai_foundry/governance/slack_http.py
    - tests/test_slack_http.py

handoff:
  expected_changes:
    - pyproject.toml 에 marker 등록
    - tests/test_slack_http.py 확장
  notes:
    - pyproject.toml 을 여는 김에 index.yaml 의 W2-pytest-import-mode 를 함께 볼지
      판단한다. 강제하지는 않는다.
    - network 없이 돈다.
